window.GRID_DATA = {"cards_commit": "47b5eb7", "cards_date": "2026-11-15", "cards_dirty": false, "synced_at": "2026-11-16T05:36:25.653Z", "capacity": 25, "counts": {"a": 16, "b": 13, "c": 11, "d": 8, "e": 14, "f": 22, "g": 11, "h": 4}, "area_names": {"a": "Resource Prospecting and Characterization", "b": "Excavation", "c": "Processing and Extraction", "d": "Feedstock and Consumables Production", "e": "Storage and Transportation", "f": "In-Situ Construction and Manufacturing", "g": "Recycling and Waste Management", "h": "Strategic Resource and Propellant Architecture"}, "technologies": [{"slug": "altimetry-and-illumination-modelling", "path": "context/technologies/resource-prospecting-and-characterization/altimetry-and-illumination-modelling.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "09bdf29b21d250e3", "title": "Laser altimetry modelling", "blurb": "Models built on Lunar Orbiter Laser Altimeter polar elevation data rank polar sites by illumination and shadow. TRL 6 rests on models that reproduced LRO camera shadow features and correlated at 0.9 with the first ShadowCam image, with no lunar-surface check. The products are model outputs that shift with resolution.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "data-fusion-and-geospatial-decision-support", "path": "context/technologies/resource-prospecting-and-characterization/data-fusion-and-geospatial-decision-support.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "f0e2bd4fa417bddf", "title": "Geospatial data fusion", "blurb": "Fusion workflows combine orbital layers into ranked landing regions, sites and traverses for Artemis planning. TRL 6 is a model built on and checked against flight data; no prototype has run in an operational environment. No cited workflow reports its ranking accuracy, and no landing or in-situ ice measurement has tested a fused site choice.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "downhole-instrumented-drill-strings", "path": "context/technologies/resource-prospecting-and-characterization/downhole-instrumented-drill-strings.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "49b57e353b7a58e9", "title": "Downhole drill strings", "blurb": "Drill strings reached 305 cm on the Moon with a crew-operated drill and 2 m robotically. TRL 9 follows the study rule that any lunar use counts: Chang'e-5 drilled 1 m and logged force and current each second. No drill-string sensor has read a lunar borehole during drilling, and every hole deeper than about 3 m was drilled on Earth.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gamma-ray-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/gamma-ray-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2c023304de0d4b6f", "title": "Gamma-ray spectrometry", "blurb": "Gamma-ray spectrometers map thorium, potassium, iron, titanium and uranium from lunar orbit. TRL 9 covers orbital use only: Kaguya mapped uranium and thorium for 2,674 h from 100 km polar orbit. Small outcrops stay unresolved at a 150 km footprint and 130 km map resolution.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "ground-penetrating-radar", "path": "context/technologies/resource-prospecting-and-characterization/ground-penetrating-radar.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c97119d7737fb0d8", "title": "Ground-penetrating radar", "blurb": "Radar on a rover images lunar layering; Chang'e-4 reached 40 m. TRL 9 follows the study rule that any lunar use counts: Yutu-2's radar ran 6 h 28 min on the farside surface. No flown lunar radar result in the sources reviewed detects ice.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "heat-flow-probes", "path": "context/technologies/resource-prospecting-and-characterization/heat-flow-probes.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2044c3a3fa283c87", "title": "Heat-flow probes", "blurb": "Probes in drilled holes measure regolith temperature, gradient and conductivity. TRL 9 follows the study rule that any lunar use counts: the Apollo 15 and 17 probes recorded for more than four years each. LISTER measured only to 0.971 m against a 3 m design depth.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-situ-mass-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/in-situ-mass-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "24e2af485b788209", "title": "Mass spectrometry", "blurb": "Mass spectrometers on the lunar surface analyse gas. TRL 9 follows the study rule that any lunar use counts: Apollo 17 LACE ran ten lunations and MSolo returned 43 scans from IM-2. Neither analysed gas from icy regolith, and no flown instrument has analysed gas evolved from a lunar regolith sample.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-situ-optical-composition", "path": "context/technologies/resource-prospecting-and-characterization/in-situ-optical-composition.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "cae480823f330269", "title": "Rover spectrometers", "blurb": "Rover spectrometers read regolith oxides in place. TRL 9 follows the study rule that any lunar use counts and covers APXS and LIBS; Pragyan made 23 APXS measurements near 69.37 deg S. Only one lunar LIBS data set exists and it yields 13 usable investigations of 66; no Raman instrument has operated on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "lander-orbiter-sensing-platform", "path": "context/technologies/resource-prospecting-and-characterization/lander-orbiter-sensing-platform.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "622cc2026105d00e", "title": "Landers and orbiters", "blurb": "Orbiters and landers carry sensors to lunar orbit and the lunar surface. TRL 9 rests on Kaguya in orbit and the Chang'e-4 and Blue Ghost landers on the Moon. The level covers the carrier only and sets no instrument's level.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "machine-learning-analysis-software", "path": "context/technologies/resource-prospecting-and-characterization/machine-learning-analysis-software.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "efdc82e1682d5232", "title": "Machine learning tools", "blurb": "Machine-learning software detects craters and enhances images of permanently shadowed regions on archived lunar data. TRL 6 rests on models trained on LRO NAC images and checked against sunlit images and 50,000 human-vetted ShadowCam detections. Real lunar data has produced no ice-mapping result, and no model has run on flight hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "neutron-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/neutron-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "6035794e1ef0130d", "title": "Neutron spectrometry", "blurb": "Neutron detectors map polar hydrogen from lunar orbit: 0.1 wt% regional average, 0.49 wt% in Cabeus-1. TRL 9 covers orbital use only: LEND on LRO used 2009-2023 data. No source reviewed reports a neutron spectrometer on the lunar surface.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "psr-optical-imaging", "path": "context/technologies/resource-prospecting-and-characterization/psr-optical-imaging.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "949c1b99215d6a2b", "title": "Shadowed floor imaging", "blurb": "Orbital cameras image permanently shadowed region floors by secondary light. TRL 9 covers orbital use only: ShadowCam on KPLO and the LRO narrow-angle camera. ShadowCam found no widespread surface water ice; its detection limit is 20 to 30 wt%.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "resource-assessment-methodology", "path": "context/technologies/resource-prospecting-and-characterization/resource-assessment-methodology.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "c81aa97c78585228", "title": "Resource assessment method", "blurb": "The terrestrial reserve-classification method is applied to lunar data to rate resources and simulated ice. TRL 4 follows the study rule for model-only work: the method ran on published data for six resources and on a simulated ice deposit. No source reviewed reports a completed quantitative lunar assessment; water ice classifies only as a speculative unrecoverable resource.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "seismic-sensing", "path": "context/technologies/resource-prospecting-and-characterization/seismic-sensing.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "9482b3cd7457577c", "title": "Seismic sensing", "blurb": "Seismometers and geophones measure moonquakes, crust thickness and an 8.5 m regolith layer. TRL 9 follows the study rule that any lunar use counts: Apollo stations ran on the surface from 1969 to 1977. No cited seismic result detects ice.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "terramechanics-characterization", "path": "context/technologies/resource-prospecting-and-characterization/terramechanics-characterization.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a00f8ad259ad880f", "title": "Terramechanics", "blurb": "Penetrometers, samplers and rover wheels measure regolith density, cohesion, friction angle and bearing. TRL 9 follows the study rule that any lunar use counts: the Apollo penetrometer reached 76 cm and Yutu-2 wheel data gave shear parameters. Every value comes from the top few metres outside shadowed regions, and icy regolith has been tested only in terrestrial simulant.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "thermal-infrared-radiometry", "path": "context/technologies/resource-prospecting-and-characterization/thermal-infrared-radiometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "cd6fc41c793f9fc7", "title": "Thermal infrared imaging", "blurb": "Thermal radiometers map lunar surface temperature; Diviner on LRO has reached 29 K. TRL 9 covers orbital use only: Diviner has measured from polar orbit since 5 July 2009. No cited thermal-infrared instrument has measured from the lunar surface.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-excavation-and-hybrid-control", "path": "context/technologies/excavation-systems/autonomous-excavation-and-hybrid-control.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "842e83ba060bda39", "title": "Excavation autonomy", "blurb": "Software digs regolith under autonomy, teleoperation or a hybrid of both. TRL 4 follows the RASSOR 2.0 platform's stated level; the Autodig software ran in a laboratory bin at Kennedy Space Center. All other lunar autonomy results are simulations; none combines autonomy, signal delay and vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "bucket-drum-excavator", "path": "context/technologies/excavation-systems/bucket-drum-excavator.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "87e006275968a422", "title": "Bucket drum and wheel", "blurb": "Bucket drums, wheels and ladders dig regolith; ladders have reached 2,400 kg/h in sand. TRL 5 rests on vacuum tests of the IPEx drum excavator's actuators; wheel and ladder hardware alone rates a level lower. No such machine has dug in vacuum or true 1/6 g, and mission-scale figures rest on a slide deck and an abstract.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cold-tolerant-actuators", "path": "context/technologies/excavation-systems/cold-tolerant-actuators.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 8, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "20c7b0aedae5c94f", "title": "Cold-tolerant actuators", "blurb": "Actuators, motors and bearings drive rovers and diggers in lunar cold. TRL 8 rests on VIPER mobility actuators that passed thermal-vacuum qualification and acceptance testing, and on NIRISS gearmotors cycled to 35 K. No cited source reports a drive actuator running under load below -50 C.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "conveyors-belt-screw-trough", "path": "context/technologies/excavation-systems/conveyors-belt-screw-trough.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2df52f843a238e6a", "title": "Belt and screw conveyors", "blurb": "Belt, screw and trough conveyors lift regolith into reactors. TRL 5 comes from heritage: an inclined auger lifted Mauna Kea tephra about 2 m at 1 g, and belt conveyors are routine in terrestrial mining. None has a measured throughput in vacuum or lunar gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "dust-suppression-and-removal", "path": "context/technologies/excavation-systems/dust-suppression-and-removal.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8d427004036fa2a5", "title": "Dust suppression", "blurb": "Brushes, wipes and an electrodynamic dust shield clear dust from hardware. TRL 9 rests on the Apollo nylon brush, which removed coarse dust on the Moon in 1969-1972; the Blue Ghost shield sits lower. No Apollo method cleared dust fully, and no cleaning fraction from flight is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "dust-tolerant-mechanisms", "path": "context/technologies/excavation-systems/dust-tolerant-mechanisms.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8023242081b28c34", "title": "Dust-tolerant mechanisms", "blurb": "PTFE lip seals and grease-packed bearings keep lunar simulant out of moving parts. TRL 5 is component evidence: in a vacuum run of 10,000 cycles at room temperature, two lip seals let no simulant past. No cited test ran a seal or bearing in vacuum at lunar temperatures or in reduced gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "excavation-mobile-platform", "path": "context/technologies/excavation-systems/excavation-mobile-platform.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "84c4a9974fec0403", "title": "Excavation platform", "blurb": "A wheeled platform would carry excavation tools over the lunar surface. TRL 9 rests on Yutu-2, Apollo Lunar Roving Vehicle and Lunokhod wheels that ran on the Moon. No excavation-class platform has flown; the Canadian Space Agency lunar utility rover is in concept development.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "excavator-mobility", "path": "context/technologies/excavation-systems/excavator-mobility.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "dd4b08b2f19752ad", "title": "Excavator traction", "blurb": "Wheels give excavators traction in reduced-gravity soil. TRL 9 rests on Yutu-2 wheels that ran on the Moon at slip ratios of -0.1 and 0.1. No wheel has pulled under excavation load on the Moon, in vacuum or at true 1/6 g.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gravity-fed-hopper-flow", "path": "context/technologies/excavation-systems/gravity-fed-hopper-flow.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "4465474d7ed9afc6", "title": "Hopper and feeder flow", "blurb": "Vibrated hoppers with rotary-pocket feeders move regolith by gravity. TRL 6 rests on eight hopper-and-feeder assemblies that fed in 330 of 330 vibration-on runs at 0.16 g in parabolic flight. Every lunar-gravity hopper test ran in flight or drop-tower windows, none in hard vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "haul-truck-and-conventional-excavation", "path": "context/technologies/excavation-systems/haul-truck-and-conventional-excavation.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8d1a1e87363c6c97", "title": "Haul truck", "blurb": "Haul trucks and conventional equipment carry excavated regolith. TRL 5 rests on a wheel-level component: the Daca test-wheel rig ran in GRC-1 simulant at true 1/6 g in parabolic flight. No vehicle has hauled regolith in vacuum or at true 1/6 g, and the OffWorld and Canadian Space Agency vehicles are plans.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "icy-regolith-excavation", "path": "context/technologies/excavation-systems/icy-regolith-excavation.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "db7970a6dbee2d2b", "title": "Icy regolith excavation", "blurb": "Chain trenchers and milling-bit excavators cut hard and icy regolith, moving 62 kg/h of icy simulant. TRL 4 follows competition tests on low-strength material with 5/6 robot-weight offload in one event. No excavator has run in vacuum or lunar polar cold.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "passive-anti-adhesion-surfaces", "path": "context/technologies/excavation-systems/passive-anti-adhesion-surfaces.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2172c71a800a7584", "title": "Anti-adhesion surfaces", "blurb": "Laser-patterned and coated surfaces shed lunar dust without power. TRL 9 rests on a laser-patterned Ti-6Al-4V coupon that gathered dust and showed a cleaned surface on the Moon in 2025. No coverage, adhesion or cleaning value is reported; the one cleaning, shown only in a caption, has an unknown cause.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "robotic-arm-manipulator", "path": "context/technologies/excavation-systems/robotic-arm-manipulator.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "23cdb5a6d07e6605", "title": "Robotic arm", "blurb": "Robotic arms scoop and trench regolith for sampling. TRL 9 rests on the Surveyor III and Surveyor VII samplers, which trenched and ran bearing tests on the Moon in 1967 and 1968. No arm has dug beyond sampling scale; 2 kg is the largest arm collection reported on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "carbothermal-reduction", "path": "context/technologies/resource-processing-and-extraction/carbothermal-reduction.md", "area": "c", "areas": ["c", "b", "d", "h"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ca11e6c91f5cb7b5", "title": "Carbothermal reduction", "blurb": "Carbothermal reactors heat regolith to yield carbon monoxide, then oxygen. TRL 6 is the developers' stated level after thermal-vacuum tests of the Sierra Space COPR reactor; test runs alone support a level lower. The campaign reports no per-test oxygen yield, and the carbon monoxide to oxygen steps lay outside the tested hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "electrostatic-separation-of-regolith", "path": "context/technologies/resource-processing-and-extraction/electrostatic-separation-of-regolith.md", "area": "c", "areas": ["c"], "pointer": false, "author": "nikki", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "20c42036e4569f80", "title": "Electrostatic separation", "blurb": "Tribocharging sorts ilmenite from regolith; one pass doubled the ilmenite grade of a highland simulant. TRL 5 follows validation in reduced-gravity parabolic flight, and no source states a level. All flight runs were gram-scale single passes in an aircraft cabin; no run on file combines vacuum with reduced gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "helium-3-extraction", "path": "context/technologies/resource-processing-and-extraction/helium-3-extraction.md", "area": "c", "areas": ["c", "a", "b", "d", "e", "h"], "pointer": false, "author": "nikki", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e8e2958d2c5c57c3", "title": "Helium-3 extraction", "blurb": "Heated regolith releases helium-3; a heat-exchanger testbed removed up to 96 % of implanted helium-4, the surrogate, at 9.0 g/s. TRL 4 is a laboratory breadboard validation. No extraction unit has reported data from vacuum or reduced gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrogen-reduction-of-ilmenite", "path": "context/technologies/resource-processing-and-extraction/hydrogen-reduction-of-ilmenite.md", "area": "c", "areas": ["c", "d"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7b4137a5f0cdb92b", "title": "Hydrogen reduction", "blurb": "Hydrogen reduces ilmenite in regolith to yield oxygen, a few weight percent of the feed. TRL 6 takes the higher of NASA's 5/6 rating; test runs alone support two levels lower. No reactor has run in vacuum or thermal vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-place-thermal-mining", "path": "context/technologies/resource-processing-and-extraction/in-place-thermal-mining.md", "area": "c", "areas": ["c", "b", "e"], "pointer": false, "author": "nikki", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "959288bc018fe665", "title": "In-place thermal mining", "blurb": "Heaters sublimate ice from regolith in place. TRL 5 rests on a Block 1 breadboard that ran nearly fifty sublimation tests in a cryogenic-vacuum chamber. Test boundaries do not represent a permanently shadowed region; the capture tent and cold traps for a lunar unit exist only as designs.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "magnetic-separation-of-lunar-soils", "path": "context/technologies/resource-processing-and-extraction/magnetic-separation-of-lunar-soils.md", "area": "c", "areas": ["c"], "pointer": false, "author": "nikki", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7e4c36933e9ba117", "title": "Magnetic separation", "blurb": "Magnets concentrate anorthite, ilmenite and metallic iron from lunar soil. TRL 5 takes the higher of NASA's 4/5 rating for mineral separation; test runs alone support a level lower. No separator on file has run in reduced gravity or above gram scale.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "molten-regolith-electrolysis", "path": "context/technologies/resource-processing-and-extraction/molten-regolith-electrolysis.md", "area": "c", "areas": ["c", "d", "f"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2473c895d6f69373", "title": "Regolith electrolysis", "blurb": "Electric current frees oxygen from molten regolith. TRL 6 takes the higher of NASA's 5/6 rating, and a 25 kg reactor run for 9 hours in a vacuum chamber matches it. That level depends on one run that missed its energy-efficiency threshold, and anode, cathode and containment life is unproven.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "molten-salt-electrolysis-ffc", "path": "context/technologies/resource-processing-and-extraction/molten-salt-electrolysis-ffc.md", "area": "c", "areas": ["c", "d", "f"], "pointer": false, "author": "nikki", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e160e83650a07a4e", "title": "Molten salt electrolysis", "blurb": "Molten salt cells strip oxygen from regolith; laboratory FFC cells removed 85 to 99 % of it from 24-30 g simulant charges. TRL 4 is the 2026 review's stated level. No run on file is in vacuum or reduced gravity, and the anodes were consumed, broke or passivated.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "reactor-regolith-feed-and-discharge", "path": "context/technologies/resource-processing-and-extraction/reactor-regolith-feed-and-discharge.md", "area": "c", "areas": ["c", "b"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "14b23df42e206b3a", "title": "Reactor feed and discharge", "blurb": "Valves and feeders move regolith into and out of reactors. TRL 6 is the authors' level for a thermal-vacuum carbothermal prototype with automated handling; test runs alone support a level lower. No reactor valve has run in lunar gravity, and no measured seal wear life is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "thermal-water-extraction-excavated", "path": "context/technologies/resource-processing-and-extraction/thermal-water-extraction-excavated.md", "area": "c", "areas": ["c", "b", "e"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "00dd8db0ab429d93", "title": "Thermal water extraction", "blurb": "Heat drives water out of excavated icy regolith. TRL 6 rests on LUWEX, which extracted and captured water from a 13 kg simulant batch in thermal vacuum at 2.06 g/h. It needs liquid-nitrogen capture cooling and its seals fouled with dust; NASA's continuous auger-dryer reactor stopped two levels lower.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "vacuum-vapour-phase-pyrolysis", "path": "context/technologies/resource-processing-and-extraction/vacuum-vapour-phase-pyrolysis.md", "area": "c", "areas": ["c", "b", "d", "h"], "pointer": false, "author": "nikki", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "bbeff51639214feb", "title": "Vacuum pyrolysis", "blurb": "Heat in vacuum vaporizes regolith to release oxygen; a breadboard measured 35 mg O2 from 3.38 g of simulant under argon at about 13 mbar. TRL 4 is a laboratory breadboard validation. No high-vacuum or thermal-vacuum run has quantified oxygen; window failure and product condensation stay unresolved.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrogen-liquefaction", "path": "context/technologies/feedstock-and-consumables-production/hydrogen-liquefaction.md", "area": "d", "areas": ["d"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c849cdc38cfbd6cd", "title": "Hydrogen liquefaction", "blurb": "Cryocoolers chill hydrogen gas to liquid for propellant; ground units have liquefied over 200 kg in a 125,000 L tank. TRL 5 rests on the 20 W at 20 K cooler, validated in a vacuum bell jar, and liquefaction itself ran only in ambient air at 1 g. No liquefier has run in vacuum or on electrolyzer gas.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "oxygen-cryocooler-liquefaction", "path": "context/technologies/feedstock-and-consumables-production/oxygen-cryocooler-liquefaction.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0e9c34fa03964e4c", "title": "Oxygen liquefaction", "blurb": "A cryocooler liquefies oxygen inside a lander-scale tank at up to 1.56 kg/h. TRL 5 rests on four months of tank liquefaction in a thermal vacuum chamber against a 250 K Mars cold wall at half lander-tank scale. A flight-class cooler, condensation at reduced gravity and methane remain untested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "pem-water-electrolysis", "path": "context/technologies/feedstock-and-consumables-production/pem-water-electrolysis.md", "area": "d", "areas": ["d", "c"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "9e6dd417101d66ba", "title": "PEM electrolysis", "blurb": "PEM stacks split water into hydrogen and oxygen. TRL 7 rests on the ISS Oxygen Generation Assembly, which has run in orbit since 2007 and made 14,598 kg of oxygen on station potable water. No stack has run at lunar gravity or on lunar-derived water; the only lunar-gravity data are 18 s parabolic-flight runs of one cell design.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "product-gas-composition-analysis", "path": "context/technologies/feedstock-and-consumables-production/product-gas-composition-analysis.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0a4b1e0a0b704489", "title": "Product gas analysis", "blurb": "Analyzers measure oxygen purity and carbon monoxide in oxygen-plant product gas. TRL 9 follows the study rule that any lunar use counts: the MSolo analyzer took 43 scans of ambient and lander-vent gas on the Moon. No analyzer has measured plant product gas on the Moon, and the only tank-oxygen acceptance against a purity limit reports no measured values.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "product-gas-drying", "path": "context/technologies/feedstock-and-consumables-production/product-gas-drying.md", "area": "d", "areas": ["d"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "418c76ed3ef40249", "title": "Product gas drying", "blurb": "Regenerative desiccant beds dry product gas before liquefaction; a JSC breadboard reached 15 ppmv water in a 4-hour laboratory run. TRL 5 follows ISS heritage for silica gel and zeolite 13X beds. No dryer has a reported outlet moisture in vacuum or over regenerated cycles.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "sabatier-methanation", "path": "context/technologies/feedstock-and-consumables-production/sabatier-methanation.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c5072003a907f3c7", "title": "Sabatier methanation", "blurb": "A Sabatier reactor turns carbon dioxide and hydrogen into methane and water. TRL 7 rests on the ISS Sabatier Assembly, which ran in orbit from 2011 to 2017 and made about 1,081 kg of water. No source reviewed reports a vacuum test, and no lunar carbon feed has Sabatier figures.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solid-oxide-electrolysis", "path": "context/technologies/feedstock-and-consumables-production/solid-oxide-electrolysis.md", "area": "d", "areas": ["d", "c"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "64230eae3d66824f", "title": "Solid oxide electrolysis", "blurb": "Solid oxide stacks split carbon dioxide or steam to make oxygen. TRL 7 rests on MOXIE, which produced 49.9 g of oxygen on Mars from atmospheric CO2. No stack has run on lunar feed, and steam electrolysis, the mode a lunar water plant would use, draws on an abstract with no numbers and a NASA claim citing no test report.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "water-cleanup-adsorption-filtration", "path": "context/technologies/feedstock-and-consumables-production/water-cleanup-adsorption-filtration.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "04fc2ee9a3bca5b1", "title": "Water cleanup", "blurb": "Filtration, adsorbent and ion-exchange beds and a catalytic reactor clean wastewater. TRL 7 rests on the ISS Water Processor Assembly, which has cleaned crew-loop wastewater in orbit since 2008. The only evidence for cleaning simulated ISRU water is one laboratory paper and slide-level claims.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "active-cooling-zero-boil-off", "path": "context/technologies/storage-and-transportation/active-cooling-zero-boil-off.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "17746721476222ee", "title": "Zero boil-off cooling", "blurb": "Active cooling holds cryogenic propellant with no vent: liquid methane for 165 days from ground fill, and liquid hydrogen at zero boil-off in a 125 m3 ground tank. TRL 7 rests on the Robotic Refueling Mission 3 methane hold of about 4 months on the ISS. Hydrogen zero boil-off has no vacuum, lunar-surface or reduced-gravity test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "automated-fluid-power-data-umbilical", "path": "context/technologies/storage-and-transportation/automated-fluid-power-data-umbilical.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "603f3a041bcfe625", "title": "Automated umbilical", "blurb": "A dust-tolerant umbilical mates fluid, power and data lines to a vehicle. TRL 4 rests on a KSC prototype mounted on a vehicle to mate with a pallet and a rover field test, both reported without conditions. No test with fluid or dust simulant is reported, and none covers vacuum, cycle count or leak rate.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "electromagnetic-mass-driver", "path": "context/technologies/storage-and-transportation/electromagnetic-mass-driver.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b3e97669f21ae3d1", "title": "Mass driver", "blurb": "A track of driven coils throws regolith or product to lunar orbit with no propellant. TRL 4 rests on three laboratory launchers, the fastest a test track at 256 km/h against 1.7 to 2.53 km/s needed. Every lunar launcher remains a paper design.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "frozen-water-containment-and-haul", "path": "context/technologies/storage-and-transportation/frozen-water-containment-and-haul.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ba23f9e4d7fce908", "title": "Frozen water haul", "blurb": "Extracted water freezes in a radiator-cooled tank in a permanently shadowed region and thaws in sunlight at the plant. TRL 5 rests on an aluminium plate that froze water vapour in vacuum at tanker pressure and wall temperature for 50-300 hours. No tank has been loaded through its radiator, hauled or thawed, and the 1/5-scale tanker has no reported test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "high-pressure-gas-storage", "path": "context/technologies/storage-and-transportation/high-pressure-gas-storage.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "90d2b322d0433c8c", "title": "High-pressure gas storage", "blurb": "Tanks hold gas at high pressure. TRL 9 follows the study rule that any lunar use counts: two 130 g nitrogen tanks filled to 30.3 MPa fed LISTER excavation on the lunar surface in March 2025. No oxygen or hydrogen product store has a reported pressure-cycle, permeation or thermal test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrolox-turbine-power-plant", "path": "context/technologies/storage-and-transportation/hydrolox-turbine-power-plant.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "24df0a884731b4cb", "title": "Hydrolox turbine plant", "blurb": "A closed hydrogen-oxygen turbine loop stores and returns power. TRL 4 comes from heritage: a rated-power oxy-fuel gas generator fired on a test stand and a 1956 semi-closed naval turbine. No source reviewed states round-trip efficiency for the loop or sizes the condenser radiator.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-space-cryogenic-transfer", "path": "context/technologies/storage-and-transportation/in-space-cryogenic-transfer.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c2be08c432c8be43", "title": "In-space cryo transfer", "blurb": "Tank-to-tank transfer moves cryogenic propellant between tanks in space. TRL 7 rests on Starship Flight 3, where one vehicle moved liquid oxygen between two of its tanks under settling acceleration in under 100 s. Transferred mass and flow rate are published only in nondimensional form, and no vehicle-to-vehicle, repeated or post-storage transfer has flown.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "mobile-cryogenic-transport-tank", "path": "context/technologies/storage-and-transportation/mobile-cryogenic-transport-tank.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "8f16e32c7c70b45c", "title": "Mobile cryogenic tank", "blurb": "A mobile cryogenic tank on a haul platform would carry lunar product. TRL 4 is the study rule's starting level for model-only work: the lunar tank is one model database entry and roadmap steps in one company briefing, with no stated capacity or boil-off. No built or tested lunar tank exists.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "passive-insulation-vapor-cooling", "path": "context/technologies/storage-and-transportation/passive-insulation-vapor-cooling.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "6ba724b20bc36bc5", "title": "Passive tank insulation", "blurb": "Foam, multilayer insulation and a vapor-cooled skirt cut heat load by 51 to 62 percent on a 4 m liquid hydrogen tank in ground thermal vacuum. TRL 7 rests on insulation flown on a 10 liter dewar on the ISS, with a tank temperature as the only result. A lunar-surface or shadowed-region thermal sink and a long hold are untested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regenerative-fuel-cells", "path": "context/technologies/storage-and-transportation/regenerative-fuel-cells.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0347d5290944a8bc", "title": "Regenerative fuel cells", "blurb": "Solar-powered electrolysis makes hydrogen and oxygen by day, and a fuel cell recombines them for night power and water. TRL 4 rests on a NASA Glenn breadboard that ran over 550 h through three simulated day/night cycles. It has had no environmental test.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "rf-mass-gauging", "path": "context/technologies/storage-and-transportation/rf-mass-gauging.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ed4317e7eeb67152", "title": "RF mass gauging", "blurb": "An antenna inside the tank sweeps a radio signal and matches the reflected spectrum to simulated fill levels, so the liquid need not be settled. TRL 9: it gauged oxygen and methane on the IM-1 lander through landing on the Moon. No surface storage tank or flight hydrogen has been gauged.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "surface-lander-propellant-fill", "path": "context/technologies/storage-and-transportation/surface-lander-propellant-fill.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3a8ea80456089a2e", "title": "Lander propellant fill", "blurb": "Cryogenic propellant is loaded into a landed vehicle's tanks. TRL 6 rests on a flight-qualified 216 L tank no-vent filled to 97 percent by mass in a vacuum chamber. No vehicle tank has been filled at lunar gravity or in lunar dust, and none through an autonomously mated connector or with propellant made from lunar material.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "surface-pipelines", "path": "context/technologies/storage-and-transportation/surface-pipelines.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "1d90ba14632be6c8", "title": "Surface pipelines", "blurb": "Fixed pipelines would move oxygen between lunar plants. TRL 4 rests on one NIAC Phase I model of a 5 km buried gaseous-oxygen line, one laboratory weld pressure-tested to 20 psig and terrestrial vacuum-jacketed line heritage. No pipe segment has run in vacuum or buried in regolith, and none has seen lunar subsurface temperature.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "water-storage", "path": "context/technologies/storage-and-transportation/water-storage.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b02398bb987384f9", "title": "Water storage", "blurb": "Tanks hold liquid water at the plant and depot. TRL 9 follows the study rule that any lunar use counts: bladder tanks stored water in every Apollo Lunar Module. Every flown store held a few hundred liters or less inside a crew vehicle, and no tank has held ISRU water through a lunar night.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-robotic-construction-platforms", "path": "context/technologies/construction-and-manufacturing/autonomous-robotic-construction-platforms.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a0647fa2c41d0543", "title": "Robotic construction", "blurb": "Robotic platforms unload payloads, fork pallets and scoop sand; a crane test-bed is sized for 1,000 kg on the Moon. TRL 3 rests on a 1 g field test in air under teleoperation plus laboratory autonomy work; fixed work-cell assembly is a level higher. No source reviewed shows terrain construction by a mobile platform under little supervision.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "basalt-fibre-and-glass-from-regolith", "path": "context/technologies/construction-and-manufacturing/basalt-fibre-and-glass-from-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "d61776bbcbfdaa86", "title": "Basalt fibre and glass", "blurb": "Furnaces draw continuous fibre from mare-type simulants at up to 1,438 MPa mean strength and melt simulant into glass. TRL 4 rests on laboratory furnaces and winders with simulant; highland simulants failed to draw or needed imported B2O3. No fibre has been drawn in vacuum or at 1/6 g.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "binder-jet-regolith-printing", "path": "context/technologies/construction-and-manufacturing/binder-jet-regolith-printing.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "85ee02bc950fdf41", "title": "Binder-jet printing", "blurb": "Binder printing builds simulant parts, including a 1.5 tonne block on a D-Shape printer. TRL 3 rests on a commercial machine run in air; liquid binder delivery in vacuum has only a droplet observation with no test data. No print in vacuum has data, and the one vacuum sintering condition distorted parts.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cast-and-extruded-molten-regolith", "path": "context/technologies/construction-and-manufacturing/cast-and-extruded-molten-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8e61c5fc4726ba61", "title": "Molten regolith casting", "blurb": "Simulant melted in air and cast reached 215 to 391 MPa in compression. TRL 3 rests on laboratory melts solidified in crucibles or cast into small pucks. The sources report no melting, casting or extrusion in vacuum, and the 3 ton, 100 kW furnace has no hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "deployable-and-spray-on-landing-surfaces", "path": "context/technologies/construction-and-manufacturing/deployable-and-spray-on-landing-surfaces.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "bb390c6415a909fc", "title": "Deployable landing pads", "blurb": "A textile blanket holds regolith in place under engine firings in air, and a spray-on pad would use alumina. TRL 3 is the blanket's level before its plume tests; the spray-on form sits a level lower. Neither form has a mass figure from hardware, and neither has a deployment test or vacuum test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "geopolymer-and-cement-regolith-concrete", "path": "context/technologies/construction-and-manufacturing/geopolymer-and-cement-regolith-concrete.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "55fe4286c18f7c46", "title": "Regolith concrete", "blurb": "Cement-type and geopolymer mixes bind regolith into mortar, reaching 10,970 psi with Apollo 16 soil. TRL 3 rests on small cubes, beams and filaments cured in laboratory air. In the one vacuum test, concrete exposed before four hours of setting lost most of its strength.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gravel-and-rock-paved-surfaces", "path": "context/technologies/construction-and-manufacturing/gravel-and-rock-paved-surfaces.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c342db33a82d87cc", "title": "Gravel and rock pads", "blurb": "Gravel and rock form the outer layer of a landing pad; caged anorthosite survived a small rocket plume in Earth atmosphere. TRL 3 is the level a NASA landing-pad paper gives rock piles. No source reviewed reports lunar-capable hardware that collects, sorts or lays rock.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-space-manufacturing-from-lunar-feedstock", "path": "context/technologies/construction-and-manufacturing/in-space-manufacturing-from-lunar-feedstock.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "871cf33da8c8bb48", "title": "In-space manufacturing", "blurb": "Orbital factories would build products from lunar material; the smallest sized case lands roughly 1,000 metric tons on the Moon. TRL 3 rests on heritage from orbital beam printing tested on the ground in thermal vacuum with Earth feedstock. None reports hardware that has processed lunar or simulant feedstock in orbit.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "laser-sintering-and-melting-of-regolith", "path": "context/technologies/construction-and-manufacturing/laser-sintering-and-melting-of-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "5943d3da07546fdf", "title": "Laser regolith melting", "blurb": "Lasers melt simulant into paving elements about 220 mm across and bench-top domes at up to 10 g/min. TRL 4 rests on laboratory hardware, including specimens made in vacuum. No pad or road section has been built in dirty thermal vacuum, and the sources give no system mass or electrical power.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-additive-manufacturing-of-parts", "path": "context/technologies/construction-and-manufacturing/metal-additive-manufacturing-of-parts.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a40c47b8b19092be", "title": "Metal part printing", "blurb": "Wire-fed printers make metal parts; a 300 W, 180 kg laser printer made a 316L stainless-steel specimen on the ISS. TRL 5 rests on component operation in space and in vacuum at 0 g. No source reviewed reports lunar-gravity or dust testing, or printing from regolith-derived metal.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-casting-from-regolith-derived-metals", "path": "context/technologies/construction-and-manufacturing/metal-casting-from-regolith-derived-metals.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "284ae67ab3e3cd53", "title": "Metal casting", "blurb": "Casting and forming would shape metal tapped from a molten regolith electrolysis reactor. TRL 3 rests on heritage: a planned casting stage draws on a built counter-gravity withdrawal device and an operational slag and iron slicer. No source reviewed reports any part made from regolith-derived metal by casting, rolling or forming.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "microwave-sintering-of-regolith", "path": "context/technologies/construction-and-manufacturing/microwave-sintering-of-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b90bbd62b1499835", "title": "Microwave sintering", "blurb": "Microwave energy sinters highland simulant in vacuum into slabs as heavy as 1.4 kg, using 2.2 to 2.9 kWh/kg. TRL 3 rests on a fixed applicator above a container of simulant; the mobile version is a concept. The largest vacuum tile cracked, and no applicator has traversed a regolith bed.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "modular-habitat-construction", "path": "context/technologies/construction-and-manufacturing/modular-habitat-construction.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e6a0f29faee06806", "title": "Modular habitats", "blurb": "Inflatable habitat shells passed ground tests at module scale for burst, leak before burst and vacuum deployment. TRL 3 follows the level stated for the lunar habitat fabric; the surface airlock is a level lower. No source reviewed reports deploying, joining or covering a module under lunar surface conditions.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "polymer-bound-regolith", "path": "context/technologies/construction-and-manufacturing/polymer-bound-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "45fe3a3c46db7891", "title": "Polymer-bound regolith", "blurb": "A 175 kg gantry prints simulant bound with polylactic acid at 0.6 kg/hr in dirty thermal vacuum. TRL 4 holds because the extruder and gantry are laboratory equipment and strength was measured only at ambient temperature. The binder is launched mass, and no flight print system has a stated mass or power.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "polymer-printing-and-recycling", "path": "context/technologies/construction-and-manufacturing/polymer-printing-and-recycling.md", "area": "f", "areas": ["f", "g"], "pointer": false, "author": "shaun", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3cf4cf30c9bb36af", "title": "Polymer printing", "blurb": "Filament printers made 55 ABS parts and over 100 further parts on the ISS. TRL 7 rests on printers making parts in space inside the ISS cabin; the recycler flew with no recycling result reported. No source reviewed reports a test in lunar surface conditions or a local source of polymer.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regolith-cover-radiation-shielding", "path": "context/technologies/construction-and-manufacturing/regolith-cover-radiation-shielding.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "07410aaef58dcaf1", "title": "Regolith radiation cover", "blurb": "A regolith cover of 3 m to 7 m shelters crews; tens of g/cm2 stop solar particle events. TRL 3 rests on analysis and beam tests on soil samples; the only built article is a hand-filled fabric bag with no regolith fill. No source reports a machine placing regolith or simulant over a structure.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regolith-grading-compaction-and-berms", "path": "context/technologies/construction-and-manufacturing/regolith-grading-compaction-and-berms.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2ba57ed02b608ba5", "title": "Grading and compaction", "blurb": "Rover blades grade regolith and build berms; a 4.1 m blade graded 25 m x 25 m and built a 1.3 m berm in natural sand. TRL 5 rests on a plate compactor validated in vacuum and a grading system run in a large lunar test bed. Grading and berm building have no vacuum or low-gravity result.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "robotic-assembly-of-modular-truss-structures", "path": "context/technologies/construction-and-manufacturing/robotic-assembly-of-modular-truss-structures.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3c2fc165cb8ee7dc", "title": "Robotic truss assembly", "blurb": "Robots assemble truss structures: a 256-cell lattice shelter and a five-bay 4.5 m tower section. TRL 4 is stated by the authors of the tower demonstration. Both builds ran in air at 1 g with hand-placed parts, and no source reports a test in vacuum, dust or reduced gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "sintered-pavers-and-bricks", "path": "context/technologies/construction-and-manufacturing/sintered-pavers-and-bricks.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "95a8e365728d7085", "title": "Sintered pavers", "blurb": "Kiln-sintered basalt pavers were placed by a tele-operated rover and survived rocket exhaust on Earth with little to no erosion. TRL 4 rests on kiln firing, robotic placement and plume tests in air. No full-size paver has been fired in vacuum, and lunar oven mass and energy come from a model.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solar-cell-fabrication-from-regolith", "path": "context/technologies/construction-and-manufacturing/solar-cell-fabrication-from-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "73ebcb50f9594962", "title": "Regolith solar cells", "blurb": "Glass substrates melted from lunar simulant carry perovskite cells that reached 12.1% under AM0, with the absorber imported. TRL 3 rests on substrate melting, film evaporation and small cells shown separately in terrestrial laboratories. Silicon diodes on simulant glass gave no light response.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solar-concentrator-sintering", "path": "context/technologies/construction-and-manufacturing/solar-concentrator-sintering.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "9e9d42ab7f8d3442", "title": "Solar sintering", "blurb": "Concentrated light sinters JSC-1 and JSC-2A simulant in air to a depth of about 6 mm. TRL 4 rests on laboratory and field hardware with simulant in air. The one element printed in vacuum disintegrated; the sole system mass on record is a concept estimate of 18 t for a 20 m mirror.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "sulfur-concrete", "path": "context/technologies/construction-and-manufacturing/sulfur-concrete.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "214dc3331c67c650", "title": "Sulfur concrete", "blurb": "Sulfur concrete cast with JSC-1 simulant reached about 35 MPa in compression. TRL 3 rests on small cast samples tested in air, in a vacuum chamber and in liquid nitrogen. Sulfur escaped continuously in vacuum at 20 C, and the sulfur supply is only a paper estimate.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-maintenance-of-isru-hardware", "path": "context/technologies/recycling-and-waste-management/autonomous-maintenance-of-isru-hardware.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "draft", "source_hash": "247a59fd155b278c", "title": "Autonomous maintenance", "blurb": "Robots would inspect, swap and repair ISRU and excavation hardware. TRL 4 rests on orbital robotic heritage and a spares calculation with a quarter-scale printed model. No source reviewed reports a robot servicing regolith-handling equipment.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "bioregenerative-life-support", "path": "context/technologies/recycling-and-waste-management/bioregenerative-life-support.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "37086a7a7b56fda3", "title": "Biological life support", "blurb": "Bioregenerative life support recycles oxygen and water through plants and microbes for a crew. TRL 7 rests on flown crop chambers: Svet on Mir, Lada and the Biomass Production System on the ISS. Crew-scale closure is ground only (Bios-3, MELiSSA), and none of the 6 sources reviewed reports a lunar test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "crew-solid-waste-and-trash-processing", "path": "context/technologies/recycling-and-waste-management/crew-solid-waste-and-trash-processing.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "54b7a6fffe2ef55f", "title": "Crew waste processing", "blurb": "Toilets and trash reactors process crew solid waste; the OSCAR reactor burned simulated crew waste in two suborbital flights. TRL 7 rests on the UWMS toilet's limited checkout on the ISS in October-November 2021. That demonstration is incomplete, the unit is in stand-down, and none of the 7 sources reviewed reports operation on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "end-of-life-hardware-dismantling-and-reuse", "path": "context/technologies/recycling-and-waste-management/end-of-life-hardware-dismantling-and-reuse.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "d161065cfb67e3e3", "title": "Dismantling and reuse", "blurb": "A centrifugal mill size-reduces space-grade cable for recycling. TRL 4 rests on one laboratory mill test of 22 AWG cable with few trials. No vacuum, dust or lunar-temperature test is reported, and none of the six sources reviewed reports dismantling or retrieval practice beyond design recommendation.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "habitat-atmosphere-and-oxygen-loop-closure", "path": "context/technologies/recycling-and-waste-management/habitat-atmosphere-and-oxygen-loop-closure.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7e7b37b58d8518b2", "title": "Habitat oxygen loop", "blurb": "The ISS runs oxygen generation, CO2 removal and Sabatier reduction as a loop. TRL 9 rests on orbital use under the study rule; the Oxygen Generation Assembly made 14,598 kg of oxygen since 2007. Oxygen closure is limited to about 50% with methane vented, and no CO2 reduction system operates after the 2024 cancellation of Sabatier 2.0.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "habitat-water-recovery-systems", "path": "context/technologies/recycling-and-waste-management/habitat-water-recovery-systems.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 9, "evidence_level": "demonstrated hardware", "status": "draft", "source_hash": "1d03dca5af0fc8c9", "title": "Habitat water recovery", "blurb": "Habitat water recovery reclaims urine and wastewater. TRL 9 rests on orbital use under the study rule: the ISS Urine and Water Processor Assemblies have run since November 2008, with US urine recovery at 87%. The evidence is orbital plus a ground testbed, with no lunar-surface operation reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "industrial-ecology-closed-loop-feedstock-reuse", "path": "context/technologies/recycling-and-waste-management/industrial-ecology-closed-loop-feedstock-reuse.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a50c806a1a2e4cc0", "title": "Feedstock reuse loop", "blurb": "A closed loop would turn lunar plant waste back into feedstock. TRL 4 rests on laboratory molten-salt results with regolith simulant for one component, the FFC process. The loop is reported unbuilt and untested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "spent-salt-slag-and-electrode-management", "path": "context/technologies/recycling-and-waste-management/spent-salt-slag-and-electrode-management.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "07802705c221d227", "title": "Spent salt and slag", "blurb": "Equipment would handle spent molten salt, slag and used electrodes after they leave the reactor. TRL 4 rests on mass-balance models of the slag, metal and emission streams. None of the nine sources reviewed reports tested storage, regeneration or stacking hardware; in-reactor slag removal is area (c).", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "tailings-and-spent-regolith-handling", "path": "context/technologies/recycling-and-waste-management/tailings-and-spent-regolith-handling.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a532c2f694145155", "title": "Tailings handling", "blurb": "Conveyors, hoppers and vehicles move spent regolith to a tailings pile. TRL 5 rests on IPEx bucket-drum actuators run through dig-and-dump tests in vacuum. No pile, stacking or containment test of spent regolith is reported, and tailings mass exceeds product mass by about 16.5 to 87 times.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "waste-gas-and-volatile-byproduct-capture", "path": "context/technologies/recycling-and-waste-management/waste-gas-and-volatile-byproduct-capture.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "5d233b9c01e982a2", "title": "Waste gas capture", "blurb": "Sorbent beds would capture sulfur, hydrogen, helium and carbon-bearing gases released by heating regolith. TRL 4 rests on analysis: sulfur yield and energy estimates and a literature synthesis of sample heating experiments. None of the 7 sources reviewed reports a capture article tested under stated conditions.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "waste-sorting-classification-and-tracking", "path": "context/technologies/recycling-and-waste-management/waste-sorting-classification-and-tracking.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 3, "evidence_level": "concept", "status": "fact-checked", "source_hash": "64a49636a860364f", "title": "Waste sorting", "blurb": "A three-axis classification scheme would sort and track lunar waste. TRL 3 rests on a two-measurement soil classification tested against Apollo 17 samples, which got 48% right for both measures. No sorting or tracking article is reported built or tested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cislunar-propellant-supply-architecture", "path": "context/technologies/strategic-downstream-products-architecture/cislunar-propellant-supply-architecture.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "draft", "source_hash": "d9572c1248c91d82", "title": "Cislunar propellant supply", "blurb": "The architecture would supply lunar LOX/LH2 to cislunar customers. TRL 4 is the study's starting level for work that exists only as models; the cost models and studies reviewed report no hardware result. Its economic case rests on assumed plant performance, plant lifetime and campaign size.", "locked": false, "split":   // ranking = window.RANKING_DATA (display/ranking.json); null or undefined reads as empty. One value per
  // field; rank is a position people set. Scores and the weighted total never reorder a list.

  var TIER_NAMES = ["primary", "reserve"];
  var CRIT_IDS = ["C1", "C2", "C3", "C4", "C5", "C6", "C7", "C8"];
  var DEFAULT_CAP = 25;

  function rankingSection(ranking, key) {
    var v = ranking && ranking[key];
    return isMap(v) ? v : {};
  }

  function sameList(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function dataTier(ranking, slug) {
    var r = rankingSection(ranking, "tiers")[slug];
    return r && r.tier ? r.tier : "primary";
  }

  function dataScore(ranking, slug, crit) {
    var f = (rankingSection(ranking, "scores")[slug] || {})[crit];
    return f && typeof f.v === "number" ? f.v : null;
  }

  function effectiveTier(data, ranking, state, slug) {
    var r = state && state.tiers && state.tiers[slug];
    if (r) return r.to;
    return dataTier(ranking, slug);
  }

  function effectiveOrder(data, ranking, state, area) {
    var rec = state && state.order && state.order[area];
    var stored = rec ? rec.to : ((rankingSection(ranking, "order")[area] || {}).list || []);
    var here = {};
    data.technologies.forEach(function (t) {
      if (effectiveArea(data, state, t.slug) === area && effectiveTier(data, ranking, state, t.slug) === "primary") {
        here[t.slug] = 1;
      }
    });
    var ranked = [];
    (stored || []).forEach(function (s) {
      if (here[s] && ranked.indexOf(s) < 0) ranked.push(s);
    });
    var rest = Object.keys(here).filter(function (s) { return ranked.indexOf(s) < 0; });
    return { ranked: ranked, unranked: byTitle(data, state, rest) };
  }

  function flatOrder(data, ranking, state, area) {
    var eo = effectiveOrder(data, ranking, state, area);
    return eo.ranked.concat(eo.unranked);
  }

  function dataOrder(data, ranking, area) {
    return flatOrder(data, ranking, emptyState(), area);
  }

  // Writes the whole effective order; `from` is the data order, kept from the first local change.
  // The `at` of the stored order record (null when the area has none): an order record's from_at (F1).
  function storedOrderAt(ranking, area) {
    var r = rankingSection(ranking, "order")[area];
    return r && r.at ? r.at : null;
  }

  // Writes the whole effective order; `from` (with from_at) is the data order, kept from the first local change.
  function writeOrder(data, ranking, state, area, list, at) {
    var s = cloneState(state);
    var rec = s.order[area];
    var from = rec ? rec.from : dataOrder(data, ranking, area);
    if (sameList(list, from)) { delete s.order[area]; return s; }
    var out = { from: from.slice(), to: list.slice(), at: at };
    if (!rec) out.from_at = storedOrderAt(ranking, area);
    else if (has(rec, "from_at")) out.from_at = rec.from_at;
    s.order[area] = out;
    return s;
  }

  // The data's stored order for an area, filtered to the data's primary cards there.
  function storedRanked(data, ranking, area) {
    return effectiveOrder(data, ranking, emptyState(), area).ranked;
  }

  function dataPrimaryFilter(data, ranking, area, list) {
    var here = {};
    data.technologies.forEach(function (t) {
      if (t.area === area && dataTier(ranking, t.slug) === "primary") here[t.slug] = 1;
    });
    return (list || []).filter(function (x, i) { return here[x] && list.indexOf(x) === i; });
  }

  function moveRank(data, ranking, state, slug, delta, at) {
    var area = effectiveArea(data, state, slug);
    var list = flatOrder(data, ranking, state, area);
    var i = list.indexOf(slug);
    var j = i + delta;
    if (i < 0 || j < 0 || j >= list.length || j === i) return cloneState(state);
    list.splice(i, 1);
    list.splice(j, 0, slug);
    return writeOrder(data, ranking, state, area, list, at);
  }

  function setRank(data, ranking, state, slug, n, at) {
    if (!entryOf(data, slug)) return { ok: false, reason: "unknown technology '" + slug + "'" };
    if (effectiveTier(data, ranking, state, slug) !== "primary") {
      return { ok: false, reason: "a reserve card has no rank; move it to primary first" };
    }
    var area = effectiveArea(data, state, slug);
    var list = flatOrder(data, ranking, state, area);
    if (typeof n !== "number" || !Number.isInteger(n) || n < 1 || n > list.length) {
      return { ok: false, reason: "rank must be a whole number from 1 to " + list.length };
    }
    list.splice(list.indexOf(slug), 1);
    list.splice(n - 1, 0, slug);
    return { ok: true, state: writeOrder(data, ranking, state, area, list, at) };
  }

  function setOrder(data, ranking, state, area, list, at) {
    var cur = flatOrder(data, ranking, state, area);
    if (!Array.isArray(list) || list.length !== cur.length) {
      return { ok: false, reason: "the order must list the area's " + cur.length + " primary cards" };
    }
    for (var i = 0; i < list.length; i++) {
      if (cur.indexOf(list[i]) < 0 || list.indexOf(list[i]) !== i) {
        return { ok: false, reason: "the order must list each of the area's primary cards once" };
      }
    }
    return { ok: true, state: writeOrder(data, ranking, state, area, list, at) };
  }

  function setTier(data, ranking, state, slug, tier, at) {
    if (TIER_NAMES.indexOf(tier) < 0) throw new Error("tier must be primary or reserve, got '" + tier + "'");
    mustEntry(data, slug);
    var s = cloneState(state);
    var cur = dataTier(ranking, slug);
    if (tier === cur) delete s.tiers[slug];
    else s.tiers[slug] = { from: cur, to: tier, at: at };
    return s;
  }

  function effectiveScore(data, ranking, state, slug, crit) {
    var r = state && state.scores && state.scores[slug] && state.scores[slug][crit];
    if (r) return r.to == null ? null : r.to;
    return dataScore(ranking, slug, crit);
  }

  function isScore(v) {
    return typeof v === "number" && Number.isInteger(v) && v >= 1 && v <= 3;
  }

  function setScore(data, ranking, state, slug, crit, value, at) {
    if (!entryOf(data, slug)) return { ok: false, reason: "unknown technology '" + slug + "'" };
    if (CRIT_IDS.indexOf(crit) < 0) return { ok: false, reason: "criterion must be one of C1-C8" };
    if (value !== null && !isScore(value)) return { ok: false, reason: "a score is 1, 2 or 3 (or Clear)" };
    var s = cloneState(state);
    var cur = dataScore(ranking, slug, crit);
    var fields = s.scores[slug] || {};
    if (value === cur) delete fields[crit];
    else fields[crit] = { from: cur, to: value, at: at };
    if (Object.keys(fields).length) s.scores[slug] = fields;
    else delete s.scores[slug];
    return { ok: true, state: s };
  }

  // Sum of value x weight when every criterion is set (9-27 for C1-C8 with C3 x2), else "k/8".
  function weightedTotal(values, criteria) {
    var crit = criteria || [];
    var k = 0, sum = 0;
    crit.forEach(function (c) {
      var v = values ? values[c.id] : null;
      if (v != null) { k++; sum += v * c.weight; }
    });
    return k === crit.length ? sum : k + " of " + crit.length + " set";
  }

  function tierCounts(data, ranking, state) {
    var out = {};
    LETTERS.split("").forEach(function (L) { out[L] = { primary: 0, reserve: 0 }; });
    data.technologies.forEach(function (t) {
      var a = effectiveArea(data, state, t.slug);
      if (out[a]) out[a][effectiveTier(data, ranking, state, t.slug)]++;
    });
    return out;
  }

  function capOf(ranking, tier) {
    var c = ranking && ranking.caps && ranking.caps[tier];
    return typeof c === "number" ? c : DEFAULT_CAP;
  }

  // Over-cap counts: a warning only ("<area>: <n> / <cap> <tier>"); nothing is blocked.
  function capWarnings(data, ranking, state) {
    var counts = tierCounts(data, ranking, state);
    var out = [];
    LETTERS.split("").forEach(function (L) {
      TIER_NAMES.forEach(function (tier) {
        var cap = capOf(ranking, tier);
        if (counts[L][tier] > cap) out.push(L + ": " + counts[L][tier] + " / " + cap + " " + tier);
      });
    });
    return out;
  }

  function rankingPending(state) {
    if (!state) return 0;
    var n = Object.keys(state.order || {}).length + Object.keys(state.tiers || {}).length;
    Object.keys(state.scores || {}).forEach(function (slug) { n += Object.keys(state.scores[slug] || {}).length; });
    return n;
  }

  // `by` of the latest `at` across a card's score fields and tier record in the data ("-" when none).
  function lastBy(ranking, slug) {
    var recs = [];
    var sc = rankingSection(ranking, "scores")[slug] || {};
    Object.keys(sc).forEach(function (k) { recs.push(sc[k]); });
    var t = rankingSection(ranking, "tiers")[slug];
    if (t) recs.push(t);
    var best = null, bestT = null;
    recs.forEach(function (r) {
      var ms = Date.parse(r.at);
      if (isNaN(ms)) return;
      if (bestT === null || ms > bestT) { bestT = ms; best = r.by || "-"; }
    });
    return best || "-";
  }

  function matrixRows(data, ranking, state, area) {
    var eo = effectiveOrder(data, ranking, state, area);
    var crit = (ranking && ranking.criteria) || [];
    var orderPending = !!(state && state.order && state.order[area]);
    return eo.ranked.concat(eo.unranked).map(function (slug, i) {
      var e = mustEntry(data, slug);
      var scores = {};
      crit.forEach(function (c) { scores[c.id] = effectiveScore(data, ranking, state, slug, c.id); });
      var local = !!((state && state.tiers && state.tiers[slug]) ||
        (state && state.scores && state.scores[slug] && Object.keys(state.scores[slug]).length));
      return {
        rank: i < eo.ranked.length ? i + 1 : "unranked", slug: slug,
        title: effectiveTitle(data, state, slug) || slug, trl: e.trl, scores: scores,

  }

  var CSV_QUOTE = /[,"\n\r]/;

  function csvCell(v) {
    var s = String(v);
