  }

  function mdCell(v) {
    return String(v).replace(/\|/g, "\\|");
  }

  // The ranking.py matrix bytes. Rows carrying local (unsynced) changes say so in the last column.
  // Local (unsynced) changes of one matrix row: ["order", "C1, C3", "tier primary", "moved from (f)"].
  function unsyncedParts(data, ranking, state, area, slug, index, base) {
    var parts = [];
    var mv = state && state.moves && state.moves[slug];
    if (state && state.order && state.order[area] && !(mv && mv.to === area) && base.indexOf(slug) !== index) {
      parts.push("order");
    }
    var sc = Object.keys((state && state.scores && state.scores[slug]) || {}).sort();
    if (sc.length) parts.push(sc.join(", "));
    if (state && state.tiers && state.tiers[slug]) parts.push("tier " + state.tiers[slug].to);
    if (mv && mv.to === area) parts.push("moved from (" + mv.from + ")");
    return parts;
  }

  // The ranking.py matrix bytes when the area holds no local records. With local order, tier, score or move
  // records: an "Unsynced" column ("<who>: order; C1") and, in Markdown, a draft line above the table.
  function matrixText(data, ranking, state, area, fmt, who) {
    var crit = ((ranking && ranking.criteria) || []).map(function (c) { return c.id; });
    var rows = matrixRows(data, ranking, state, area);
    var base = dataOrder(data, ranking, area);
    var name = who ? String(who) : "you";
    var unsynced = rows.map(function (r, i) {
      var p = unsyncedParts(data, ranking, state, area, r.slug, i, base);
      return p.length ? name + ": " + p.join("; ") : "";
    });
    var draft = !!(state && state.order && state.order[area]) || unsynced.some(function (u) { return u; });
    var head = ["Rank", "Title", "TRL"].concat(crit, ["Total", "Last changed by"], draft ? ["Unsynced"] : []);
    var body = rows.map(function (r, i) {
      return [r.rank, r.title, r.trl].concat(crit.map(function (c) {
        return r.scores[c] == null ? "-" : r.scores[c];
      }), [r.total, r.by], draft ? [unsynced[i]] : []);
    });
    if (fmt === "csv") {
      return [head].concat(body).map(function (row) { return row.map(csvCell).join(",") + "\n"; }).join("");
    }
    if (fmt === "md") {
      var lines = ["| " + head.map(mdCell).join(" | ") + " |", "|" + head.map(function () { return "---|"; }).join("")];
      body.forEach(function (row) { lines.push("| " + row.map(mdCell).join(" | ") + " |"); });

  }

  // ------------------------------------------------------------------ reconcile (A9)

  // Stale moves (F1): a pending move whose `from` is not the card's current data area (a sync moved
  // the card since). The record stays unchanged so the D4 sync can detect it.
  function moveConflicts(data, state) {
    var out = [];
    Object.keys((state && state.moves) || {}).sort().forEach(function (slug) {
      var e = entryOf(data, slug);
      var m = state.moves[slug];
      if (e && m.from !== e.area && m.to !== e.area) {
        out.push({ slug: slug, from: m.from, to: m.to, home: e.area, at: m.at });
      }
    });
    return out;
  }

  // Re-apply a stale move from the card's current area.
  function reapplyMove(data, state, slug, at) {
    var m = state && state.moves && state.moves[slug];
    if (!m) return cloneState(state);
    return move(data, state, slug, m.to, at);
  }

  // Pending edits rechecked against the current data (F2): TRL and other cards' effective titles.
  function editProblems(data, state) {
    var out = [];
    Object.keys((state && state.edits) || {}).sort().forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) return;
      var ed = state.edits[slug];
      var others = data.technologies.filter(function (t) { return t.slug !== slug; })
        .map(function (t) { return effectiveTitle(data, state, t.slug); });
      var probs = textProblems(ed.title, ed.blurb, e.trl, others);
      if (probs.length) {
        out.push({ slug: slug, rule: probs[0].rule, detail: probs[0].detail, problems: probs });
      }
    });
    return out;
  }

  function reconcile(data, state, ranking) {
    var s = cloneState(state);
    var orphaned = 0;
    var applied = 0;
    var superseded = 0;
    var stale = [];
    var dropped = [];  // se_recheck F4: tier and score records on a slug the data no longer holds
    // D6 ranking records: applied when `to` equals the data value, stale (kept) when `from` differs.
    Object.keys(s.tiers).sort().forEach(function (slug) {
      var r = s.tiers[slug];
      if (!entryOf(data, slug)) {
        dropped.push({ slug: slug, kind: "tier", to: r.to });
        delete s.tiers[slug]; orphaned++; return;
      }
      var cur = dataTier(ranking, slug);
      if (r.to === cur) { delete s.tiers[slug]; applied++; return; }
      if (r.from !== cur) {
        var rec = rankingSection(ranking, "tiers")[slug] || null;
        stale.push({ ref: { kind: "tier", slug: slug }, from: r.from, to: r.to, current: cur,
          by: rec ? rec.by : null, at: rec ? rec.at : null });
      }
    });
    Object.keys(s.scores).sort().forEach(function (slug) {
      var fields = s.scores[slug];
      var known = !!entryOf(data, slug);
      Object.keys(fields).sort().forEach(function (crit) {
        var r = fields[crit];
        if (!known) {
          dropped.push({ slug: slug, kind: "score", crit: crit, to: r.to });
          delete fields[crit]; orphaned++; return;
        }
        var cur = dataScore(ranking, slug, crit);
        if (r.to === cur) { delete fields[crit]; applied++; return; }
        if (r.from !== cur) {
          var rec = (rankingSection(ranking, "scores")[slug] || {})[crit] || null;
          stale.push({ ref: { kind: "score", slug: slug, crit: crit }, from: r.from, to: r.to, current: cur,
            by: rec ? rec.by : null, at: rec ? rec.at : null });
        }
      });
      if (!Object.keys(fields).length) delete s.scores[slug];
    });
    Object.keys(s.order).sort().forEach(function (area) {
      var r = s.order[area];
      var cur = dataOrder(data, ranking, area);
      var stored = storedRanked(data, ranking, area);
      // applied: to equals the data order, or (F2) to filtered to the data's primary cards is the stored list
      if (sameList(r.to, cur) || (stored.length && sameList(dataPrimaryFilter(data, ranking, area, r.to), stored))) {
        delete s.order[area]; applied++; return;
      }
      // se_recheck F4: a slug the data no longer holds (renamed or removed) makes the record stale
      var missing = r.from.concat(r.to).filter(function (x, i, a) { return !entryOf(data, x) && a.indexOf(x) === i; });
      // F1: with from_at, stale only when the stored order's at changed
      var isStale = missing.length > 0 ||
        (has(r, "from_at") ? r.from_at !== storedOrderAt(ranking, area) : !sameList(r.from, cur));
      if (isStale) {
        var rec = rankingSection(ranking, "order")[area] || null;
        var entry = { ref: { kind: "order", area: area }, from: r.from, to: r.to, current: cur,
          by: rec ? rec.by : null, at: rec ? rec.at : null };
        if (missing.length) entry.missing = missing;
        stale.push(entry);
      }
    });
    Object.keys(s.moves).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.moves[slug]; orphaned++; }
      else if (s.moves[slug].to === e.area) { delete s.moves[slug]; applied++; }
    });
    Object.keys(s.splits).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.splits[slug]; orphaned++; }
      else if (!!s.splits[slug].on === !!e.split) { delete s.splits[slug]; applied++; }
      else if (e.split_at && !(Date.parse(s.splits[slug].at) > Date.parse(e.split_at))) {
        // a sync applied a record at least as late (N1/N7): this one would be refused as a conflict
        delete s.splits[slug]; superseded++;
      }
    });
    Object.keys(s.edits).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.edits[slug]; orphaned++; }
      else if (s.edits[slug].title === e.title && s.edits[slug].blurb === e.blurb) {
        delete s.edits[slug]; applied++;
      }
    });
    stale = stale.concat(conflictRecords(s, ranking, stale));
    return {
      state: s, orphaned: orphaned, applied: applied, superseded: superseded,
      conflicts: moveConflicts(data, s), invalid: editProblems(data, s), stale: stale, dropped: dropped
    };
  }

  // Stale ranking records of a state (reconcile's `stale` without dropping anything).
  function staleRecords(data, state, ranking) {
    return reconcile(data, state, ranking).stale;
  }

  // Re-apply: from := the current data value; order `to` re-normalized to the area's current primary
  // cards (missing ones appended by title). A record equal to its new `from` is deleted.
  function reapplyRecord(data, ranking, state, ref, at) {
    var s = cloneState(state);
    if (ref.kind === "order") {
      var r = s.order[ref.area];
      if (!r) return s;
      delete s.order[ref.area];
      var cur = dataOrder(data, ranking, ref.area);
      var here = flatOrder(data, ranking, s, ref.area);
      var to = r.to.filter(function (x, i) { return here.indexOf(x) >= 0 && r.to.indexOf(x) === i; });
      to = to.concat(here.filter(function (x) { return to.indexOf(x) < 0; }));
      if (!sameList(to, cur)) s.order[ref.area] = { from: cur, from_at: storedOrderAt(ranking, ref.area), to: to, at: at };
      return s;
    }
    if (ref.kind === "move") {
      var mv = s.moves[ref.slug];
      if (!mv || !entryOf(data, ref.slug)) return s;
      return move(data, s, ref.slug, mv.to, at);
    }
    if (ref.kind === "split") {
      if (s.splits[ref.slug]) s.splits[ref.slug].at = at;
      return s;
    }
    if (ref.kind === "tier") {
      var t = s.tiers[ref.slug];
      if (!t) return s;
      var ct = dataTier(ranking, ref.slug);
      if (t.to === ct) delete s.tiers[ref.slug];
      else s.tiers[ref.slug] = { from: ct, to: t.to, at: at };
      return s;
    }
    if (ref.kind === "score") {
      var f = s.scores[ref.slug] && s.scores[ref.slug][ref.crit];
      if (!f) return s;
      var cv = dataScore(ranking, ref.slug, ref.crit);
      if (f.to === cv) {
        delete s.scores[ref.slug][ref.crit];
        if (!Object.keys(s.scores[ref.slug]).length) delete s.scores[ref.slug];
      } else s.scores[ref.slug][ref.crit] = { from: cv, to: f.to, at: at };
      return s;
    }
    return s;
  }

  // B1: kept local records on a field the last sync left in conflict (ranking.conflicts), made no later
  // than that conflict: listed with the other people's values. Re-apply re-stamps `at`; Drop deletes.
  function conflictRecords(s, ranking, already) {
    var list = ranking && Array.isArray(ranking.conflicts) ? ranking.conflicts : [];
    var out = [];
    var seen = {};
    already.forEach(function (x) { seen[JSON.stringify(x.ref)] = 1; });
    list.forEach(function (c) {
      var i = String(c.field || "").indexOf(":");
      if (i < 0) return;
      var kind = c.field.slice(0, i), key = c.field.slice(i + 1);
      var rec = null, ref = null, val;
      if (kind === "order") { rec = s.order[key]; ref = { kind: "order", area: key }; }
      else if (kind === "tier") { rec = s.tiers[key]; ref = { kind: "tier", slug: key }; }
      else if (kind === "move") { rec = s.moves[key]; ref = { kind: "move", slug: key }; }
      else if (kind === "split") { rec = s.splits[key]; ref = { kind: "split", slug: key }; }
      else if (kind === "score") {
        var j = key.lastIndexOf(".");
        var sl = key.slice(0, j), cr = key.slice(j + 1);
        rec = s.scores[sl] && s.scores[sl][cr];
        ref = { kind: "score", slug: sl, crit: cr };
      }
      if (!rec || seen[JSON.stringify(ref)]) return;
      val = kind === "split" ? rec.on : rec.to;
      var people = Array.isArray(c.people) ? c.people : [];
      var last = null;
      people.forEach(function (p) { var t = Date.parse(p.at); if (!isNaN(t) && (last === null || t > last)) last = t; });
      if (last !== null && Date.parse(rec.at) > last) return;
      var others = people.filter(function (p) { return JSON.stringify(p.to) !== JSON.stringify(val); })
        .map(function (p) { return { by: p.by, to: p.to, at: p.at }; });
      out.push({ ref: ref, from: kind === "split" ? null : rec.from, to: val, current: null, conflict: true,
        others: others, by: others.length ? others[0].by : null, at: others.length ? others[0].at : null });
    });
    return out;
  }

  function dropRecord(state, ref) {
    var s = cloneState(state);
    if (ref.kind === "move") delete s.moves[ref.slug];
    else if (ref.kind === "split") delete s.splits[ref.slug];
    if (ref.kind === "order") delete s.order[ref.area];
    else if (ref.kind === "tier") delete s.tiers[ref.slug];
    else if (ref.kind === "score" && s.scores[ref.slug]) {
      delete s.scores[ref.slug][ref.crit];
      if (!Object.keys(s.scores[ref.slug]).length) delete s.scores[ref.slug];
    }
    return s;
  }

  // ------------------------------------------------------------------ storage (A10)

  function loadState(storage) {
    if (!storage) return { state: emptyState(), ok: false };
    var text;
    try {
      text = storage.getItem(STORAGE_KEY);
    } catch (err) {
      return { state: emptyState(), ok: false };
    }
    if (text == null) return { state: emptyState(), ok: true };
    try {
      var o = JSON.parse(text);
      return { state: isMap(o) ? stateFrom(o) : emptyState(), ok: true };
    } catch (err) {
      return { state: emptyState(), ok: true };
    }
  }

  function saveState(storage, state) {
    if (!storage) return false;
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(cloneState(state)));
      return true;
    } catch (err) {
      return false;
    }
  }

  function storageMessage(ok) {
    return ok ? "" : "This browser blocks local storage: your changes are not saved between reloads. Export them before you close the page.";
  }

  return {
    LETTERS: LETTERS, COLUMNS: COLUMNS, STORAGE_KEY: STORAGE_KEY, BANNED: BANNED.slice(),
    slotsFor: slotsFor, emptyState: emptyState, effectiveArea: effectiveArea,
    effectiveTitle: effectiveTitle, effectiveBlurb: effectiveBlurb, effectiveCounts: effectiveCounts,
    textPending: textPending,
    layout: layout, move: move, undoMove: undoMove, effectiveSplit: effectiveSplit,
    toggleSplit: toggleSplit, textProblems: textProblems, canEdit: canEdit, edit: edit,
    pendingCount: pendingCount, exportChanges: exportChanges, serializeChanges: serializeChanges,
    baseOf: baseOf, isStale: isStale,
    importChanges: importChanges, reconcile: reconcile, moveConflicts: moveConflicts,
    reapplyMove: reapplyMove, editProblems: editProblems, loadState: loadState, saveState: saveState,
    storageMessage: storageMessage, titleKey: titleKey,
    // D6
    CRIT_IDS: CRIT_IDS.slice(), effectiveTier: effectiveTier, effectiveOrder: effectiveOrder,
    dataOrder: dataOrder, moveRank: moveRank, setRank: setRank, setOrder: setOrder, setTier: setTier,
    effectiveScore: effectiveScore, setScore: setScore, weightedTotal: weightedTotal, tierCounts: tierCounts,
    capWarnings: capWarnings, rankingPending: rankingPending, staleRecords: staleRecords,
    reapplyRecord: reapplyRecord, dropRecord: dropRecord, matrixRows: matrixRows, matrixText: matrixText,
    lastBy: lastBy
  };
});
</script>
<script>
(function () {
  "use strict";
  var GL = window.GridLogic;
  var data = window.GRID_DATA;
  var ranking = window.RANKING_DATA || null;
  var CRITERIA = (ranking && ranking.criteria) || [];
  var ROSTER = ["quinn", "eytan", "federico", "shaun", "wintta", "nikki", "carlos"];
  var WHO_KEY = GL.STORAGE_KEY + "-who";
  var BASE_KEY = GL.STORAGE_KEY + "-base";
  var LETTERS = GL.LETTERS.split("");
  var finePointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  var selftest = /[?&]selftest=1(&|$)/.test(location.search);
  function urlParam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var $ = function (id) { return document.getElementById(id); };
  var bySlug = {};
  data.technologies.forEach(function (t) { bySlug[t.slug] = t; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function nowIso() { return new Date().toISOString(); }
  function collapse(s) { return String(s == null ? "" : s).trim().split(/\s+/).filter(Boolean).join(" "); }

  // se_recheck F4: name each dropped tier or score record (old slug and value), not a count only.
  function droppedText(list) {
    if (!list || !list.length) return "";
    return " Dropped: " + list.map(function (x) {
      return x.kind === "tier" ? x.slug + " tier " + x.to : x.slug + " " + x.crit + " " + (x.to == null ? "cleared" : x.to);
    }).join("; ") + " (the card was renamed or removed; set the value again on the card under its new name).";
  }

  // Soft hyphens in long words so a narrow tile can wrap them (CSS hyphens: manual shows a hyphen
  // only where a break is taken). Break points: vowel-consonant-vowel and vowel-pair-vowel (before
  // the consonant or the kept pair) and
  // between two consonants that are not a digraph or common onset, at least 2 letters from the
  // start, 3 from the end and 2 from the previous break. Words of 8 to 20 letters only: a longer
  // run is not a word and stays unbroken, so it shows as an overflow. A title that still needs a
  // 4th line gets tighter letter and word spacing (fitTitles); the font stays at 12 px.
  var SHY = "­";
  // Pairs kept together: digraphs and common syllable onsets (tr, pl, st ...).
  var KEEP = {};
  ("ch sh th ph ck ng gh wh qu bl br cl cr dr fl fr gl gr pl pr sc sk sl sm sn sp st sw tr tw wr")
    .split(" ").forEach(function (p) { KEEP[p] = 1; });
  // Dictionary breaks for the long words in the current titles; the vowel/consonant rule below is
  // the fallback for words added by owner edits.
  var DICT = {};
  // Compounds break at the stem (spectro-metry, terra-mechanics) so the word reads at a glance.
  ("au-to-mat-ed au-ton-o-mous bi-o-log-i-cal carbo-thermal cis-lu-nar de-ploy-able dis-man-tling " +
   "down-hole electro-stat-ic ex-ca-va-tion ex-ca-va-tor feed-stock geo-spa-tial hy-dro-gen hy-dro-lox " +
   "mag-net-ic mi-cro-wave reg-o-lith re-source sa-ba-tier shad-owed sin-tered tail-ings " +
   "terra-mechan-ics ac-tu-a-tors ad-he-sion al-tim-e-try anal-y-sis as-sem-bly as-sess-ment " +
   "au-ton-o-my com-pac-tion con-crete con-struc-tion con-vey-ors cryo-gen-ic dis-charge " +
   "elec-trol-y-sis ex-trac-tion hab-i-tats han-dling in-fra-red in-su-la-tion learn-ing " +
   "lique-fac-tion main-te-nance man-u-fac-tur-ing mech-a-nisms meth-a-na-tion mod-el-ling " +
   "or-bit-ers pen-e-trat-ing pipe-lines plat-form pres-sure print-ing pro-cess-ing pro-pel-lant " +
   "py-rol-y-sis ra-di-a-tion re-cov-ery re-duc-tion sep-a-ra-tion sin-ter-ing spectro-meters " +
   "spectro-metry sup-pres-sion sur-fac-es tol-er-ant trac-tion trans-fer um-bil-i-cal " +
   "spectro-meter")
    .split(" ").forEach(function (h) { DICT[h.replace(/-/g, "")] = h; });
  function isVowel(c) { return "aeiouy".indexOf(c) >= 0; }
  function isLetter(c) { return /[a-z]/.test(c); }
  function hyphenateWord(w) {
    if (w.length < 8 || w.length > 20) return w;
    var d = DICT[w.toLowerCase()];
    if (d) {
      var res = "", k = 0;
      for (var j = 0; j < d.length; j++) {
        if (d[j] === "-") { if (k >= 2 && w.length - k >= 3) res += SHY; }
        else res += w[k++];
      }
      return res;
    }
    var lw = w.toLowerCase();
    var out = "";
    var last = 0;
    for (var i = 2; i <= w.length - 3; i++) {
      var a = lw[i - 1], b = lw[i], c = lw[i + 1];
      if (!isLetter(a) || !isLetter(b) || !isLetter(c)) continue;
      var ok = (isVowel(a) && !isVowel(b) && isVowel(c)) ||
        (isVowel(a) && KEEP[b + c] && i + 2 < w.length && isVowel(lw[i + 2])) ||
        (i >= 3 && !isVowel(a) && !isVowel(b) && !KEEP[a + b] && isVowel(lw[i - 2]));
      if (ok && i - last >= 2) { out += w.slice(last, i) + SHY; last = i; }
    }
    return out + w.slice(last);
  }
  function hyphenate(title) {
    return String(title || "").split(/(\s+|-)/).map(function (part) {
      return /^[A-Za-z]+$/.test(part) ? hyphenateWord(part) : part;
    }).join("");
  }

  // ------------------------------------------------------------ storage
  var storage = null;
  try { storage = window.localStorage; } catch (err) { storage = null; }
  function readKey(k) { try { return storage ? storage.getItem(k) : null; } catch (err) { return null; } }
  function writeKey(k, v) {
    try {
      if (!storage) return false;
      if (v == null) storage.removeItem(k); else storage.setItem(k, v);
      return true;
    } catch (err) { return false; }
  }

  var loaded = GL.loadState(storage);
  var storageOk = loaded.ok;
  var rec = GL.reconcile(data, loaded.state, ranking);
  var state = rec.state;
  var who = (readKey(WHO_KEY) || "").toLowerCase();
  // Stored base: JSON {cards_commit, synced_at} (D4); a bare string is a D3 cards_commit.
  function readBase() {
    var raw = readKey(BASE_KEY);
    if (!raw) return null;
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === "object" && !Array.isArray(o)) return o;
    } catch (err) { /* D3 form */ }
    return { cards_commit: raw, synced_at: "" };
  }
  var base = readBase();
  var notes = [];
  if (rec.applied) notes.push(rec.applied + " local change" + (rec.applied === 1 ? " was" : "s were") + " already synced and dropped.");
  if (rec.orphaned) notes.push(rec.orphaned + " local change" + (rec.orphaned === 1 ? "" : "s") + " for technologies no longer in the data dropped." + droppedText(rec.dropped));
  if (rec.conflicts.length) notes.push(rec.conflicts.length + " local move" + (rec.conflicts.length === 1 ? " was" : "s were") + " made from an area a sync has since changed; open the tile to re-apply or drop.");
  if (rec.invalid.length) notes.push(rec.invalid.length + " local edit" + (rec.invalid.length === 1 ? " no longer passes" : "s no longer pass") + " the text rules against the current cards; open the tile to fix or drop.");
  if (rec.superseded) notes.push(rec.superseded + " local needs-split change" + (rec.superseded === 1 ? " was" : "s were") + " overtaken by a later synced change and dropped; toggle again if you still disagree.");
  if (rec.stale.length) notes.push(rec.stale.length + " local ranking change" + (rec.stale.length === 1 ? " was" : "s were") + " made against a value someone has since changed: Re-apply or Drop below.");
  if (rec.applied || rec.orphaned || rec.superseded) persist();

  function persist() {
    storageOk = GL.saveState(storage, state) && loaded.ok;
    if (GL.pendingCount(state) === 0) { base = null; writeKey(BASE_KEY, null); }
    else if (!base) { base = GL.baseOf(data); writeKey(BASE_KEY, JSON.stringify(base)); }
  }

  function setState(next) {
    state = next;
    persist();
    renderAll();
  }

  // ------------------------------------------------------------ header
  function fillWho() {
    var names = {};
    ROSTER.forEach(function (n) { names[n] = 1; });
    data.technologies.forEach(function (t) { if (t.author) names[String(t.author).toLowerCase()] = 1; });
    if (who) names[who] = 1;
    var sel = $("who");
    Object.keys(names).sort().forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    sel.value = who;
    sel.addEventListener("change", function () {
      who = sel.value;
      writeKey(WHO_KEY, who || null);
      if (popSlug) renderPop();
    });
  }

  function renderStatus() {
    var parts = [];
    var sm = GL.storageMessage(storageOk);
    if (sm) parts.push(sm);
    parts = parts.concat(notes);
    $("status").textContent = parts.join(" ");
    $("pending").textContent = String(GL.pendingCount(state));
    var nc = GL.moveConflicts(data, state).length, ni = GL.editProblems(data, state).length;
    var stale = staleList();
    var iss = [];
    if (nc) iss.push(nc + " stale move" + (nc === 1 ? "" : "s"));
    if (stale.length) iss.push(stale.length + " stale ranking change" + (stale.length === 1 ? "" : "s"));
    if (ni) iss.push(ni + " edit" + (ni === 1 ? "" : "s") + " failing rules");
    $("issues").textContent = iss.length ? "❗ " + iss.join(", ") : "";
    $("rkStale").innerHTML = stale.map(function (x) { return '<p class="stale-rec">' + staleHtml(x) + "</p>"; }).join("");
    var line = "Cards at commit " + data.cards_commit + " (" + data.cards_date + "), " +
      data.technologies.length + " technologies, " + data.capacity + " slots per area minimum.";
    if (data.cards_dirty) line += " Built from uncommitted card files (development run).";
    $("cardsLine").textContent = line;
    var stale = "";
    if (GL.pendingCount(state) > 0 && GL.isStale(data, base)) {
      var was = "cards commit " + base.cards_commit + (base.synced_at ? ", synced " + base.synced_at : "");
      var now = "cards commit " + data.cards_commit + (data.synced_at ? ", synced " + data.synced_at : "");
      stale = "Your local changes were made against " + was + "; the page now shows " + now +
        ". Changes already synced were dropped. Check the rest, then Export.";
    }
    $("stale").textContent = stale;
  }

  // ------------------------------------------------------------ ranking helpers (D6)
  function staleList() { return GL.staleRecords(data, state, ranking); }

  function titleOf(slug) { return shownTitle(slug); }

  function showVal(v) {
    if (v == null) return "unset";
    if (Array.isArray(v)) return "the older order";
    return String(v);
  }

  // One stale record: who changed the field since, and Re-apply / Drop.
  function fieldName(ref) {
    if (ref.kind === "order") return "(" + ref.area + ") order";
    if (ref.kind === "tier") return titleOf(ref.slug) + " tier";
    if (ref.kind === "move") return titleOf(ref.slug) + " area";
    if (ref.kind === "split") return titleOf(ref.slug) + " needs split";
    return titleOf(ref.slug) + " " + ref.crit;
  }

  function otherVal(ref, v) {
    if (ref.kind === "order") return "a different order";
    if (ref.kind === "move") return "(" + v + ")";
    if (ref.kind === "split") return v ? "on" : "off";
    return showVal(v);
  }

  function staleHtml(x) {
    var field = fieldName(x.ref), text;
    if (x.missing) {
      // se_recheck F4: a card in the order was renamed or removed since the record was made
      text = "A card in your " + esc(field) + " (" + esc(x.missing.join(", ")) + ") was renamed or removed. " +
        "Re-apply to keep your order on the current cards (a renamed card comes back unranked; rank it again), or Drop.";
    } else if (x.conflict) {
      // B1: two people, one sync, nothing applied
      var names = (x.others || []).map(function (o) { return esc(o.by) + " set it to " + esc(otherVal(x.ref, o.to)); });
      text = esc(field) + ": " + (names.length ? names.join("; ") : "someone set it differently") +
        " in the same sync as you; nothing applied. Re-apply to send yours again, or Drop.";
    } else {
      var mine = x.ref.kind === "order" ? "you ranked" : "you set it to " + showVal(x.to);
      var who = x.by ? esc(x.by) + " set " + esc(field) + (x.at ? " " + esc(String(x.at).slice(0, 10)) : "") +
        " after " + esc(mine) : esc(field) + " changed after " + esc(mine);
      text = who + (x.ref.kind === "order" ? "; yours is from the older order." :
        "; yours is from the older value (" + esc(showVal(x.from)) + ", now " + esc(showVal(x.current)) + ").");
    }

    return "&#10071; " + text +
      ' <button type="button" data-rkact="reapply" data-ref="' + ref + '">Re-apply</button>' +
      '<button type="button" data-rkact="drop" data-ref="' + ref + '">Drop</button>';
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-rkact]");
    if (!b) return;
    var ref;
    try { ref = JSON.parse(b.getAttribute("data-ref")); } catch (err) { return; }
    if (b.getAttribute("data-rkact") === "reapply") setState(GL.reapplyRecord(data, ranking, state, ref, nowIso()));
    else setState(GL.dropRecord(state, ref));
  });

  function capFor(tier) { return (ranking && ranking.caps && ranking.caps[tier]) || 25; }

  // ------------------------------------------------------------ grid
  // A stem splitting into two arrowheads (designer gate item 2).
  var SPLIT_SVG = '<svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 9.5V6M5 6L1.5 1.5M1.5 1.5h3M1.5 1.5v3M5 6L8.5 1.5M8.5 1.5h-3M8.5 1.5v3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  $("legend2").innerHTML = '<span class="split-glyph-inline">' + SPLIT_SVG + '</span> needs split &middot; <span class="rtag">R</span> reserve (not ranked, not exported) &middot; P / R: primary and reserve cards against the 25 cap; an orange count is over the cap, a warning only.';

  function conflictOf(slug) {
    var m = state.moves[slug];
    var e = bySlug[slug];
    return m && e && m.from !== e.area && m.to !== e.area ? m : null;
  }

  function editProblemOf(slug) {
    var list = GL.editProblems(data, state);
    for (var i = 0; i < list.length; i++) if (list[i].slug === slug) return list[i];
    return null;
  }

  function pendingBits(slug) {
    var bits = [];
    if (state.moves[slug]) {
      bits.push("moved from (" + state.moves[slug].from + ")" +
        (conflictOf(slug) ? "; since moved to (" + bySlug[slug].area + ") by sync" : ""));
    }
    if (state.splits[slug]) bits.push("needs-split " + (state.splits[slug].on ? "set" : "cleared"));
    if (state.edits[slug]) {
      var ep = editProblemOf(slug);
      bits.push("text edited" + (ep ? "; edit fails " + ep.rule : ""));
    }
    if (state.tiers[slug]) bits.push("moved to " + state.tiers[slug].to);
    var ns = Object.keys(state.scores[slug] || {}).length;
    if (ns) bits.push(ns + " score" + (ns === 1 ? "" : "s") + " changed");
    return bits;
  }

  // Title shown on the tile and in labels: the slug when extract emptied the text (F3).
  function shownTitle(slug) {
    return GL.textPending(data, state, slug) ? slug : GL.effectiveTitle(data, state, slug);
  }

  // Tile: no button and no hit area besides the tile itself (D6). Needs split shows as a glyph and in the
  // accessible name (", needs split" last); reserve as an R tag and a lighter fill.
  function tileHtml(slug, rank) {
    var t = bySlug[slug];
    var title = GL.effectiveTitle(data, state, slug);
    var pendText = GL.textPending(data, state, slug);
    var split = GL.effectiveSplit(data, state, slug);
    var reserve = GL.effectiveTier(data, ranking, state, slug) === "reserve";
    var bits = pendingBits(slug);
    var pend = bits.length > 0;
    var label = shownTitle(slug) + (pendText ? " (text pending)" : "") + ", TRL " + t.trl +
      (reserve ? ", reserve" : rank ? ", rank " + rank : "") +
      (pend ? ", pending: " + bits.join(", ") : "") + (split ? ", needs split" : "");
    var titleDiv = pendText
      ? '<div class="title tpend" aria-hidden="true" data-slug-words="' + esc(shownTitle(slug).replace(/-/g, " ")) + '"></div>'
      : '<div class="title" aria-hidden="true" data-t="' + esc(title) + '">' + esc(title) + "</div>";
    return '<div class="tile' + (pend ? " pending" : "") + (reserve ? " reserve" : "") + (popSlug === slug ? " open" : "") +
      '" data-slug="' + esc(slug) + '" tabindex="0" aria-label="' + esc(label) + '"' +
      (pendText ? ' title="' + esc(slug) + ': text pending regeneration"' : "") +
      (finePointer ? ' draggable="true"' : "") +
      ' style="--home: var(--area-' + esc(t.area) + ')">' +
      '<div class="tile-top">' +
      (pend ? '<span class="pmark" title="Pending: ' + esc(bits.join(", ")) + ', not yet synced" aria-hidden="true">&#10033;</span>' : "") +
      (reserve ? '<span class="rtag" aria-hidden="true" title="Reserve">R</span>' : "") +
      '<span class="trl" aria-hidden="true">TRL ' + esc(t.trl) + "</span></div>" +
      titleDiv +
      (split ? '<span class="split-glyph" aria-hidden="true" title="Needs split">' + SPLIT_SVG + "</span>" : "") +
      "</div>";
  }

  // "P 13/25 · R 3/25"; an over-cap tier shows "<n> / <cap> <tier>" in the warning style (never a block).
  function tierLine(L, counts) {
    var c = counts[L];
    var part = function (tier, letter) {
      var cap = capFor(tier);
      if (c[tier] > cap) {
        return '<span class="warn" title="Over the ' + cap + "-card " + tier + ' cap: a warning, nothing is blocked">' +
          c[tier] + " / " + cap + " " + tier + "</span>";
      }
      return letter + " " + c[tier] + "/" + cap;
    };
    return part("primary", "P") + " &middot; " + part("reserve", "R");
  }

  function renderGrid() {
    var L = GL.layout(data, state, ranking);
    var counts = GL.tierCounts(data, ranking, state);
    var html = "";
    L.areas.forEach(function (a) {
      var ranked = GL.effectiveOrder(data, ranking, state, a.letter).ranked;
      html += '<section class="area" id="area-' + a.letter + '" data-letter="' + a.letter +
        '" aria-labelledby="h-' + a.letter + '">' +
        '<div class="area-head"><span class="letter">(' + a.letter + ')</span>' +
        '<h2 id="h-' + a.letter + '">' + esc(a.name) + "</h2>" +
        '<span class="count">' + a.count + " / " + L.slots + "</span></div>" +
        '<div class="area-sub">' + tierLine(a.letter, counts) + "</div>" +
        '<div class="slots">';
      a.tiles.forEach(function (slug) {
        var i = ranked.indexOf(slug);
        html += tileHtml(slug, i >= 0 ? i + 1 : 0);
      });
      for (var i = a.tiles.length; i < L.slots; i++) html += '<div class="slot-empty" aria-hidden="true"></div>';
      html += "</div></section>";
    });
    var focused = document.activeElement && document.activeElement.closest &&
      document.activeElement.closest(".tile");
    var focusSlug = focused ? focused.getAttribute("data-slug") : null;
    $("grid").innerHTML = html;
    fitTitles();
    if (focusSlug) {
      var el = tileEl(focusSlug);
      if (el) el.focus({ preventScroll: true });
    }
  }

  // Staged fit: plain words first; soft hyphens only in titles that overflow without them; tighter
  // spacing only where the hyphenated title still overflows.
  function overflows(el) { return el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth; }
  function fitTitles() {
    // F3 tiles: "text pending" line, then slug words, dropped from the end (with an ellipsis) until they fit.
    Array.prototype.forEach.call(document.querySelectorAll("#grid .title.tpend"), function (el) {
      var words = el.getAttribute("data-slug-words").split(" ");
      var n = words.length;
      var put = function (k) {
        el.innerHTML = '<span class="tp">text pending</span>' + esc(words.slice(0, k).join(" ") + (k < words.length ? " …" : ""));
      };
      put(n);
      while (n > 0 && overflows(el)) put(--n);
    });
    var els = Array.prototype.slice.call(document.querySelectorAll("#grid .title:not(.tpend)"));
    els.forEach(function (el) { el.classList.remove("tight"); el.textContent = el.getAttribute("data-t"); });
    var over = els.filter(overflows);
    over.forEach(function (el) { el.textContent = hyphenate(el.getAttribute("data-t")); });
    over = over.filter(overflows);
    over.forEach(function (el) { el.classList.add("tight"); });
  }

  function renderChips() {
    $("chips").innerHTML = LETTERS.map(function (L) {
      return '<a href="#area-' + L + '" aria-label="Area (' + L + ") " + esc(data.area_names[L]) + '">' + L + "</a>";
    }).join("");
  }

  function cssq(slug) { return window.CSS && CSS.escape ? CSS.escape(slug) : slug; }

  function tileEl(slug) {
    return document.querySelector('.tile[data-slug="' + cssq(slug) + '"]');
  }

  // The element the popover sits beside: the tile in grid view, the matrix row in matrix view.
  function anchorEl(slug) {
    if (view === "matrix") return document.querySelector('#matrix tr[data-slug="' + cssq(slug) + '"]') || $("matrix");
    return tileEl(slug);
  }

  function renderAll() {
    if (view === "grid") renderGrid();
    else renderMatrix();
    renderStatus();
    if (popSlug) renderPop();
  }

  // ------------------------------------------------------------ matrix view (D6)
  var view = "grid";
  var matrixArea = "a";
  var mxNote = "";

  function setView(v) {
    view = v;
    $("grid").hidden = v !== "grid";
    $("chips").hidden = v !== "grid";
    $("matrix").hidden = v !== "matrix";
    $("viewBtn").textContent = v === "grid" ? "Matrix" : "Grid";
    $("viewBtn").setAttribute("aria-pressed", v === "matrix" ? "true" : "false");
    closePop(false);
    renderAll();
  }

  function scoreCell(slug, c, v) {
    var local = state.scores[slug] && state.scores[slug][c];
    return '<td class="' + (local ? "pend" : "") + '"' + (local ? ' title="Pending, not yet synced"' : "") + ">" +
      (v == null ? "-" : esc(v)) + (local ? "&#10033;" : "") + "</td>";
  }

  function renderMatrix() {
    var L = matrixArea;
    var rows = GL.matrixRows(data, ranking, state, L);
    var counts = GL.tierCounts(data, ranking, state);
    var nRanked = rows.filter(function (r) { return r.rank !== "unranked"; }).length;
    var reserve = data.technologies.filter(function (t) {
      return GL.effectiveArea(data, state, t.slug) === L && GL.effectiveTier(data, ranking, state, t.slug) === "reserve";
    }).map(function (t) { return t.slug; }).sort(function (x, y) {
      var a = String(GL.effectiveTitle(data, state, x) || x).toLowerCase(), b = String(GL.effectiveTitle(data, state, y) || y).toLowerCase();
      return a < b ? -1 : a > b ? 1 : 0;
    });
    var staleOrder = staleList().filter(function (x) { return x.ref.kind === "order" && x.ref.area === L; });
    var h = '<h2 id="mxTitle">Ranking matrix</h2>' +
      '<p class="note">Primary cards in the order people set (drag a row, or Move up / Move down / Set rank). ' +
      "C1-C8 and the total sit beside the rank as information and never reorder it. Score a card from its details.</p>" +
      '<div class="picker" role="group" aria-label="Area">' + LETTERS.map(function (x) {
        return '<button type="button" data-mact="area" data-area="' + x + '" aria-pressed="' + (x === L) + '" title="' +
          esc(areaLabel(x)) + '">(' + x + ")</button>";
      }).join("") + "</div>" +
      '<p class="row"><b>' + esc(areaLabel(L)) + "</b>: " + rows.length + " primary (" + nRanked + " ranked, " +
      (rows.length - nRanked) + " unranked), " + reserve.length + " reserve. " + tierLine(L, counts) +
      (state.order[L] ? ' <span class="pend">&#10033; order changed here, not yet synced</span>' : "") + "</p>";
    staleOrder.forEach(function (x) { h += '<p class="err">' + staleHtml(x) + "</p>"; });
    if (mxNote) h += '<p class="err" role="alert">' + esc(mxNote) + "</p>";
    h += '<div class="mwrap"><table class="mx primary"><thead><tr><th class="r" scope="col">Rank</th>' +
      '<th class="t" scope="col">Title</th><th scope="col">Rank controls</th><th scope="col">TRL</th>' +
      CRITERIA.map(function (c) { return '<th scope="col" title="' + esc(c.text) + '">' + esc(c.id) + (c.weight > 1 ? " x" + c.weight : "") + "</th>"; }).join("") +
      '<th scope="col">Total</th><th scope="col">Last changed by</th></tr></thead><tbody>';
    rows.forEach(function (r, i) {
      var un = r.rank === "unranked";
      var local = !!(state.tiers[r.slug] || Object.keys(state.scores[r.slug] || {}).length);
      h += '<tr data-slug="' + esc(r.slug) + '"' + (un ? ' class="unranked"' : "") + (finePointer ? ' draggable="true"' : "") + ">" +
        '<td class="r">' + (finePointer ? '<span class="grip" aria-hidden="true">&#8942;&#8942;</span>' : "") + (un ? "unranked" : r.rank) + "</td>" +
        '<td class="t"><button type="button" class="tl" data-mact="open">' + esc(r.title) + "</button></td>" +
        '<td class="acts"><button type="button" data-mact="up" aria-label="Move up ' + esc(r.title) + '" title="Move up"' + (i === 0 ? " disabled" : "") + ">&#9650;</button> " +
        '<button type="button" data-mact="down" aria-label="Move down ' + esc(r.title) + '" title="Move down"' + (i === rows.length - 1 ? " disabled" : "") + ">&#9660;</button> " +
        '<input type="number" data-mact="set" min="1" max="' + rows.length + '" value="' + (i + 1) + '" aria-label="Set rank of ' + esc(r.title) + '" title="Set rank"></td>' +
        "<td>" + esc(r.trl) + "</td>" +
        CRITERIA.map(function (c) { return scoreCell(r.slug, c.id, r.scores[c.id]); }).join("") +
        '<td class="tot' + (typeof r.total === "number" ? " done" : "") + '">' + esc(r.total) + "</td>" +
        (local ? '<td class="pend" title="Your change, not yet synced">' + esc(who || "you") + " &#10033;</td>" : "<td>" + esc(r.by) + "</td>") +
        "</tr>";
    });
    if (!rows.length) h += '<tr><td class="r"></td><td class="t">No primary cards in this area.</td><td colspan="' + (CRITERIA.length + 4) + '"></td></tr>';
    h += "</tbody></table></div>";
    h += '<div class="tools"><span>Export the primary list (rank order' +
      (GL.rankingPending(state) || Object.keys(state.moves).length ? "; your unsynced changes are marked as a draft" : "") + "):</span>" +
      '<button type="button" data-mact="csv">CSV</button><button type="button" data-mact="md">Markdown</button></div>';
    h += "<h3>Reserve (" + reserve.length + "/" + capFor("reserve") + "): not ranked, not exported</h3>";
    h += reserve.length ? '<ul class="rlist">' + reserve.map(function (s) {
      return '<li data-slug="' + esc(s) + '"><button type="button" class="tl" data-mact="open">' + esc(titleOf(s)) + "</button>" +
        (state.tiers[s] ? '<span class="pend">&#10033; pending</span>' : "") +
        '<button type="button" data-mact="primary">Move to primary</button></li>';
    }).join("") + "</ul>" : '<p class="note">No reserve cards in this area.</p>';
    $("matrix").innerHTML = h;
  }

  function mxSlug(el) {
    var row = el.closest("[data-slug]");
    return row ? row.getAttribute("data-slug") : null;
  }

  function mxApply(r) {
    if (r.ok) { mxNote = ""; setState(r.state); }
    else { mxNote = "Not changed: " + r.reason + "."; renderMatrix(); }
  }

  $("matrix").addEventListener("click", function (e) {
    var b = e.target.closest("[data-mact]");
    if (!b || b.tagName === "INPUT") return;
    var act = b.getAttribute("data-mact");
    var slug = mxSlug(b);
    if (act === "area") { matrixArea = b.getAttribute("data-area"); mxNote = ""; closePop(false); renderMatrix(); }
    else if (act === "up" || act === "down") { mxNote = ""; setState(GL.moveRank(data, ranking, state, slug, act === "up" ? -1 : 1, nowIso())); }
    else if (act === "primary") setState(GL.setTier(data, ranking, state, slug, "primary", nowIso()));
    else if (act === "open") openPop(slug, false, true);
    else if (act === "csv" || act === "md") exportMatrix(act);
  });
  $("matrix").addEventListener("change", function (e) {
    var inp = e.target.closest("[data-mact='set']");
    if (!inp) return;
    mxApply(GL.setRank(data, ranking, state, mxSlug(inp), Number(inp.value), nowIso()));
  });
  if (finePointer) {
    var dragSlug = null;
    $("matrix").addEventListener("dragstart", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr) return;
      dragSlug = tr.getAttribute("data-slug");
      tr.classList.add("dragging");
      e.dataTransfer.setData("text/plain", dragSlug);
      e.dataTransfer.effectAllowed = "move";
    });
    $("matrix").addEventListener("dragover", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr || !dragSlug) return;
      e.preventDefault();
      document.querySelectorAll("#matrix tr.dropto, #matrix tr.dropbelow").forEach(function (x) {
        if (x !== tr) x.classList.remove("dropto", "dropbelow");
      });
      // a row dragged downward lands below the drop row, upward above it
      var list = GL.matrixRows(data, ranking, state, matrixArea).map(function (r) { return r.slug; });
      var below = list.indexOf(dragSlug) < list.indexOf(tr.getAttribute("data-slug"));
      tr.classList.toggle("dropbelow", below);
      tr.classList.toggle("dropto", !below);
    });
    $("matrix").addEventListener("drop", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr || !dragSlug) return;
      e.preventDefault();
      var list = GL.matrixRows(data, ranking, state, matrixArea).map(function (r) { return r.slug; });
      var moved = dragSlug;
      var from = list.indexOf(moved), to = list.indexOf(tr.getAttribute("data-slug"));
      dragSlug = null;
      if (from < 0 || to < 0 || from === to) { renderMatrix(); return; }
      // the dragged row takes the drop row's rank
      list.splice(from, 1);
      list.splice(to, 0, moved);
      mxApply(GL.setOrder(data, ranking, state, matrixArea, list, nowIso()));
    });
    $("matrix").addEventListener("dragend", function () {
      dragSlug = null;
      document.querySelectorAll("#matrix tr.dragging, #matrix tr.dropto, #matrix tr.dropbelow").forEach(function (x) { x.classList.remove("dragging", "dropto", "dropbelow"); });
    });
  }

  function exportMatrix(fmt) {
    var text = GL.matrixText(data, ranking, state, matrixArea, fmt, who || "you");
    var draft = text.split(/\n/)[0].indexOf("Unsynced") >= 0 || text.indexOf("Draft by ") === 0;
    var name = "ranking_" + matrixArea + (draft ? "_draft" : "") + (fmt === "csv" ? ".csv" : ".md");
    showExport("Matrix (" + matrixArea + ")" + (draft ? ", draft" : ""), text, name, fmt === "csv" ? "text/csv" : "text/markdown",
      "Primary cards of (" + matrixArea + ") in rank order. " + (draft ?
        "This is a draft: the Unsynced column names your changes that no sync has applied yet. " : "") +
      "The team list is `ranking.py matrix` after a sync.");
  }

  // ------------------------------------------------------------ popover
  var pop = $("pop");
  var popSlug = null;
  var popByHover = false;
  var hoverTimer = null;
  var leaveTimer = null;
  var editOpen = false;

  function areaLabel(L) { return "(" + L + ") " + data.area_names[L]; }

  function renderPop() {
    var slug = popSlug;
    var t = bySlug[slug];
    if (!t) { closePop(); return; }
    var title = GL.effectiveTitle(data, state, slug);
    var blurb = GL.effectiveBlurb(data, state, slug);
    var here = GL.effectiveArea(data, state, slug);
    var split = GL.effectiveSplit(data, state, slug);
    var letters = (t.areas && t.areas.length ? t.areas.map(function (x) { return "(" + x + ")"; }).join(", ") : "none listed");
    var pendText = GL.textPending(data, state, slug);
    var h = '<button type="button" class="close" data-act="close" aria-label="Close">&#10005;</button>' +
      '<h3 id="popTitle">' + (collapse(title) ? esc(title) : "<i>" + esc(slug) + "</i> (text pending)") + "</h3>" +
      '<p class="meta">Areas ' + esc(letters) + " &middot; TRL " + esc(t.trl) + " &middot; Owner " + esc(t.author || "none") + "</p>" +
      '<p class="blurb">' + (collapse(blurb) ? esc(blurb) : "<i>Blurb pending regeneration.</i>") + "</p>";
    if (pendText) h += '<p class="row">Card text changed; title and blurb are regenerated at the next data refill.</p>';
    if (state.edits[slug]) {
      var ep = editProblemOf(slug);
      h += '<p class="row">&#10033; Title and blurb edited here, not yet synced.</p>';
      if (ep) {
        h += '<p class="row err">&#10071; This edit no longer passes against the current card: ' +
          esc(ep.problems.map(function (p) { return p.rule + " " + p.detail; }).join("; ")) +
          '. Edit it again, or <button type="button" data-act="dropedit">Drop edit</button></p>';
      }
    }
    if (state.moves[slug]) {
      var cf = conflictOf(slug);
      if (cf) {
        h += '<p class="row err">&#10033; Moved from (' + esc(cf.from) + '); since moved to (' + esc(t.area) +
          ') by sync. <button type="button" data-act="reapply">Re-apply from (' + esc(t.area) + ')</button> ' +
          '<button type="button" data-act="undo">Drop move</button></p>';
      } else {
        h += '<p class="row">&#10033; Moved from (' + esc(state.moves[slug].from) + '), not yet synced. ' +
          '<button type="button" data-act="undo">Undo move</button></p>';
      }
    }
    var splitText;
    if (state.splits[slug]) splitText = "Needs split: " + (split ? "yes" : "no") + " (&#10033; pending, not yet synced).";
    else if (split) splitText = "Needs split: yes, set by " + esc(t.split_by || "unknown") + " (synced).";
    else splitText = "Needs split: no.";
    h += '<p class="row">' + splitText + ' <button type="button" data-act="split" aria-pressed="' + split + '">Needs split</button></p>';
    // tier (D6)
    var tier = GL.effectiveTier(data, ranking, state, slug);
    var tierRec = ranking && ranking.tiers && ranking.tiers[slug];
    h += '<p class="row">Tier: ' + (tier === "primary" ? "Primary" : "Reserve") +
      (state.tiers[slug] ? ' <span class="pend">(&#10033; pending, not yet synced)</span>' :
        tierRec ? " (set by " + esc(tierRec.by) + ")" : "") +
      ' <button type="button" data-act="tier">' + (tier === "primary" ? "Move to reserve" : "Move to primary") + "</button></p>";
    var mine = staleList();
    mine.filter(function (x) {
      return (x.ref.kind === "tier" || x.ref.kind === "move" || x.ref.kind === "split") && x.ref.slug === slug;
    }).forEach(function (x) {
      h += '<p class="row err">' + staleHtml(x) + "</p>";
    });
    // rank (primary only)
    if (tier === "primary") {
      var eo = GL.effectiveOrder(data, ranking, state, here);
      var k = eo.ranked.length + eo.unranked.length;
      var ri = eo.ranked.indexOf(slug);
      var pos = ri >= 0 ? ri + 1 : eo.ranked.length + eo.unranked.indexOf(slug) + 1;
      h += '<div class="row rank" data-rank="' + (ri >= 0 ? ri + 1 : "unranked") + '"><span>' +
        (ri >= 0 ? "Rank " + (ri + 1) + " of " + k + " in (" + here + ")" : "unranked in (" + here + "), " + k + " primary") +
        "</span>" + (state.order[here] ? ' <span class="pend">(&#10033; order pending)</span>' : "") +
        ' <button type="button" data-act="rank-up"' + (pos <= 1 ? " disabled" : "") + ">Move up</button>" +
        ' <button type="button" data-act="rank-down"' + (pos >= k ? " disabled" : "") + ">Move down</button>" +
        ' <label class="inl">Set rank <input type="number" data-act="rank-set" min="1" max="' + k + '" value="' + pos + '"></label>' +
        '<span class="err" id="rankErr" role="alert"></span></div>';
      mine.filter(function (x) { return x.ref.kind === "order" && x.ref.area === here; }).forEach(function (x) {
        h += '<p class="row err">' + staleHtml(x) + "</p>";
      });
    } else {
      h += '<p class="row">Reserve cards carry no rank; Move to primary to rank it.</p>';
    }
    h += '<div class="section"><div class="row">Move to...</div><div class="moves" role="group" aria-label="Move to area">';
    LETTERS.forEach(function (L) {
      h += '<button type="button" data-act="move" data-to="' + L + '" title="' + esc(areaLabel(L)) + '"' +
        (L === here ? ' aria-current="true" disabled' : "") + ">(" + L + ")</button>";
    });
    h += "</div></div>";
    // criteria C1-C8 (D6): one shared value per criterion, with who set it
    var vals = {};
    CRITERIA.forEach(function (c) { vals[c.id] = GL.effectiveScore(data, ranking, state, slug, c.id); });
    h += '<div class="section"><div class="row">Scores, 1 (low) to 3 (high). Total: ' +
      esc(GL.weightedTotal(vals, CRITERIA)) + " (C3 counts double; shown beside the rank, never reorders it).</div>";
    CRITERIA.forEach(function (c) {
      var v = vals[c.id];
      var local = state.scores[slug] && state.scores[slug][c.id];
      var drec = ranking && ranking.scores && ranking.scores[slug] && ranking.scores[slug][c.id];
      var who2 = local ? '<span class="pend">&#10033; pending, not yet synced</span>' :
        drec ? "set by " + esc(drec.by) : "";
      h += '<div class="crit" data-crit="' + esc(c.id) + '"><div class="crit-head"><b>' + esc(c.id) + "</b>" +
        '<span class="crit-text">' + esc(c.text) + "</span>" +
        (c.weight > 1 ? ' <span class="dbl">counts double</span>' : "") + "</div>" +
        '<div class="crit-val"><span>' + (v == null ? "unset" : "Value " + esc(v)) + (who2 ? ", " + who2 : "") + "</span>" +
        '<span class="cbtns" role="group" aria-label="' + esc(c.id) + ' score">' +
        [1, 2, 3].map(function (n) {
          return '<button type="button" data-act="score" data-c="' + esc(c.id) + '" data-v="' + n + '" aria-pressed="' + (v === n) + '">' + n + "</button>";
        }).join("") +
        '<button type="button" data-act="score" data-c="' + esc(c.id) + '" data-v=""' + (v == null ? " disabled" : "") + ">Clear</button></span></div></div>";
      mine.filter(function (x) { return x.ref.kind === "score" && x.ref.slug === slug && x.ref.crit === c.id; }).forEach(function (x) {
        h += '<p class="row err">' + staleHtml(x) + "</p>";
      });
    });
    h += "</div>";
    h += '<div class="section">';
    if (GL.canEdit(data, slug, who)) {
      if (!editOpen) {
        h += '<button type="button" data-act="edit">Edit title and blurb</button>';
      } else {
        h += '<form id="editForm" novalidate>' +
          '<label for="edTitle">Title (at most 4 words, 26 characters)</label>' +
          '<input type="text" id="edTitle" value="' + esc(title) + '">' +
          '<label for="edBlurb">Blurb (2 to 3 sentences, at most 60 words, "TRL ' + esc(t.trl) + '" once)</label>' +
          '<textarea id="edBlurb">' + esc(blurb) + "</textarea>" +
          '<ul class="checks" id="edChecks" aria-live="polite"></ul>' +
          '<p class="err" id="edErr" role="alert"></p>' +
          '<div class="btns"><button type="submit">Save</button> <button type="button" data-act="cancel">Cancel</button></div>' +
          "</form>";
      }
    } else if (!who) {
      h += '<p class="row">Pick your name under "You are" to edit the title and blurb of cards you own.</p>';
    } else {
      h += '<p class="row">Only the owner (' + esc(t.author || "none") + ") edits this title and blurb.</p>";
    }
    h += "</div>";
    pop.innerHTML = h;
    if (editOpen) {
      var form = $("editForm");
      var run = function () {
        var others = data.technologies.filter(function (x) { return x.slug !== slug; })
          .map(function (x) { return GL.effectiveTitle(data, state, x.slug); });
        var probs = GL.textProblems($("edTitle").value, $("edBlurb").value, t.trl, others);
        $("edChecks").innerHTML = probs.map(function (p) { return "<li>" + esc(p.rule + " " + p.detail) + "</li>"; }).join("");
      };
      $("edTitle").addEventListener("input", run);
      $("edBlurb").addEventListener("input", run);
      run();
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var r = GL.edit(data, state, slug, who, $("edTitle").value.trim(), $("edBlurb").value.trim(), nowIso());
        if (!r.ok) { $("edErr").textContent = "Not saved: " + r.reason; return; }
        editOpen = false;
        setState(r.state);
      });
    }
    placePop();
  }

  function placePop() {
    if (!popSlug) return;
    if (window.innerWidth < 700) { pop.style.left = ""; pop.style.top = ""; return; }
    var el = anchorEl(popSlug);
    if (!el) return;
    var r = el.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var left = r.right + 6;
    if (left + pw > vw - 8) left = r.left - pw - 6;
    if (left < 8) left = Math.max(8, Math.min(vw - pw - 8, r.left));
    var top = Math.max(8, Math.min(r.top, vh - ph - 8));
    if (left === Math.max(8, Math.min(vw - pw - 8, r.left)) && left !== r.right + 6) {
      top = r.bottom + 6 + ph > vh - 8 ? Math.max(8, r.top - ph - 6) : r.bottom + 6;
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function openPop(slug, byHover, focusIt) {
    clearTimeout(leaveTimer);
    if (popSlug !== slug) editOpen = false;
    var prev = popSlug ? tileEl(popSlug) : null;
    if (prev) prev.classList.remove("open");
    popSlug = slug;
    popByHover = byHover;
    pop.hidden = false;
    renderPop();
    var el = tileEl(slug);
    if (el) el.classList.add("open");
    if (focusIt) { var c = pop.querySelector("button, input, textarea"); if (c) c.focus(); }
  }

  function closePop(returnFocus) {
    if (!popSlug) return;
    var slug = popSlug;
    popSlug = null;
    editOpen = false;
    pop.hidden = true;
    pop.innerHTML = "";
    var el = tileEl(slug);
    if (el) { el.classList.remove("open"); if (returnFocus) el.focus(); }
  }

  pop.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || !popSlug) return;
    var act = b.getAttribute("data-act");
    var slug = popSlug;
    popByHover = false;
    if (act === "close") closePop(true);
    else if (act === "undo") setState(GL.undoMove(state, slug));
    else if (act === "reapply") setState(GL.reapplyMove(data, state, slug, nowIso()));
    else if (act === "dropedit") {
      var s2 = Object.assign({}, state, { edits: Object.assign({}, state.edits) });
      delete s2.edits[slug];
      setState(s2);
    }
    else if (act === "split") setState(GL.toggleSplit(data, state, slug, nowIso()));
    else if (act === "tier") {
      var tnow = GL.effectiveTier(data, ranking, state, slug);
      setState(GL.setTier(data, ranking, state, slug, tnow === "primary" ? "reserve" : "primary", nowIso()));
    }
    else if (act === "rank-up" || act === "rank-down") setState(GL.moveRank(data, ranking, state, slug, act === "rank-up" ? -1 : 1, nowIso()));
    else if (act === "score") {
      var raw = b.getAttribute("data-v");
      var r = GL.setScore(data, ranking, state, slug, b.getAttribute("data-c"), raw === "" ? null : Number(raw), nowIso());
      if (r.ok) setState(r.state);
    }
    else if (act === "move") setState(GL.move(data, state, slug, b.getAttribute("data-to"), nowIso()));
    else if (act === "edit") { editOpen = true; renderPop(); var ti = $("edTitle"); if (ti) ti.focus(); }
    else if (act === "cancel") { editOpen = false; renderPop(); }
  });
  pop.addEventListener("change", function (e) {
    var inp = e.target.closest && e.target.closest("[data-act='rank-set']");
    if (!inp || !popSlug) return;
    var r = GL.setRank(data, ranking, state, popSlug, Number(inp.value), nowIso());
    if (r.ok) setState(r.state);
    else { var er = $("rankErr"); if (er) er.textContent = " Not changed: " + r.reason + "."; }
  });
  pop.addEventListener("mouseenter", function () { clearTimeout(leaveTimer); });
  pop.addEventListener("mouseleave", function () {
    if (popByHover) leaveTimer = setTimeout(function () { closePop(false); }, 250);
  });
  pop.addEventListener("focusin", function () { popByHover = false; });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("exportPanel").hidden) { $("exportPanel").hidden = true; $("exportBtn").focus(); return; }
    if (popSlug) closePop(true);
  });
  document.addEventListener("pointerdown", function (e) {
    if (!popSlug) return;
    if (pop.contains(e.target)) return;
    var t = e.target.closest && e.target.closest(".tile");
    if (t && t.getAttribute("data-slug") === popSlug) return;
    closePop(false);
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    placePop();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitTitles, 150);
  });
  // Designer gate item 16: titles refit in the frame the grid changes width (a tablet rotation, a 698 to
  // 720 px resize across the 700 px breakpoint), before the next paint; the debounced call stays as a fallback.
  if (window.ResizeObserver) {
    var lastGridW = -1;
    new ResizeObserver(function () {
      var w = $("grid").clientWidth;
      if (w !== lastGridW) { lastGridW = w; fitTitles(); }
    }).observe($("grid"));
  }
  window.addEventListener("scroll", function () { if (popSlug && window.innerWidth >= 700) placePop(); }, true);

  // ------------------------------------------------------------ grid events
  var grid = $("grid");

  grid.addEventListener("click", function (e) {
    var tile = e.target.closest(".tile");
    if (!tile) return;
    var s = tile.getAttribute("data-slug");
    if (popSlug === s && !popByHover) closePop(false);
    else openPop(s, false, false);
  });
  grid.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var tile = e.target.closest(".tile");
    if (!tile || e.target !== tile) return;
    e.preventDefault();
    openPop(tile.getAttribute("data-slug"), false, true);
  });
  if (finePointer) {
    grid.addEventListener("mouseover", function (e) {
      var tile = e.target.closest(".tile");
      if (!tile || (e.relatedTarget && tile.contains(e.relatedTarget))) return;
      clearTimeout(hoverTimer);
      clearTimeout(leaveTimer);
      var s = tile.getAttribute("data-slug");
      if (popSlug === s) return;
      if (popSlug && !popByHover) return;
      hoverTimer = setTimeout(function () { openPop(s, true, false); }, 300);
    });
    grid.addEventListener("mouseout", function (e) {
      var tile = e.target.closest(".tile");
      if (!tile || (e.relatedTarget && tile.contains(e.relatedTarget))) return;
      clearTimeout(hoverTimer);
      if (popSlug && popByHover) leaveTimer = setTimeout(function () { closePop(false); }, 250);
    });
    grid.addEventListener("dragstart", function (e) {
      var tile = e.target.closest && e.target.closest(".tile");
      if (!tile) { e.preventDefault(); return; }
      clearTimeout(hoverTimer);
      closePop(false);
      e.dataTransfer.setData("text/plain", tile.getAttribute("data-slug"));
      e.dataTransfer.effectAllowed = "move";
    });
    grid.addEventListener("dragover", function (e) {
      var area = e.target.closest(".area");
      if (!area) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".area.drop").forEach(function (x) { if (x !== area) x.classList.remove("drop"); });
      area.classList.add("drop");
    });
    grid.addEventListener("dragleave", function (e) {
      var area = e.target.closest(".area");
      if (area && !(e.relatedTarget && area.contains(e.relatedTarget))) area.classList.remove("drop");
    });
    grid.addEventListener("drop", function (e) {
      var area = e.target.closest(".area");
      document.querySelectorAll(".area.drop").forEach(function (x) { x.classList.remove("drop"); });
      if (!area) return;
      e.preventDefault();
      var slug = e.dataTransfer.getData("text/plain");
      if (!bySlug[slug]) return;
      var to = area.getAttribute("data-letter");
      if (to === GL.effectiveArea(data, state, slug)) return;
      setState(GL.move(data, state, slug, to, nowIso()));
    });
    grid.addEventListener("dragend", function () {
      document.querySelectorAll(".area.drop").forEach(function (x) { x.classList.remove("drop"); });
    });
  }

  // ------------------------------------------------------------ export, import, clear
  function say(msg) { notes = [msg]; renderStatus(); }

  function showExport(title, text, name, mime, help) {
    var link = $("exportLink");
    if (link.href && link.href.indexOf("blob:") === 0) URL.revokeObjectURL(link.href);
    link.href = URL.createObjectURL(new Blob([text], { type: mime }));
    link.download = name;
    link.textContent = "Download " + name + " again";
    $("exportTitle").textContent = title;
    $("exportHelp").textContent = help;
    $("exportText").value = text;
    $("exportPanel").hidden = false;
    link.click();
    $("exportText").focus();
    $("exportText").select();
  }

  $("exportBtn").addEventListener("click", function () {
    if (!who) { say("Pick your name under \"You are\" before you export."); $("who").focus(); return; }
    var at = nowIso();
    var text = GL.serializeChanges(GL.exportChanges(state, who, data.cards_commit, at, data.synced_at));
    var name = who + ".json";
    showExport("Export", text, name, "application/json",
      "Save the file as display/changes/" + name + " in your clone, then commit and push it " +
      "(or send it to Quinn). If no download started, copy the text below into that file.");
    say("Exported " + GL.pendingCount(state) + " change" + (GL.pendingCount(state) === 1 ? "" : "s") + " as " + name + ".");
  });
  $("viewBtn").addEventListener("click", function () { setView(view === "grid" ? "matrix" : "grid"); });
  $("exportClose").addEventListener("click", function () { $("exportPanel").hidden = true; $("exportBtn").focus(); });
  $("copyBtn").addEventListener("click", function () {
    var ta = $("exportText");
    ta.focus(); ta.select();
    var done = false;
    try { done = document.execCommand("copy"); } catch (err) { done = false; }
    if (!done && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { done = true; }, function () {});
    $("copyBtn").textContent = "Copied";
    setTimeout(function () { $("copyBtn").textContent = "Copy text"; }, 1500);
  });

  $("importBtn").addEventListener("click", function () {
    if (!who) { say("Pick your name under \"You are\" before you import."); $("who").focus(); return; }
    $("importFile").value = "";
    $("importFile").click();
  });
  $("importFile").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var r = GL.importChanges(String(reader.result), who);
      if (!r.ok) { say("Import refused: " + r.reason + "."); return; }
      if (GL.pendingCount(state) > 0 &&
          !window.confirm("Replace your " + GL.pendingCount(state) + " local changes with the file's changes?")) return;
      var rc = GL.reconcile(data, r.state, ranking);
      closePop(false);
      setState(rc.state);
      var msg = "Imported " + f.name + ": " + GL.pendingCount(rc.state) + " pending.";
      if (rc.applied) msg += " " + rc.applied + " already synced, dropped.";
      if (rc.orphaned) msg += " " + rc.orphaned + " for unknown technologies, dropped." + droppedText(rc.dropped);
      if (rc.superseded) msg += " " + rc.superseded + " needs-split change" + (rc.superseded === 1 ? "" : "s") + " overtaken by a later sync, dropped.";
      if (rc.conflicts.length) msg += " " + rc.conflicts.length + " stale move" + (rc.conflicts.length === 1 ? "" : "s") + " (area changed by sync): open the tile to re-apply or drop.";
      if (rc.invalid.length) msg += " " + rc.invalid.length + " edit" + (rc.invalid.length === 1 ? "" : "s") + " failing the text rules: open the tile.";
      if (rc.stale.length) msg += " " + rc.stale.length + " ranking change" + (rc.stale.length === 1 ? "" : "s") + " made against an older value: Re-apply or Drop under the header.";
      say(msg);
    };
    reader.onerror = function () { say("Import refused: the file could not be read."); };
    reader.readAsText(f);
  });

  $("clearBtn").addEventListener("click", function () {
    var n = GL.pendingCount(state);
    if (n === 0) { say("Nothing to clear."); return; }
    if (!window.confirm("Clear your " + n + " local changes? Export first if you want to keep them.")) return;
    closePop(false);
    setState(GL.emptyState());
    say("Cleared " + n + " local changes.");
  });

  // ------------------------------------------------------------ start
  fillWho();
  renderChips();
  if (urlParam("view") === "matrix") setView("matrix");
  else renderAll();
  if (urlParam("pop") && bySlug[urlParam("pop")]) openPop(urlParam("pop"), false, false);

  // ------------------------------------------------------------ ?selftest=1 (page_check.py)
  function rectsIntersect(a, b) {
    return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  }
  var r2 = function (n) { return Math.round(n * 100) / 100; };
  var minOf = function (a) { return a.length ? r2(Math.min.apply(null, a)) : 0; };
  function hscrollNow() { return document.documentElement.scrollWidth > document.documentElement.clientWidth; }

  // &view=matrix: every area through the picker, in turn.
  function matrixBlock() {
    return LETTERS.map(function (L) {
      var b = document.querySelector('#matrix .picker button[data-area="' + L + '"]');
      if (b) b.click();
      var ctl = Array.prototype.filter.call(
        document.querySelectorAll('#matrix button, #matrix input, #matrix select, #matrix [draggable="true"]'),
        function (el) { return el.getClientRects().length > 0; });
      var w = [], hh = [];
      ctl.forEach(function (el) { var r = el.getBoundingClientRect(); w.push(r.width); hh.push(r.height); });
      return {
        area: L, rows: document.querySelectorAll("#matrix table.primary tbody tr[data-slug]").length,
        hscroll: hscrollNow(), controls: { count: ctl.length, min_w: minOf(w), min_h: minOf(hh) }
      };
    });
  }

  function runSelftest() {
    var matrix = view === "matrix" ? matrixBlock() : null;
    var areas = Array.prototype.map.call(document.querySelectorAll("section.area"), function (s) {
      var r = s.getBoundingClientRect();
      return { letter: s.getAttribute("data-letter"), x: r2(r.left + window.scrollX), y: r2(r.top + window.scrollY), w: r2(r.width), h: r2(r.height) };
    });
    var tiles = document.querySelectorAll(".tile");
    var tw = [], th = [], titles = [], glyphs = 0;
    Array.prototype.forEach.call(tiles, function (t) {
      var tr = t.getBoundingClientRect();
      tw.push(tr.width); th.push(tr.height);
      var g = t.querySelector(".split-glyph");
      if (g) glyphs++;
      var ti = t.querySelector(".title");
      titles.push({
        slug: t.getAttribute("data-slug"), sw: ti.scrollWidth, cw: ti.clientWidth, sh: ti.scrollHeight,
        ch: ti.clientHeight, overlap_glyph: g ? rectsIntersect(ti.getBoundingClientRect(), g.getBoundingClientRect()) : false
      });
    });
    var resources = performance.getEntriesByType("resource").map(function (e) { return e.name; });
    resources.push(document.URL);
    var block = {
      version: 2,
      viewport: { w: window.innerWidth, h: window.innerHeight },
      errors: window.__selftestErrors.slice(),
      resources: resources,
      hscroll: hscrollNow(),
      areas: areas,
      tiles: { count: tiles.length, min_w: minOf(tw), min_h: minOf(th) },
      glyph: { count: glyphs },
      titles: titles
    };
    if (matrix) block.matrix = matrix;
    var pre = document.createElement("pre");
    pre.id = "selftest";
    pre.textContent = JSON.stringify(block);
    document.body.appendChild(pre);
  }
  if (selftest) {
    if (document.readyState === "complete") runSelftest();
    else window.addEventListener("load", runSelftest);
  }
})();
</script>
</body>
</html>
