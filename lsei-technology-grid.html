  // saved value again, and is marked "not saved" meanwhile. Page memory only: a reload loses it.
  var drafts = {};
  function normText(s) { return String(s == null ? "" : s).replace(/\r\n?/g, "\n").trim(); }
  function captureDrafts() {
    var s = pop.getAttribute("data-for");
    if (!s) return;
    [["ev", "evText"], ["ck", "ckText"]].forEach(function (p) {
      var el = $(p[1]);
      if (!el) return;
      var d = drafts[s] || (drafts[s] = {});
      if (el.value !== el.getAttribute("data-shown")) d[p[0]] = el.value;
      else delete d[p[0]];
      if (!Object.keys(d).length) delete drafts[s];
    });
  }
  // The draft to show for a field, or null once it equals the saved (effective) value.
  function draftOf(slug, key, saved) {
    var d = drafts[slug];
    if (!d || d[key] == null) return null;
    if (normText(d[key]) === normText(saved)) { delete d[key]; if (!Object.keys(d).length) delete drafts[slug]; return null; }
    return d[key];
  }

  function focusKey() {

  }

        h += '<form id="editForm" novalidate>' +
          '<label for="edTitle">Title (at most 4 words, 26 characters)</label>' +
          '<input type="text" id="edTitle" value="' + esc(title) + '">' +
          '<label for="edBlurb">Blurb (2 to 3 sentences, at most 60 words, "TRL ' + esc(t.trl) + '" once)</label>' +
          '<textarea id="edBlurb">' + esc(blurb) + "</textarea>" +
          '<ul class="checks" id="edChecks" aria-live="polite"></ul>' +
          '<p class="err" id="edErr" role="alert"></p>' +
          '<div class="btns"><button type="submit">Save</button> <button type="button" data-act="cancel">Cancel</button></div>' +
          "</form>";
      }
    } else if (!who) {
      h += '<p class="row">Pick your name under "You are" to edit the title and blurb of cards you own.</p>';
    } else {
      h += '<p class="row">Only the owner (' + esc(t.author || "none") + ") edits this title and blurb.</p>";
    }
    h += "</div>";
    pop.innerHTML = h;
    pop.setAttribute("data-for", slug);
    pop.scrollTop = popScroll;
    if (fKey) { var fe = pop.querySelector(fKey); if (fe && !fe.disabled) fe.focus({ preventScroll: true }); }
    if (editOpen) {
      var form = $("editForm");
      var run = function () {
        var others = data.technologies.filter(function (x) { return x.slug !== slug; })
          .map(function (x) { return GL.effectiveTitle(data, state, x.slug); });
        var probs = GL.textProblems($("edTitle").value, $("edBlurb").value, t.trl, others);
        $("edChecks").innerHTML = probs.map(function (p) { return "<li>" + esc(p.rule + " " + p.detail) + "</li>"; }).join("");
      };
      $("edTitle").addEventListener("input", run);
      $("edBlurb").addEventListener("input", run);
      run();
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var r = GL.edit(data, state, slug, who, $("edTitle").value.trim(), $("edBlurb").value.trim(), nowIso());
        if (!r.ok) { $("edErr").textContent = "Not saved: " + r.reason; return; }
        editOpen = false;
        setState(r.state);
      });
    }
    placePop();
  }

  function placePop() {
    if (!popSlug) return;
    if (window.innerWidth < 700) { pop.style.left = ""; pop.style.top = ""; return; }
    var el = anchorEl(popSlug);
    if (!el) return;
    var r = el.getBoundingClientRect();
    var pw = pop.offsetWidth, ph = pop.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var left = r.right + 6;
    if (left + pw > vw - 8) left = r.left - pw - 6;
    if (left < 8) left = Math.max(8, Math.min(vw - pw - 8, r.left));
    var top = Math.max(8, Math.min(r.top, vh - ph - 8));
    if (left === Math.max(8, Math.min(vw - pw - 8, r.left)) && left !== r.right + 6) {
      top = r.bottom + 6 + ph > vh - 8 ? Math.max(8, r.top - ph - 6) : r.bottom + 6;
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function openPop(slug, byHover, focusIt) {
    clearTimeout(leaveTimer);
    if (popSlug !== slug) { editOpen = false; popNote = ""; }
    var prev = popSlug ? tileEl(popSlug) : null;
    if (prev) prev.classList.remove("open");
    popSlug = slug;
    popByHover = byHover;
    pop.hidden = false;
    renderPop();
    var el = tileEl(slug);
    if (el) el.classList.add("open");
    if (focusIt) { var c = pop.querySelector("button, input, textarea"); if (c) c.focus(); }
  }

  function closePop(returnFocus) {
    if (!popSlug) return;
    var slug = popSlug;
    popSlug = null;
    editOpen = false;
    captureDrafts();
    pop.removeAttribute("data-for");
    pop.hidden = true;
    pop.innerHTML = "";
    var el = tileEl(slug);
    if (el) { el.classList.remove("open"); if (returnFocus) el.focus(); }
  }

  pop.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || !popSlug) return;
    var act = b.getAttribute("data-act");
    var slug = popSlug;
    popByHover = false;
    if (act === "close") closePop(true);
    else if (act === "undo") setState(GL.undoMove(state, slug));
    else if (act === "reapply") setState(GL.reapplyMove(data, state, slug, nowIso()));
    else if (act === "dropedit") {
      var s2 = Object.assign({}, state, { edits: Object.assign({}, state.edits) });
      delete s2.edits[slug];
      setState(s2);
    }
    else if (act === "split") setState(GL.toggleSplit(data, state, slug, nowIso()));
    else if (act === "tier") {
      var tnow = GL.effectiveTier(data, ranking, state, slug);
      setState(GL.setTier(data, ranking, state, slug, tnow === "primary" ? "reserve" : "primary", nowIso()));
    }
    else if (act === "rank-up" || act === "rank-down") setState(GL.moveRank(data, ranking, state, slug, act === "rank-up" ? -1 : 1, nowIso()));
    else if (act === "score" || act === "score-clear") {
      var raw = act === "score" ? b.getAttribute("data-v") : "";
      var r = GL.setScore(data, ranking, state, slug, b.getAttribute("data-c"), raw === "" ? null : Number(raw), nowIso());
      if (r.ok) setState(r.state);
    }
    else if (act === "evidence-save" || act === "check-save") {
      var isEv = act === "evidence-save";
      var fld = pop.querySelector(isEv ? "[data-act='evidence']" : "[data-act='check']");
      var rr = (isEv ? GL.setEvidence : GL.setCheck)(data, ranking, state, slug, fld ? fld.value : "", nowIso());
      if (rr.ok) { popNote = ""; setState(rr.state); }
      else { popNote = (isEv ? "Evidence" : "Check") + " not saved: " + rr.reason + "."; renderPop(); }
    }
    else if (act === "check-sign") {
      var ci = pop.querySelector("[data-act='check']");
      if (!who) { popNote = "Pick your name under \"You are\" to sign."; renderPop(); }
      else if (ci) { ci.value = GL.signText(who, nowIso()); markUnsaved(ci); ci.focus(); }
    }
    else if (act === "move") setState(GL.move(data, state, slug, b.getAttribute("data-to"), nowIso()));
    else if (act === "edit") { editOpen = true; renderPop(); var ti = $("edTitle"); if (ti) ti.focus(); }
    else if (act === "cancel") { editOpen = false; renderPop(); }
  });
  // The "not saved" mark follows the evidence and check fields as they are typed in (and Sign).
  function markUnsaved(el) {
    var m = pop.querySelector('[data-unsaved="' + el.id + '"]');
    if (m) m.hidden = el.value === el.getAttribute("data-shown");
  }
  pop.addEventListener("input", function (e) {
    if (e.target.id === "evText" || e.target.id === "ckText") markUnsaved(e.target);
  });
  pop.addEventListener("change", function (e) {
    var inp = e.target.closest && e.target.closest("[data-act='rank-set']");
    if (!inp || !popSlug) return;
    var r = GL.setRank(data, ranking, state, popSlug, Number(inp.value), nowIso());
    if (r.ok) setState(r.state);
    else { var er = $("rankErr"); if (er) er.textContent = " Not changed: " + r.reason + "."; }
  });
  pop.addEventListener("mouseenter", function () { clearTimeout(leaveTimer); });
  pop.addEventListener("mouseleave", function () {
    if (popByHover) leaveTimer = setTimeout(function () { closePop(false); }, 250);
  });
  pop.addEventListener("focusin", function () { popByHover = false; });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("exportPanel").hidden) { $("exportPanel").hidden = true; $("exportBtn").focus(); return; }
    if (popSlug) closePop(true);
  });
  document.addEventListener("pointerdown", function (e) {
    if (!popSlug) return;
    if (pop.contains(e.target)) return;
    var t = e.target.closest && e.target.closest(".tile");
    if (t && t.getAttribute("data-slug") === popSlug) return;
    closePop(false);
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    placePop();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitTitles, 150);
  });
  // Designer gate item 16: titles refit in the frame the grid changes width (a tablet rotation, a 698 to
  // 720 px resize across the 700 px breakpoint), before the next paint; the debounced call stays as a fallback.
  if (window.ResizeObserver) {
    var lastGridW = -1;
    new ResizeObserver(function () {
      var w = $("grid").clientWidth;
      if (w !== lastGridW) { lastGridW = w; fitTitles(); }
    }).observe($("grid"));
  }
  window.addEventListener("scroll", function () { if (popSlug && window.innerWidth >= 700) placePop(); }, true);

  // ------------------------------------------------------------ grid events
  var grid = $("grid");

  grid.addEventListener("click", function (e) {
    var tile = e.target.closest(".tile");
    if (!tile) return;
    var s = tile.getAttribute("data-slug");
    if (popSlug === s && !popByHover) closePop(false);
    else openPop(s, false, false);
  });
  grid.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var tile = e.target.closest(".tile");
    if (!tile || e.target !== tile) return;
    e.preventDefault();
    openPop(tile.getAttribute("data-slug"), false, true);
  });
  if (finePointer) {
    grid.addEventListener("mouseover", function (e) {
      var tile = e.target.closest(".tile");
      if (!tile || (e.relatedTarget && tile.contains(e.relatedTarget))) return;
      clearTimeout(hoverTimer);
      clearTimeout(leaveTimer);
      var s = tile.getAttribute("data-slug");
      if (popSlug === s) return;
      if (popSlug && !popByHover) return;
      hoverTimer = setTimeout(function () { openPop(s, true, false); }, 300);
    });
    grid.addEventListener("mouseout", function (e) {
      var tile = e.target.closest(".tile");
      if (!tile || (e.relatedTarget && tile.contains(e.relatedTarget))) return;
      clearTimeout(hoverTimer);
      if (popSlug && popByHover) leaveTimer = setTimeout(function () { closePop(false); }, 250);
    });
    grid.addEventListener("dragstart", function (e) {
      var tile = e.target.closest && e.target.closest(".tile");
      if (!tile) { e.preventDefault(); return; }
      clearTimeout(hoverTimer);
      closePop(false);
      e.dataTransfer.setData("text/plain", tile.getAttribute("data-slug"));
      e.dataTransfer.effectAllowed = "move";
    });
    grid.addEventListener("dragover", function (e) {
      var area = e.target.closest(".area");
      if (!area) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      document.querySelectorAll(".area.drop").forEach(function (x) { if (x !== area) x.classList.remove("drop"); });
      area.classList.add("drop");
    });
    grid.addEventListener("dragleave", function (e) {
      var area = e.target.closest(".area");
      if (area && !(e.relatedTarget && area.contains(e.relatedTarget))) area.classList.remove("drop");
    });
    grid.addEventListener("drop", function (e) {
      var area = e.target.closest(".area");
      document.querySelectorAll(".area.drop").forEach(function (x) { x.classList.remove("drop"); });
      if (!area) return;
      e.preventDefault();
      var slug = e.dataTransfer.getData("text/plain");
      if (!bySlug[slug]) return;
      var to = area.getAttribute("data-letter");
      if (to === GL.effectiveArea(data, state, slug)) return;
      setState(GL.move(data, state, slug, to, nowIso()));
    });
    grid.addEventListener("dragend", function () {
      document.querySelectorAll(".area.drop").forEach(function (x) { x.classList.remove("drop"); });
    });
  }

  // ------------------------------------------------------------ export, import, clear
  function say(msg) { notes = [msg]; renderStatus(); }

  function showExport(title, text, name, mime, help) {
    var link = $("exportLink");
    if (link.href && link.href.indexOf("blob:") === 0) URL.revokeObjectURL(link.href);
    link.href = URL.createObjectURL(new Blob([text], { type: mime }));
    link.download = name;
    link.textContent = "Download " + name + " again";
    $("exportTitle").textContent = title;
    $("exportHelp").textContent = help;
    $("exportText").value = text;
    $("exportPanel").hidden = false;
    link.click();
    $("exportText").focus();
    $("exportText").select();
  }

  $("exportBtn").addEventListener("click", function () {
    if (!who) { say("Pick your name under \"You are\" before you export."); $("who").focus(); return; }
    var at = nowIso();
    var text = GL.serializeChanges(GL.exportChanges(state, who, data.cards_commit, at, data.synced_at));
    var name = who + ".json";
    showExport("Export", text, name, "application/json",
      "Save the file as display/changes/" + name + " in your clone, then commit and push it " +
      "(or send it to Quinn). If no download started, copy the text below into that file.");
    say("Exported " + GL.pendingCount(state) + " change" + (GL.pendingCount(state) === 1 ? "" : "s") + " as " + name + ".");
  });
  $("viewBtn").addEventListener("click", function () { setView(view === "grid" ? "matrix" : "grid"); });
  $("exportClose").addEventListener("click", function () { $("exportPanel").hidden = true; $("exportBtn").focus(); });
  $("copyBtn").addEventListener("click", function () {
    var ta = $("exportText");
    ta.focus(); ta.select();
    var done = false;
    try { done = document.execCommand("copy"); } catch (err) { done = false; }
    if (!done && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { done = true; }, function () {});
    $("copyBtn").textContent = "Copied";
    setTimeout(function () { $("copyBtn").textContent = "Copy text"; }, 1500);
  });

  $("importBtn").addEventListener("click", function () {
    if (!who) { say("Pick your name under \"You are\" before you import."); $("who").focus(); return; }
    $("importFile").value = "";
    $("importFile").click();
  });
  $("importFile").addEventListener("change", function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var r = GL.importChanges(String(reader.result), who);
      if (!r.ok) { say("Import refused: " + r.reason + "."); return; }
      if (GL.pendingCount(state) > 0 &&
          !window.confirm("Replace your " + GL.pendingCount(state) + " local changes with the file's changes?")) return;
      var rc = GL.reconcile(data, r.state, ranking);
      closePop(false);
      setState(rc.state);
      var msg = "Imported " + f.name + ": " + GL.pendingCount(rc.state) + " pending.";
      if (rc.applied) msg += " " + rc.applied + " already synced, dropped.";
      if (rc.orphaned) msg += " " + rc.orphaned + " for unknown technologies, dropped." + droppedText(rc.dropped);
      if (rc.superseded) msg += " " + rc.superseded + " needs-split change" + (rc.superseded === 1 ? "" : "s") + " overtaken by a later sync, dropped.";
      if (rc.conflicts.length) msg += " " + rc.conflicts.length + " stale move" + (rc.conflicts.length === 1 ? "" : "s") + " (area changed by sync): open the tile to re-apply or drop.";
      if (rc.invalid.length) msg += " " + rc.invalid.length + " edit" + (rc.invalid.length === 1 ? "" : "s") + " failing the text rules: open the tile.";
      if (rc.stale.length) msg += " " + rc.stale.length + " ranking change" + (rc.stale.length === 1 ? "" : "s") + " made against an older value: Re-apply or Drop under the header.";
      say(msg);
    };
    reader.onerror = function () { say("Import refused: the file could not be read."); };
    reader.readAsText(f);
  });

  $("clearBtn").addEventListener("click", function () {
    var n = GL.pendingCount(state);
    if (n === 0) { say("Nothing to clear."); return; }
    if (!window.confirm("Clear your " + n + " local changes? Export first if you want to keep them.")) return;
    closePop(false);
    setState(GL.emptyState());
    say("Cleared " + n + " local changes.");
  });

  // ------------------------------------------------------------ start
  fillWho();
  renderChips();
  var areaParam = urlParam("area");
  if (areaParam && LETTERS.indexOf(areaParam) >= 0) matrixArea = areaParam;
  if (urlParam("view") === "matrix") setView("matrix");
  else renderAll();
  if (urlParam("pop") && bySlug[urlParam("pop")]) openPop(urlParam("pop"), false, false);

  // ------------------------------------------------------------ ?selftest=1 (page_check.py)
  function rectsIntersect(a, b) {
    return a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
  }
  var r2 = function (n) { return Math.round(n * 100) / 100; };
  var minOf = function (a) { return a.length ? r2(Math.min.apply(null, a)) : 0; };
  function hscrollNow() { return document.documentElement.scrollWidth > document.documentElement.clientWidth; }

  // &view=matrix: every area through the picker, in turn (&area=x: that area only).
  function matrixBlock() {
    var list = areaParam && LETTERS.indexOf(areaParam) >= 0 ? [areaParam] : LETTERS;
    return list.map(function (L) {
      var b = document.querySelector('#matrix .picker button[data-area="' + L + '"]');
      if (b) b.click();
      var ctl = Array.prototype.filter.call(
        document.querySelectorAll('#matrix button, #matrix input, #matrix select, #matrix [draggable="true"]'),
        function (el) { return el.getClientRects().length > 0; });
      var w = [], hh = [];
      ctl.forEach(function (el) { var r = el.getBoundingClientRect(); w.push(r.width); hh.push(r.height); });
      return {
        area: L, rows: document.querySelectorAll("#matrix table.primary tbody tr[data-slug]").length,
        hscroll: hscrollNow(), controls: { count: ctl.length, min_w: minOf(w), min_h: minOf(hh) }
      };
    });
  }

  // &pop=<slug>: sideways scroll and the size of the visible popover controls.
  function popBlock() {
    var ctl = Array.prototype.filter.call(pop.querySelectorAll("button, input, textarea, select"),
      function (el) { return el.getClientRects().length > 0; });
    var w = [], hh = [];
    ctl.forEach(function (el) { var r = el.getBoundingClientRect(); w.push(r.width); hh.push(r.height); });
    return { hscroll: hscrollNow(), controls: { count: ctl.length, min_w: minOf(w), min_h: minOf(hh) } };
  }

  function runSelftest() {
    var popInfo = popSlug ? popBlock() : null;
    var matrix = view === "matrix" ? matrixBlock() : null;
    var areas = Array.prototype.map.call(document.querySelectorAll("section.area"), function (s) {
      var r = s.getBoundingClientRect();
      return { letter: s.getAttribute("data-letter"), x: r2(r.left + window.scrollX), y: r2(r.top + window.scrollY), w: r2(r.width), h: r2(r.height) };
    });
    var tiles = document.querySelectorAll(".tile");
    var tw = [], th = [], titles = [], glyphs = 0;
    Array.prototype.forEach.call(tiles, function (t) {
      var tr = t.getBoundingClientRect();
      tw.push(tr.width); th.push(tr.height);
      var g = t.querySelector(".split-glyph");
      if (g) glyphs++;
      var ti = t.querySelector(".title");
      titles.push({
        slug: t.getAttribute("data-slug"), sw: ti.scrollWidth, cw: ti.clientWidth, sh: ti.scrollHeight,
        ch: ti.clientHeight, overlap_glyph: g ? rectsIntersect(ti.getBoundingClientRect(), g.getBoundingClientRect()) : false
      });
    });
    var resources = performance.getEntriesByType("resource").map(function (e) { return e.name; });
    resources.push(document.URL);
    var block = {
      version: 2,
      viewport: { w: window.innerWidth, h: window.innerHeight },
      errors: window.__selftestErrors.slice(),
      resources: resources,
      hscroll: hscrollNow(),
      areas: areas,
      tiles: { count: tiles.length, min_w: minOf(tw), min_h: minOf(th) },
      glyph: { count: glyphs },
      titles: titles
    };
    if (matrix) block.matrix = matrix;
    if (popInfo) block.pop = popInfo;
    var pre = document.createElement("pre");
    pre.id = "selftest";
    pre.textContent = JSON.stringify(block);
    document.body.appendChild(pre);
  }
  if (selftest) {
    if (document.readyState === "complete") runSelftest();
    else window.addEventListener("load", runSelftest);
  }
})();
</script>
</body>
</html>
