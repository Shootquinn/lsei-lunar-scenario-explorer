<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --fg: #1b1f24;
  --muted: #5b6470;
  --line: #c9ced6;
  --empty: #dfe3e8;
  --focus: #1f5fbf;
  --pending: #8a4b00;
  --pop-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
  --area-a: #2e6fbd;
  --area-b: #9a5b1e;
  --area-c: #2f8a5a;
  --area-d: #8a3fa8;
  --area-e: #b8372f;
  --area-f: #1f8792;
  --area-g: #6b7d1f;
  --area-h: #b0306f;
  --area-tint: 7%;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b;
    --surface: #1f242a;
    --fg: #e8ebef;
    --muted: #a3acb8;
    --line: #3d4550;
    --empty: #46505c;
    --focus: #7fb0ff;
    --pending: #f0b35a;
    --pop-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    --area-a: #6ea8f0;
    --area-b: #d39a5c;
    --area-c: #63c28f;
    --area-d: #c387e0;
    --area-e: #ec7e74;
    --area-f: #5cc3cd;
    --area-g: #aabd55;
    --area-h: #ea78ad;
    --area-tint: 12%;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
button, select, input, textarea { font: inherit; color: inherit; }
button {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--muted); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* header */
.top {
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.top h1 { font-size: 18px; margin: 0 0 2px; }
.legend { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
.controls select { padding: 3px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
#pending { font-weight: 600; }
.btns { display: inline-flex; gap: 6px; flex-wrap: wrap; }
#status { margin: 6px 0 0; font-size: 13px; color: var(--pending); min-height: 0; }
#status:empty { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* chips (narrow only) */
.chips { display: none; }
@media (max-width: 699px) {
  .chips {
    display: flex; gap: 4px; position: sticky; top: 0; z-index: 5;
    padding: 6px 8px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .chips a {
    flex: 1 1 0; text-align: center; min-height: 32px; line-height: 30px;
    border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: var(--fg);
    font-weight: 600;
  }
  .area { scroll-margin-top: 52px; }
}

/* areas */
.areas {
  display: grid; gap: 6px; padding: 6px;
  grid-template-columns: minmax(0, 1fr);
}
@media (min-width: 700px) { .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* 4 x 2 from 1410 px: below that a 5-slot area gives tiles under 60 px and 12 px titles lose a 4th line. */
@media (min-width: 1410px) { .areas { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.area {
  --c: var(--muted);
  border: 1px solid var(--line);
  border-top: 4px solid var(--c);
  border-radius: 6px;
  background: color-mix(in srgb, var(--c) var(--area-tint), var(--surface));
  padding: 3px;
  min-width: 0;
}
.area[data-letter="a"] { --c: var(--area-a); }
.area[data-letter="b"] { --c: var(--area-b); }
.area[data-letter="c"] { --c: var(--area-c); }
.area[data-letter="d"] { --c: var(--area-d); }
.area[data-letter="e"] { --c: var(--area-e); }
.area[data-letter="f"] { --c: var(--area-f); }
.area[data-letter="g"] { --c: var(--area-g); }
.area[data-letter="h"] { --c: var(--area-h); }
.area.drop { outline: 3px dashed var(--c); outline-offset: -3px; }
.area-head {
  display: flex; gap: 6px; align-items: baseline; min-height: 42px; padding: 2px 4px 4px;
}
.area-head .letter { font-weight: 700; color: var(--c); }
.area-head h2 { font-size: 13px; font-weight: 600; margin: 0; flex: 1 1 auto; min-width: 0; }
.area-head .count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.slots {
  display: grid; gap: 2px;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: 76px;
}
.slot-empty { border: 1px dashed var(--empty); border-radius: 4px; }

/* tiles */
.tile {
  position: relative; min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--home, var(--c));
  border-radius: 4px;
  padding: 0 1px 2px 2px;
  cursor: pointer;
  overflow: hidden;
}
.tile[draggable="true"] { cursor: grab; }
.tile:hover { border-color: var(--muted); border-left-color: var(--home, var(--c)); }
.tile.pending { border-style: dashed; border-width: 2px; border-left-width: 3px; border-color: var(--pending); border-left-color: var(--home, var(--c)); }
.tile.open { box-shadow: 0 0 0 2px var(--focus); }
.tile-top { height: 24px; display: flex; align-items: center; gap: 3px; padding-right: 16px; }
.trl { font-size: 10px; color: var(--muted); white-space: nowrap; }
/* D6: read-only marks. Needs split: 10 px glyph at top right. Reserve: R tag and a lighter fill. */
.split-glyph { position: absolute; top: 6px; right: 3px; width: 12px; height: 12px; color: var(--fg); pointer-events: none; }
.split-glyph svg { display: block; width: 12px; height: 12px; }
.split-glyph-inline svg { width: 12px; height: 12px; vertical-align: -1px; }
.legend2 { margin: -4px 0 8px; color: var(--muted); font-size: 12px; }
.rtag {
  font-size: 10px; line-height: 12px; font-weight: 700; padding: 0 3px; border-radius: 3px;
  border: 1px solid var(--muted); color: var(--muted); white-space: nowrap;
}
.tile.reserve { background: color-mix(in srgb, var(--surface) 35%, transparent); border-color: var(--empty); border-left-color: var(--home, var(--c)); }
.tile.reserve .title { color: var(--fg); }
.tile.reserve .rtag { color: var(--fg); border-color: var(--fg); }
.pmark { font-size: 11px; font-weight: 700; color: var(--pending); }
.title {
  font-size: 12px; line-height: 16px; height: 48px; letter-spacing: -0.2px;
  overflow: hidden;
  overflow-wrap: normal; word-break: normal; hyphens: manual;
}
.title.tight { letter-spacing: -0.55px; word-spacing: -0.5px; }
/* F3: card text emptied by extract; slug words shown until the refill, truncated to fit. */
.title.tpend { font-size: 10px; line-height: 12px; font-style: italic; color: var(--muted); overflow-wrap: anywhere; letter-spacing: 0; }
.title.tpend .tp { display: block; font-style: normal; font-weight: 600; color: var(--pending); }
#issues { font-weight: 600; color: var(--pending); }
#issues:empty { display: none; }
.warn { color: var(--pending); font-weight: 700; }
.area-sub { font-size: 11px; color: var(--muted); padding: 0 4px 3px; margin-top: -4px; }
#rkStale { margin: 6px 0 0; font-size: 13px; }
#rkStale:empty { display: none; }
.stale-rec { margin: 2px 0; color: var(--pending); }
.stale-rec button { margin-left: 4px; min-height: 24px; }

/* popover */
#pop {
  position: fixed; z-index: 20; width: 340px; max-width: calc(100vw - 16px);
  max-height: calc(100vh - 16px); overflow: auto;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--pop-shadow);
  padding: 10px 12px 12px;
}
#pop[hidden] { display: none; }
#pop h3 { margin: 0 28px 4px 0; font-size: 15px; }
#pop .meta { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
#pop .blurb { margin: 0 0 8px; }
#pop .row { margin: 6px 0; font-size: 13px; }
#pop .close { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; }
#pop .moves { display: flex; flex-wrap: wrap; gap: 4px; }
#pop .moves button { min-width: 34px; min-height: 32px; padding: 2px 4px; }
#pop .moves button[aria-current="true"] { font-weight: 700; border-color: var(--fg); }
#pop label { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
#pop input[type=text], #pop textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; background: var(--bg);
}
#pop textarea { min-height: 90px; resize: vertical; }
/* X-M Designer: the evidence box shows about ten lines; 1,000 characters is about 20 at 340 px. */
#pop #evText { min-height: 150px; }
#pop .checks { font-size: 12px; margin: 4px 0; padding-left: 18px; }
#pop .checks:empty { display: none; }
#pop .err { color: var(--pending); font-weight: 600; font-size: 13px; }
#pop .err:empty { display: none; }
#pop .section { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
#pop .row button { min-height: 24px; }
#pop .inl { display: inline-flex; gap: 4px; align-items: center; margin: 0; font-size: 13px; color: inherit; }
#pop .rank input { width: 3.6em; min-height: 24px; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
#pop button, #pop input, #pop textarea, #pop select { min-width: 24px; min-height: 24px; }
#pop .computed { font-weight: 600; }
#pop .computed .out, .mx td.out { font-weight: 700; text-decoration: underline; text-decoration-style: double; }
#pop .cat { padding: 6px 0; border-top: 1px dotted var(--line); }
#pop .cat:first-of-type { border-top: 0; }
#pop .cat-head { font-size: 13px; }
#pop .cat-label { margin-right: 4px; }
#pop .cat-measures { color: var(--muted); font-size: 12px; }
#pop .cat-opts { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin: 4px 0 2px; font-size: 12px; }
#pop .cat-opts button { min-width: 32px; min-height: 28px; padding: 0 6px; font-weight: 700; }
#pop .cat-opts button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
#pop .cat-val { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
#pop .twin { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
#pop .twin input[type=text] { flex: 1 1 10em; width: auto; }
#pop .who-line { font-size: 12px; color: var(--muted); }
#pop .stalechk, .mx .stalechk { color: var(--pending); font-weight: 600; }
#pop .pend { color: var(--pending); font-weight: 600; }
#pop .unsaved { color: var(--pending); font-weight: 700; }
#pop .row button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
@media (pointer: coarse) {
  #pop .cat-opts button, #pop .row button, #pop .twin button, #pop .rank input, #pop .close, #pop .moves button, .stale-rec button, #matrix button, #matrix input, .picker button { min-width: 44px; min-height: 44px; }
}
@media (max-width: 699px) {
  #pop {
    left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none;
    max-height: 75vh; border-radius: 12px 12px 0 0; overscroll-behavior: contain;
  }
}

/* matrix view (D6) */
#matrix { padding: 8px 8px 16px; min-width: 0; }
#matrix[hidden], #grid[hidden], .chips[hidden] { display: none; }
#matrix h2 { font-size: 15px; margin: 0 0 4px; }
#matrix .note { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
#matrix button, #matrix input { min-width: 24px; min-height: 24px; }
.picker { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
.picker button { min-width: 36px; min-height: 32px; font-weight: 700; }
.picker button[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.mwrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table.mx { border-collapse: separate; border-spacing: 0; font-size: 13px; width: 100%; }
.mx th, .mx td { padding: 3px 5px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; background: var(--surface); }
.mx thead th { font-size: 12px; color: var(--muted); font-weight: 600; }
/* X-M Designer: headers wrap at word gaps so the 18 columns fit a 1440 px window without sideways scroll. */
.mx thead th { white-space: normal; vertical-align: bottom; line-height: 1.2; }
.mx .r { position: sticky; left: 0; z-index: 2; width: 4.2em; min-width: 4.2em; max-width: 4.2em; text-align: right; }
.mx .t { position: sticky; left: 4.2em; z-index: 2; text-align: left; white-space: normal; min-width: 8.5em; max-width: 13em; box-shadow: 1px 0 0 var(--line); }
.mx td.r { font-weight: 700; }
.mx tr.unranked td.r { font-weight: 400; font-style: italic; color: var(--muted); font-size: 11px; }
.mx .tl, .rlist .tl { border: 0; background: none; padding: 2px 0; text-align: left; color: var(--focus); text-decoration: underline; cursor: pointer; }
.mx .acts { white-space: nowrap; }
.mx .acts button { padding: 0 6px; }
.mx .acts input { width: 3.6em; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.mx .pend { color: var(--pending); font-weight: 700; }
.mx tr[draggable="true"] { cursor: grab; }
.mx tr.dragging td { opacity: 0.45; }
.mx tr.dropto td { box-shadow: inset 0 2px 0 var(--focus); }
.mx tr.dropbelow td { box-shadow: inset 0 -2px 0 var(--focus); }
.mx .grip { color: var(--muted); margin-right: 4px; letter-spacing: -3px; cursor: grab; }
.mx .tot { font-weight: 400; color: var(--muted); }
.mx .tot.done { color: var(--fg); font-weight: 700; }
.mx th.side, .mx td.side { border-left: 1px solid var(--line); }
.mx td.chk { white-space: normal; min-width: 7em; max-width: 12em; text-align: left; font-size: 12px; }
.mx details.ev { font-size: 12px; margin-top: 2px; }
.mx details.ev summary { cursor: pointer; color: var(--focus); }
.mx details.ev div { white-space: pre-wrap; max-width: 24em; }
#matrixCriteria { margin: 6px 0 8px; font-size: 13px; }
#matrixCriteria summary { cursor: pointer; font-weight: 700; min-height: 24px; }
#matrixCriteria .ctab { overflow-x: auto; max-width: 100%; }
#matrixCriteria table { border-collapse: collapse; font-size: 12px; }
#matrixCriteria th, #matrixCriteria td { border: 1px solid var(--line); padding: 3px 5px; text-align: left; vertical-align: top; }
#matrix .err { color: var(--pending); font-weight: 600; font-size: 13px; }
#matrix .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.rlist { list-style: none; padding: 0; margin: 4px 0; }
.rlist li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--line); }

/* export panel */
#exportPanel {
  position: fixed; z-index: 30; inset: 10vh 0 auto 0; margin: 0 auto; width: min(640px, calc(100vw - 16px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--pop-shadow);
  padding: 12px;
}
#exportPanel[hidden] { display: none; }
#exportPanel h3 { margin: 0 0 6px; font-size: 15px; }
#exportPanel textarea {
  width: 100%; height: 40vh; font: 12px/1.3 ui-monospace, Consolas, monospace;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
#exportPanel .btns { margin-top: 6px; }
#exportPanel a { color: var(--focus); }

footer { padding: 8px 12px 16px; color: var(--muted); font-size: 12px; }
footer .stale { color: var(--pending); font-weight: 600; }
footer .stale:empty { display: none; }
</style>
</head>
<body>
<header class="top">
  <h1>LSEI Technology Grid</h1>
  <p class="legend">Open a tile to move it, mark needs split, move it to reserve, set its position, or score it on the ranking matrix. Export saves your changes for sync.</p>
  <p class="legend2" id="legend2"></p>
  <div class="controls">
    <label>You are <select id="who"><option value="">pick your name</option></select></label>
    <span><span id="pending">0</span> pending</span>
    <span id="issues"></span>
    <span class="btns">
      <button type="button" id="viewBtn" aria-pressed="false">Matrix</button>
      <button type="button" id="exportBtn">Export</button>
      <button type="button" id="importBtn">Import</button>
      <button type="button" id="clearBtn">Clear</button>
      <input type="file" id="importFile" accept=".json,application/json" class="sr-only" tabindex="-1" aria-hidden="true">
    </span>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="rkStale" aria-live="polite"></div>
</header>
<nav class="chips" id="chips" aria-label="Jump to area"></nav>
<main class="areas" id="grid"></main>
<section id="matrix" aria-labelledby="mxTitle" hidden></section>
<footer>
  <div id="cardsLine"></div>
  <div class="stale" id="stale"></div>
</footer>
<div id="pop" role="dialog" aria-modal="false" aria-labelledby="popTitle" hidden></div>
<div id="exportPanel" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
  <h3 id="exportTitle">Export</h3>
  <p id="exportHelp"></p>
  <textarea id="exportText" readonly aria-label="Changes file text"></textarea>
  <div class="btns">
    <a id="exportLink" href="#" download="changes.json">Download again</a>
    <button type="button" id="copyBtn">Copy text</button>
    <button type="button" id="exportClose">Close</button>
  </div>
</div>

window.GRID_DATA = {"cards_commit": "49adef7", "cards_date": "2026-11-25", "cards_dirty": false, "synced_at": "2026-11-25T22:01:26.746Z", "capacity": 25, "counts": {"a": 16, "b": 13, "c": 12, "d": 8, "e": 14, "f": 22, "g": 11, "h": 19}, "area_names": {"a": "Resource Prospecting and Characterization", "b": "Excavation", "c": "Processing and Extraction", "d": "Feedstock and Consumables Production", "e": "Storage and Transportation", "f": "In-Situ Construction and Manufacturing", "g": "Recycling and Waste Management", "h": "Strategic Resource and Propellant Architecture"}, "technologies": [{"slug": "altimetry-and-illumination-modelling", "path": "context/technologies/resource-prospecting-and-characterization/altimetry-and-illumination-modelling.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "09bdf29b21d250e3", "title": "Laser altimetry modelling", "blurb": "Models built on Lunar Orbiter Laser Altimeter polar elevation data rank polar sites by illumination and shadow. TRL 6 rests on models that reproduced LRO camera shadow features and correlated at 0.9 with the first ShadowCam image, with no lunar-surface check. The products are model outputs that shift with resolution.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "data-fusion-and-geospatial-decision-support", "path": "context/technologies/resource-prospecting-and-characterization/data-fusion-and-geospatial-decision-support.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "f0e2bd4fa417bddf", "title": "Geospatial data fusion", "blurb": "Fusion workflows combine orbital layers into ranked landing regions, sites and traverses for Artemis planning. TRL 6 is a model built on and checked against flight data; no prototype has run in an operational environment. No cited workflow reports its ranking accuracy, and no landing or in-situ ice measurement has tested a fused site choice.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "downhole-instrumented-drill-strings", "path": "context/technologies/resource-prospecting-and-characterization/downhole-instrumented-drill-strings.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "49b57e353b7a58e9", "title": "Downhole drill strings", "blurb": "Drill strings reached 305 cm on the Moon with a crew-operated drill and 2 m robotically. TRL 9 follows the study rule that any lunar use counts: Chang'e-5 drilled 1 m and logged force and current each second. No drill-string sensor has read a lunar borehole during drilling, and every hole deeper than about 3 m was drilled on Earth.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gamma-ray-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/gamma-ray-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e2f0ecaf89b5eef5", "title": "Gamma-ray spectrometry", "blurb": "Gamma-ray spectrometers map thorium, potassium, iron, titanium and uranium from lunar orbit. TRL 9 covers orbital use only: Kaguya mapped uranium and thorium for 2,674 h from 100 km polar orbit. A rover would carry a pulsed-neutron gamma-ray instrument of the PNG-GRAND class, tested only on a granite block on Earth.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "ground-penetrating-radar", "path": "context/technologies/resource-prospecting-and-characterization/ground-penetrating-radar.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "faf493357bb8084c", "title": "Ground-penetrating radar", "blurb": "Profiles layering to about 10 m, reads ice as a change in structure, which thick ice gives clearly, while at lunar polar hydrogen levels it needs a density measurement to separate pore ice from regolith. TRL 9.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "heat-flow-probes", "path": "context/technologies/resource-prospecting-and-characterization/heat-flow-probes.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2044c3a3fa283c87", "title": "Heat-flow probes", "blurb": "Probes in drilled holes measure regolith temperature, gradient and conductivity. TRL 9 follows the study rule that any lunar use counts: the Apollo 15 and 17 probes recorded for more than four years each. LISTER measured only to 0.971 m against a 3 m design depth.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-situ-mass-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/in-situ-mass-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "244b4cff87f96ee3", "title": "Mass spectrometry", "blurb": "A sealed-oven gas analyzer feeding a mass spectrometer, ~13 kg. Samples are sealed in an oven and heated, and the mass spec measures the water, other volatiles and isotope ratios that come off. TRL 9 by off-world use; Curiosity SAM and Phoenix TEGA analyzed heated Martian soil.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-situ-optical-composition", "path": "context/technologies/resource-prospecting-and-characterization/in-situ-optical-composition.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7a5c7e8f4f41a1cd", "title": "LIBS, Raman and APXS", "blurb": "Three spectrometer types read surface composition in place: APXS by X-ray emission, LIBS by laser plasma and Raman by laser scattering. TRL 9 covers APXS and LIBS on the Moon; Pragyan made 23 APXS measurements near 69.37 deg S. Raman has no lunar operation, and each reading covers less than a millimetre of surface at one stop.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "lander-orbiter-sensing-platform", "path": "context/technologies/resource-prospecting-and-characterization/lander-orbiter-sensing-platform.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8a085dd66d3289ed", "title": "Landers and orbiters", "blurb": "Orbiters and landers carry sensors to lunar orbit and the lunar surface. TRL 9 rests on Kaguya in orbit and the Chang'e-4 and Blue Ghost landers on the Moon. Survey instruments would ride a VIPER-class polar rover, and the carrier's level sets no instrument's level.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "machine-learning-analysis-software", "path": "context/technologies/resource-prospecting-and-characterization/machine-learning-analysis-software.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "efdc82e1682d5232", "title": "Machine learning tools", "blurb": "Machine-learning software detects craters and enhances images of permanently shadowed regions on archived lunar data. TRL 6 rests on models trained on LRO NAC images and checked against sunlit images and 50,000 human-vetted ShadowCam detections. Real lunar data has produced no ice-mapping result, and no model has run on flight hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "neutron-spectrometry", "path": "context/technologies/resource-prospecting-and-characterization/neutron-spectrometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7c0a58655c6c4823", "title": "Neutron spectrometry", "blurb": "An active pulsed-neutron instrument, Dynamic Albedo Neutron (DAN) class, as flown on the Curiosity Mars rover. It reads water-equivalent hydrogen to about 1 m on the lunar surface without waiting on cosmic rays. TRL 9 by off-world use (Mars).", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "psr-optical-imaging", "path": "context/technologies/resource-prospecting-and-characterization/psr-optical-imaging.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "24dbbd036e0ddf53", "title": "Shadowed floor imaging", "blurb": "Orbital cameras image permanently shadowed region floors by secondary light. TRL 9 covers orbital use only: ShadowCam on KPLO and the LRO narrow-angle camera. A rover would image shadowed floors with its own cameras, which rest on Mars rover camera heritage, and its own lights; neither has a shadowed-floor result.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "resource-assessment-methodology", "path": "context/technologies/resource-prospecting-and-characterization/resource-assessment-methodology.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "4dd62fcc32b71516", "title": "Resource assessment method", "blurb": "The terrestrial reserve-classification method is applied to lunar data to rate resources and simulated ice. TRL 6 by owner ruling: the method is in commercial use in Earth mining and its lunar relevance is argued on the card. Water ice classifies only as a speculative unrecoverable resource so far.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "seismic-sensing", "path": "context/technologies/resource-prospecting-and-characterization/seismic-sensing.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "9482b3cd7457577c", "title": "Seismic sensing", "blurb": "Seismometers and geophones measure moonquakes, crust thickness and an 8.5 m regolith layer. TRL 9 follows the study rule that any lunar use counts: Apollo stations ran on the surface from 1969 to 1977. No cited seismic result detects ice.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "terramechanics-characterization", "path": "context/technologies/resource-prospecting-and-characterization/terramechanics-characterization.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a00f8ad259ad880f", "title": "Terramechanics", "blurb": "Penetrometers, samplers and rover wheels measure regolith density, cohesion, friction angle and bearing. TRL 9 follows the study rule that any lunar use counts: the Apollo penetrometer reached 76 cm and Yutu-2 wheel data gave shear parameters. Every value comes from the top few metres outside shadowed regions, and icy regolith has been tested only in terrestrial simulant.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "thermal-infrared-radiometry", "path": "context/technologies/resource-prospecting-and-characterization/thermal-infrared-radiometry.md", "area": "a", "areas": ["a"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "cd6fc41c793f9fc7", "title": "Thermal infrared imaging", "blurb": "Thermal radiometers map lunar surface temperature; Diviner on LRO has reached 29 K. TRL 9 covers orbital use only: Diviner has measured from polar orbit since 5 July 2009. No cited thermal-infrared instrument has measured from the lunar surface.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-excavation-and-hybrid-control", "path": "context/technologies/excavation-systems/autonomous-excavation-and-hybrid-control.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "cf41809b84f05bb8", "title": "Excavation autonomy", "blurb": "Software digs regolith under autonomy, teleoperation or a hybrid of both. TRL 6 follows Earth operation: supervised autonomous mining runs in industry, and a terrestrial excavator dug a pit autonomously at near human cycle times. No autonomy test in vacuum, reduced gravity or thermal vacuum is on file; the IPEx Autodig software ran only in a laboratory bin.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "bucket-drum-excavator", "path": "context/technologies/excavation-systems/bucket-drum-excavator.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "87e006275968a422", "title": "Bucket drum and wheel", "blurb": "Bucket drums, wheels and ladders dig regolith; ladders have reached 2,400 kg/h in sand. TRL 5 rests on vacuum tests of the IPEx drum excavator's actuators; wheel and ladder hardware alone rates a level lower. No such machine has dug in vacuum or true 1/6 g, and mission-scale figures rest on a slide deck and an abstract.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cold-tolerant-actuators", "path": "context/technologies/excavation-systems/cold-tolerant-actuators.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7e087b7931387d69", "title": "Cold-tolerant actuators", "blurb": "Actuators, motors and bearings drive rovers and diggers in lunar cold. TRL 9 by owner ruling: cold-tolerant actuators run by the thousands on spacecraft across the solar system. VIPER's mobility actuators passed thermal-vacuum flight qualification.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "conveyors-belt-screw-trough", "path": "context/technologies/excavation-systems/conveyors-belt-screw-trough.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "96298f1d8eb62766", "title": "Belt and screw conveyors", "blurb": "Belt, screw and trough conveyors lift regolith into reactors. TRL 6 follows Earth operation: belt and screw conveyors are routine mining hardware, and an enclosed auger fed tephra batches into an ISRU reactor at Mauna Kea. None has a measured throughput in vacuum or lunar gravity, and fast vertical screws starved of feed in reduced-gravity flights.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "dust-suppression-and-removal", "path": "context/technologies/excavation-systems/dust-suppression-and-removal.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8d427004036fa2a5", "title": "Dust suppression", "blurb": "Brushes, wipes and an electrodynamic dust shield clear dust from hardware. TRL 9 rests on the Apollo nylon brush, which removed coarse dust on the Moon in 1969-1972; the Blue Ghost shield sits lower. No Apollo method cleared dust fully, and no cleaning fraction from flight is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "dust-tolerant-mechanisms", "path": "context/technologies/excavation-systems/dust-tolerant-mechanisms.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "8d1b0a4ded0c0bb8", "title": "Dust-tolerant mechanisms", "blurb": "PTFE lip seals and grease-packed bearings keep lunar simulant out of moving parts. TRL 9 rests on off-world use: spring-preloaded PTFE seals of the same type flew on the Mars Exploration Rover arm. Bearings in dust sit far lower, and no cited test ran a seal at lunar temperatures.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "excavation-mobile-platform", "path": "context/technologies/excavation-systems/excavation-mobile-platform.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "38d045573cc1aefa", "title": "Bulldozers", "blurb": "Blade-equipped tractive vehicles push, level and smooth regolith; drawbar pull is the critical function. TRL 9 rests on Yutu-2, Apollo Lunar Roving Vehicle and Lunokhod running gear on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "excavator-mobility", "path": "context/technologies/excavation-systems/excavator-mobility.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "dd4b08b2f19752ad", "title": "Excavator traction", "blurb": "Wheels give excavators traction in reduced-gravity soil. TRL 9 rests on Yutu-2 wheels that ran on the Moon at slip ratios of -0.1 and 0.1. No wheel has pulled under excavation load on the Moon, in vacuum or at true 1/6 g.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gravity-fed-hopper-flow", "path": "context/technologies/excavation-systems/gravity-fed-hopper-flow.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ef0d26a28101ae31", "title": "Hopper and feeder flow", "blurb": "Vibrated hoppers with rotary-pocket feeders move regolith by gravity. TRL 6 rests on eight hopper-and-feeder assemblies that fed in 330 of 330 vibration-on runs at 0.16 g in parabolic flight. Every lunar-gravity hopper test ran in flight or drop-tower windows, none in hard vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "haul-truck-and-conventional-excavation", "path": "context/technologies/excavation-systems/haul-truck-and-conventional-excavation.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "4ea3a57f46dd23ef", "title": "Haul trucks", "blurb": "Haul trucks and conventional equipment carry excavated regolith. TRL 9 by owner ruling: the Apollo rover, Lunokhod and Yutu-2 drove and carried loads on the Moon, and rovers work on Mars today. Canadian and US crewed lunar vehicles are on a path to flight.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "icy-regolith-excavation", "path": "context/technologies/excavation-systems/icy-regolith-excavation.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e67425d777289418", "title": "Regolith excavation", "blurb": "Bucket drums, bucket wheels and ladders dig loose regolith; chain trenchers and milling-bit machines cut ice-cemented regolith. TRL 5 by owner ruling, carried from the drum excavator actuators life-tested in vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "passive-anti-adhesion-surfaces", "path": "context/technologies/excavation-systems/passive-anti-adhesion-surfaces.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2172c71a800a7584", "title": "Anti-adhesion surfaces", "blurb": "Laser-patterned and coated surfaces shed lunar dust without power. TRL 9 rests on a laser-patterned Ti-6Al-4V coupon that gathered dust and showed a cleaned surface on the Moon in 2025. No coverage, adhesion or cleaning value is reported; the one cleaning, shown only in a caption, has an unknown cause.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "robotic-arm-manipulator", "path": "context/technologies/excavation-systems/robotic-arm-manipulator.md", "area": "b", "areas": ["b"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "403e64b82785049b", "title": "Robotic arm", "blurb": "Robotic arms scoop and trench regolith for sampling. TRL 9 rests on the Surveyor III and Surveyor VII samplers, which trenched and ran bearing tests on the Moon in 1967 and 1968. No arm has dug beyond sampling scale; 2 kg is the largest arm collection reported on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "carbothermal-reduction", "path": "context/technologies/resource-processing-and-extraction/carbothermal-reduction.md", "area": "c", "areas": ["c", "b", "d", "h"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ca11e6c91f5cb7b5", "title": "Carbothermal reduction", "blurb": "Carbothermal reactors heat regolith to yield carbon monoxide, then oxygen. TRL 6 is the developers' stated level after thermal-vacuum tests of the Sierra Space COPR reactor; test runs alone support a level lower. The campaign reports no per-test oxygen yield, and the carbon monoxide to oxygen steps lay outside the tested hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "electrostatic-separation-of-regolith", "path": "context/technologies/resource-processing-and-extraction/electrostatic-separation-of-regolith.md", "area": "c", "areas": ["c"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "caa616fc15faa592", "title": "Electrostatic separation", "blurb": "Tribocharging sorts ilmenite from regolith; one pass doubled the ilmenite grade of a highland simulant in reduced-gravity flight. TRL 6 rests on dry electrostatic separators sold for ilmenite and rutile on Earth. Vacuum operation of those separators is unproven: grain charging changes in vacuum, and no run on file combines vacuum with reduced gravity.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "helium-3-extraction", "path": "context/technologies/resource-processing-and-extraction/helium-3-extraction.md", "area": "c", "areas": ["c", "a", "b", "d", "e", "h"], "pointer": false, "author": "nikki", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2e037346ca6492ae", "title": "Helium-3 extraction", "blurb": "Heated regolith releases helium-3 for capture. TRL 4 rests on the HEAT breadboard, which removed up to 96 % of implanted helium-4 from simulant at 9.0 g/s. No extraction unit has run in vacuum or reduced gravity, and full-scale miners exist only as design studies.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrogen-reduction-of-ilmenite", "path": "context/technologies/resource-processing-and-extraction/hydrogen-reduction-of-ilmenite.md", "area": "c", "areas": ["c", "d"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7b4137a5f0cdb92b", "title": "Hydrogen reduction", "blurb": "Hydrogen reduces ilmenite in regolith to yield oxygen, a few weight percent of the feed. TRL 6 takes the higher of NASA's 5/6 rating; test runs alone support two levels lower. No reactor has run in vacuum or thermal vacuum.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-place-thermal-mining", "path": "context/technologies/resource-processing-and-extraction/in-place-thermal-mining.md", "area": "c", "areas": ["c", "b", "e"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "10ee98369b75af50", "title": "In-place thermal mining", "blurb": "Heaters sublimate ice from regolith in place. TRL 6 rests on in situ thermal desorption, which heats soil and draws off vapour at full scale on Earth. Lunar vacuum operation is unproven: a desiccated layer throttles vapour escape in breadboard tests, and the capture tent and cold traps exist only as designs.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "magnetic-separation-of-lunar-soils", "path": "context/technologies/resource-processing-and-extraction/magnetic-separation-of-lunar-soils.md", "area": "c", "areas": ["c"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "d02c955e8e569c08", "title": "Magnetic separation", "blurb": "Magnets concentrate anorthite, ilmenite and metallic iron from lunar soil. TRL 6 rests on dry magnetic separators sold for Earth mining. No separator on file has run in reduced gravity or above gram scale, and the card's evidence names no vacuum effect on dry magnetic separation.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "molten-regolith-electrolysis", "path": "context/technologies/resource-processing-and-extraction/molten-regolith-electrolysis.md", "area": "c", "areas": ["c", "d", "f"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2473c895d6f69373", "title": "Regolith electrolysis", "blurb": "Electric current frees oxygen from molten regolith. TRL 6 takes the higher of NASA's 5/6 rating, and a 25 kg reactor run for 9 hours in a vacuum chamber matches it. That level depends on one run that missed its energy-efficiency threshold, and anode, cathode and containment life is unproven.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "molten-salt-electrolysis-ffc", "path": "context/technologies/resource-processing-and-extraction/molten-salt-electrolysis-ffc.md", "area": "c", "areas": ["c", "d", "f"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2f667b7214f4b1f7", "title": "Molten salt electrolysis", "blurb": "Molten salt cells strip oxygen from regolith; laboratory FFC cells removed 85 to 99 % of it from 24-30 g simulant charges. TRL 6 rests on Metalysis industrial-scale metal powder production on Earth. Vacuum operation is unproven: the cells with quantified extraction ran only under argon cover gas at 1 g, and their anodes were consumed, broke or passivated.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "reactor-regolith-feed-and-discharge", "path": "context/technologies/resource-processing-and-extraction/reactor-regolith-feed-and-discharge.md", "area": "c", "areas": ["c", "b"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "2476976a8f9a6652", "title": "Reactor feed and discharge", "blurb": "Valves and feeders move regolith into and out of reactors. TRL 6 is the authors' level for a thermal-vacuum carbothermal prototype with automated handling; the test runs alone support a lower level. No reactor valve has run in lunar gravity, and no measured seal wear life is reported.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "regolith-crushing-grinding-and-size-sorting", "path": "context/technologies/resource-processing-and-extraction/regolith-crushing-grinding-and-size-sorting.md", "area": "c", "areas": ["c"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a6a2b02e71c9d55c", "title": "Crushing and size sorting", "blurb": "Crushers, a ball mill and screens reduce basalt and sort regolith by grain size before separation and reduction. TRL 6 rests on crushers, mills and screens sold and run in Earth mining. Lunar sieving hardware has run only in laboratories at Earth gravity, and the 1988 plant design expects screens and ball mills to lose capacity on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "thermal-water-extraction-excavated", "path": "context/technologies/resource-processing-and-extraction/thermal-water-extraction-excavated.md", "area": "c", "areas": ["c", "b", "e"], "pointer": false, "author": "nikki", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "00dd8db0ab429d93", "title": "Thermal water extraction", "blurb": "Heat drives water out of excavated icy regolith. TRL 6 rests on LUWEX, which extracted and captured water from a 13 kg simulant batch in thermal vacuum at 2.06 g/h. It needs liquid-nitrogen capture cooling and its seals fouled with dust; NASA's continuous auger-dryer reactor stopped two levels lower.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "vacuum-vapour-phase-pyrolysis", "path": "context/technologies/resource-processing-and-extraction/vacuum-vapour-phase-pyrolysis.md", "area": "c", "areas": ["c", "b", "d", "h"], "pointer": false, "author": "nikki", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a5497e97d1131139", "title": "Vacuum pyrolysis", "blurb": "Heat in vacuum vaporizes regolith to release oxygen; a breadboard measured 35 mg O2 from 3.38 g of simulant under argon at about 13 mbar. TRL 4 is a laboratory breadboard validation. No high-vacuum or thermal-vacuum run has quantified oxygen; window failure and product condensation stay unresolved.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrogen-liquefaction", "path": "context/technologies/feedstock-and-consumables-production/hydrogen-liquefaction.md", "area": "d", "areas": ["d"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "98075a06cd3c9e79", "title": "Hydrogen liquefaction", "blurb": "Cryocoolers chill hydrogen gas to liquid for propellant. TRL 6 follows Earth operation: hydrogen liquefaction is industrial, and a ground unit liquefied over 200 kg into a 125,000 L tank at Kennedy Space Center. The flight-class 20 K cooler has run only in a vacuum bell jar and has not liquefied hydrogen.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "oxygen-cryocooler-liquefaction", "path": "context/technologies/feedstock-and-consumables-production/oxygen-cryocooler-liquefaction.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a6883c098c765dd3", "title": "Oxygen liquefaction", "blurb": "A cryocooler liquefies oxygen inside a lander-scale tank at up to 1.56 kg/h. TRL 6 rests on Earth practice: commercial cryocoolers liquefy oxygen and nitrogen, and an industrial cold head ran four months of tank liquefaction in thermal vacuum. A flight-class cooler, condensation at reduced gravity and methane remain untested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "pem-water-electrolysis", "path": "context/technologies/feedstock-and-consumables-production/pem-water-electrolysis.md", "area": "d", "areas": ["d", "c"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "9e6dd417101d66ba", "title": "PEM electrolysis", "blurb": "PEM stacks split water into hydrogen and oxygen. TRL 7 rests on the ISS Oxygen Generation Assembly, which has run in orbit since 2007 and made 14,598 kg of oxygen on station potable water. No stack has run at lunar gravity or on lunar-derived water; the only lunar-gravity data are 18 s parabolic-flight runs of one cell design.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "product-gas-composition-analysis", "path": "context/technologies/feedstock-and-consumables-production/product-gas-composition-analysis.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0a4b1e0a0b704489", "title": "Product gas analysis", "blurb": "Analyzers measure oxygen purity and carbon monoxide in oxygen-plant product gas. TRL 9 follows the study rule that any lunar use counts: the MSolo analyzer took 43 scans of ambient and lander-vent gas on the Moon. No analyzer has measured plant product gas on the Moon, and the only tank-oxygen acceptance against a purity limit reports no measured values.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "product-gas-drying", "path": "context/technologies/feedstock-and-consumables-production/product-gas-drying.md", "area": "d", "areas": ["d"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "91c1b4c4c576cec8", "title": "Product gas drying", "blurb": "Regenerative desiccant beds dry product gas before liquefaction. TRL 9 rests on orbital use: silica gel and zeolite 13X beds dry gas in the ISS carbon dioxide removal assembly. The flown beds dried cabin air, and the one hydrogen-relevant reading, 16 ppm at 4 hours, misses the 9 ppmv limit.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "sabatier-methanation", "path": "context/technologies/feedstock-and-consumables-production/sabatier-methanation.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c5072003a907f3c7", "title": "Sabatier methanation", "blurb": "A Sabatier reactor turns carbon dioxide and hydrogen into methane and water. TRL 7 rests on the ISS Sabatier Assembly, which ran in orbit from 2011 to 2017 and made about 1,081 kg of water. No source reviewed reports a vacuum test, and no lunar carbon feed has Sabatier figures.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solid-oxide-electrolysis", "path": "context/technologies/feedstock-and-consumables-production/solid-oxide-electrolysis.md", "area": "d", "areas": ["d", "c"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "64230eae3d66824f", "title": "Solid oxide electrolysis", "blurb": "Solid oxide stacks split carbon dioxide or steam to make oxygen. TRL 7 rests on MOXIE, which produced 49.9 g of oxygen on Mars from atmospheric CO2. No stack has run on lunar feed, and steam electrolysis, the mode a lunar water plant would use, draws on an abstract with no numbers and a NASA claim citing no test report.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "water-cleanup-adsorption-filtration", "path": "context/technologies/feedstock-and-consumables-production/water-cleanup-adsorption-filtration.md", "area": "d", "areas": ["d"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "04fc2ee9a3bca5b1", "title": "Water cleanup", "blurb": "Filtration, adsorbent and ion-exchange beds and a catalytic reactor clean wastewater. TRL 7 rests on the ISS Water Processor Assembly, which has cleaned crew-loop wastewater in orbit since 2008. The only evidence for cleaning simulated ISRU water is one laboratory paper and slide-level claims.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "active-cooling-zero-boil-off", "path": "context/technologies/storage-and-transportation/active-cooling-zero-boil-off.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "17746721476222ee", "title": "Zero boil-off cooling", "blurb": "Active cooling holds cryogenic propellant with no vent: liquid methane for 165 days from ground fill, and liquid hydrogen at zero boil-off in a 125 m3 ground tank. TRL 7 rests on the Robotic Refueling Mission 3 methane hold of about 4 months on the ISS. Hydrogen zero boil-off has no vacuum, lunar-surface or reduced-gravity test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "automated-fluid-power-data-umbilical", "path": "context/technologies/storage-and-transportation/automated-fluid-power-data-umbilical.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "63a147febbb9511a", "title": "Automated umbilical", "blurb": "A dust-tolerant umbilical mates fluid, power and data lines to a vehicle. TRL 6 rests on commercial robotic tool changers that couple liquid, gas, power and data in one joint, with a KSC prototype field tested on a rover. No test with fluid, dust simulant or vacuum is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "electromagnetic-mass-driver", "path": "context/technologies/storage-and-transportation/electromagnetic-mass-driver.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b0d47db9fa323127", "title": "Mass driver", "blurb": "A track of driven coils throws regolith or product to lunar orbit with no propellant. TRL 6 rests on built and run linear induction motor tracks, Navy motor heritage and aircraft launchers on Earth. The fastest track reached 71 m/s against 1.7 to 2.53 km/s needed, and every lunar launcher remains a paper design.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "frozen-water-containment-and-haul", "path": "context/technologies/storage-and-transportation/frozen-water-containment-and-haul.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "727790643e301573", "title": "Frozen water haul", "blurb": "Extracted water freezes in a radiator-cooled tank in a permanently shadowed region and thaws in sunlight at the plant. TRL 5 rests on an aluminium plate that froze water vapour in vacuum at tanker pressure and wall temperature for 50-300 hours. No tank has been loaded through its radiator, hauled or thawed, and the 1/5-scale tanker has no reported test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "high-pressure-gas-storage", "path": "context/technologies/storage-and-transportation/high-pressure-gas-storage.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "90d2b322d0433c8c", "title": "High-pressure gas storage", "blurb": "Tanks hold gas at high pressure. TRL 9 follows the study rule that any lunar use counts: two 130 g nitrogen tanks filled to 30.3 MPa fed LISTER excavation on the lunar surface in March 2025. No oxygen or hydrogen product store has a reported pressure-cycle, permeation or thermal test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "hydrolox-turbine-power-plant", "path": "context/technologies/storage-and-transportation/hydrolox-turbine-power-plant.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b345fe844cd0f70f", "title": "Hydrolox turbine plant", "blurb": "A closed hydrogen-oxygen turbine loop stores and returns power. TRL 5 comes from heritage and component tests: Shuttle main engine gas generators burned hydrogen and oxygen to steam, and an oxy-fuel gas generator fired at rated power on a test stand. The closed water loop and condenser radiator have no hardware.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-space-cryogenic-transfer", "path": "context/technologies/storage-and-transportation/in-space-cryogenic-transfer.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "c2be08c432c8be43", "title": "In-space cryo transfer", "blurb": "Tank-to-tank transfer moves cryogenic propellant between tanks in space. TRL 7 rests on Starship Flight 3, where one vehicle moved liquid oxygen between two of its tanks under settling acceleration in under 100 s. Transferred mass and flow rate are published only in nondimensional form, and no vehicle-to-vehicle, repeated or post-storage transfer has flown.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "mobile-cryogenic-transport-tank", "path": "context/technologies/storage-and-transportation/mobile-cryogenic-transport-tank.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "24161ade8ef0beba", "title": "Mobile cryogenic tank", "blurb": "A mobile cryogenic tank on a haul platform would carry lunar product. TRL 6 rests on Earth operation: liquid hydrogen road tankers are in commercial use and offload to ground storage at KSC. The lunar tank exists only as a model entry and roadmap step, with no stated capacity or boil-off.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "passive-insulation-vapor-cooling", "path": "context/technologies/storage-and-transportation/passive-insulation-vapor-cooling.md", "area": "e", "areas": ["e"], "pointer": false, "author": "federico", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "bac9c244ca3618ff", "title": "Passive tank insulation", "blurb": "Foam, multilayer insulation and a vapor-cooled skirt cut heat load by 51 to 62 percent on a 4 m liquid hydrogen tank in ground thermal vacuum. TRL 6 rests on that combined ground test; multilayer insulation has flown only in orbit, on the ISS. The vapor-cooled skirt has no flight.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regenerative-fuel-cells", "path": "context/technologies/storage-and-transportation/regenerative-fuel-cells.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0b7e21e89659624a", "title": "Regenerative fuel cells", "blurb": "Solar-powered electrolysis makes hydrogen and oxygen by day, and a fuel cell recombines them for night power and water. TRL 5 rests on a NASA Glenn breadboard that ran over 550 h through three simulated day/night cycles, with PEM electrolysis heritage from the ISS. It ran open loop and has had no environmental test.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "rf-mass-gauging", "path": "context/technologies/storage-and-transportation/rf-mass-gauging.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ed4317e7eeb67152", "title": "RF mass gauging", "blurb": "An antenna inside the tank sweeps a radio signal and matches the reflected spectrum to simulated fill levels, so the liquid need not be settled. TRL 9: it gauged oxygen and methane on the IM-1 lander through landing on the Moon. No surface storage tank or flight hydrogen has been gauged.", "locked": true, "split": false, "split_by": "", "split_at": ""}, {"slug": "surface-lander-propellant-fill", "path": "context/technologies/storage-and-transportation/surface-lander-propellant-fill.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "073e7ae12e170f7e", "title": "Lander propellant fill", "blurb": "Cryogenic propellant is loaded into a landed vehicle's tanks. TRL 6 rests on a flight-qualified 216 L tank no-vent filled to 97 percent by mass in a vacuum chamber. No vehicle tank has been filled at lunar gravity or in lunar dust, and none through an autonomously mated connector or with propellant made from lunar material.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "surface-pipelines", "path": "context/technologies/storage-and-transportation/surface-pipelines.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "d218d2d079ba1c90", "title": "Surface pipelines", "blurb": "Fixed pipelines would move oxygen between lunar plants. TRL 6 follows Earth operation: field-welded vacuum-jacketed cryogenic lines serve launch pads, and a NIAC model sized a buried oxygen line of 5 to 30 km. No pipe or joint has been tested in vacuum, at lunar subsurface temperature or buried in regolith.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "water-storage", "path": "context/technologies/storage-and-transportation/water-storage.md", "area": "e", "areas": ["e"], "pointer": false, "author": "quinn", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b02398bb987384f9", "title": "Water storage", "blurb": "Tanks hold liquid water at the plant and depot. TRL 9 follows the study rule that any lunar use counts: bladder tanks stored water in every Apollo Lunar Module. Every flown store held a few hundred liters or less inside a crew vehicle, and no tank has held ISRU water through a lunar night.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-robotic-construction-platforms", "path": "context/technologies/construction-and-manufacturing/autonomous-robotic-construction-platforms.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a0647fa2c41d0543", "title": "Robotic construction", "blurb": "Robotic platforms unload payloads, fork pallets and scoop sand; a crane test-bed is sized for 1,000 kg on the Moon. TRL 3 rests on a 1 g field test in air under teleoperation plus laboratory autonomy work; fixed work-cell assembly is a level higher. No source reviewed shows terrain construction by a mobile platform under little supervision.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "basalt-fibre-and-glass-from-regolith", "path": "context/technologies/construction-and-manufacturing/basalt-fibre-and-glass-from-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "295bc6ca05599a26", "title": "Basalt fibre and glass", "blurb": "Furnaces draw continuous fibre from mare-type simulants at up to 1,438 MPa mean strength and melt simulant into glass. TRL 6 rests on industrial basalt fibre production on Earth, with lunar relevance from laboratory furnaces run on simulant. Highland simulants failed to draw or needed imported B2O3, and no fibre has been drawn in vacuum or at 1/6 g.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "binder-jet-regolith-printing", "path": "context/technologies/construction-and-manufacturing/binder-jet-regolith-printing.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "b97f54d39a3216a1", "title": "Binder-jet printing", "blurb": "Binder printing builds simulant parts, including a 1.5 tonne block on a D-Shape printer. TRL 6 rests on commercial binder jetting on Earth, with simulant printed on a commercial machine in air. No print in vacuum has data, and the one vacuum sintering condition distorted parts.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cast-and-extruded-molten-regolith", "path": "context/technologies/construction-and-manufacturing/cast-and-extruded-molten-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ce86f9daf3d84baf", "title": "Molten regolith casting", "blurb": "Simulant melted in air and cast reached 215 to 391 MPa in compression. TRL 6 rests on commercial cast basalt, melted and molded into tiles and pipe since the 1920s. Molten extrusion has no commercial basis in the sources, and no melting or casting in vacuum is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "deployable-and-spray-on-landing-surfaces", "path": "context/technologies/construction-and-manufacturing/deployable-and-spray-on-landing-surfaces.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "bb390c6415a909fc", "title": "Deployable landing pads", "blurb": "A textile blanket holds regolith in place under engine firings in air, and a spray-on pad would use alumina. TRL 3 is the blanket's level before its plume tests; the spray-on form sits a level lower. Neither form has a mass figure from hardware, and neither has a deployment test or vacuum test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "geopolymer-and-cement-regolith-concrete", "path": "context/technologies/construction-and-manufacturing/geopolymer-and-cement-regolith-concrete.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "aeff701fe356a60f", "title": "Regolith concrete", "blurb": "Cement-type and geopolymer mixes bind regolith into mortar, reaching 10,970 psi with Apollo 16 soil. TRL 6 rests on industrial concrete and concrete printing on Earth, with lunar relevance from small cubes, beams and filaments cured in laboratory air. In the one vacuum test, concrete exposed before four hours of setting lost most of its strength.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "gravel-and-rock-paved-surfaces", "path": "context/technologies/construction-and-manufacturing/gravel-and-rock-paved-surfaces.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "59c5ec82c955990a", "title": "Gravel and rock pads", "blurb": "Gravel and rock form the outer layer of a landing pad; caged anorthosite survived a small rocket plume in Earth atmosphere. TRL 3 is the level a NASA landing-pad paper gives rock piles. No source reviewed reports lunar-capable hardware that collects, sorts or lays rock.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "in-space-manufacturing-from-lunar-feedstock", "path": "context/technologies/construction-and-manufacturing/in-space-manufacturing-from-lunar-feedstock.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "baf4f58c76930840", "title": "In-space manufacturing", "blurb": "Orbital factories would build products from lunar material; the smallest sized case lands roughly 1,000 metric tons on the Moon. TRL 3 rests on heritage from filament and metal printers that made parts on the ISS; the lunar-feedstock chain has only designs and cost models. None reports hardware that has processed lunar or simulant feedstock in orbit.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "laser-sintering-and-melting-of-regolith", "path": "context/technologies/construction-and-manufacturing/laser-sintering-and-melting-of-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "dab3dcb90487139b", "title": "Laser regolith melting", "blurb": "Lasers melt simulant into paving elements about 220 mm across and bench-top domes at up to 10 g/min. TRL 6 rests on commercial laser deposition machines on Earth, one of which made dense parts from simulant. No pad or road section has been built in dirty thermal vacuum, and the sources give no system mass or electrical power.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-additive-manufacturing-of-parts", "path": "context/technologies/construction-and-manufacturing/metal-additive-manufacturing-of-parts.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "d29d0bb32fedbbbd", "title": "Metal part printing", "blurb": "Wire-fed printers make metal parts; a 300 W, 180 kg laser printer made a 316L stainless-steel specimen on the ISS. TRL 7 rests on that system prototype operating in space, and use inside a pressurized lunar module needs no surface adaptation. No source reviewed reports lunar-gravity or dust testing, or printing from regolith-derived metal.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-casting-from-regolith-derived-metals", "path": "context/technologies/construction-and-manufacturing/metal-casting-from-regolith-derived-metals.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "969d5f0a692c89ad", "title": "Metal casting", "blurb": "Casting and forming would shape metal tapped from a molten regolith electrolysis reactor. TRL 3 rests on heritage: a planned casting stage draws on a built counter-gravity withdrawal device and an operational slag and iron slicer. No source reviewed reports any part made from regolith-derived metal by casting, rolling or forming.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "microwave-sintering-of-regolith", "path": "context/technologies/construction-and-manufacturing/microwave-sintering-of-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "0fb13ebce94d0358", "title": "Microwave sintering", "blurb": "Microwave energy sinters highland simulant in vacuum into slabs as heavy as 1.4 kg, using 2.2 to 2.9 kWh/kg. TRL 5 rests on a stationary applicator making that paver in vacuum; the mobile version is a concept. The largest vacuum tile cracked, and no applicator has traversed a regolith bed.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "modular-habitat-construction", "path": "context/technologies/construction-and-manufacturing/modular-habitat-construction.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "e6a0f29faee06806", "title": "Modular habitats", "blurb": "Inflatable habitat shells passed ground tests at module scale for burst, leak before burst and vacuum deployment. TRL 3 follows the level stated for the lunar habitat fabric; the surface airlock is a level lower. No source reviewed reports deploying, joining or covering a module under lunar surface conditions.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "polymer-bound-regolith", "path": "context/technologies/construction-and-manufacturing/polymer-bound-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3a15a4fa6e8784ab", "title": "Polymer-bound regolith", "blurb": "A 175 kg gantry prints simulant bound with polylactic acid at 0.6 kg/hr in dirty thermal vacuum. TRL 6 rests on commercial pellet-fed extrusion on industrial robots, one of which printed a meter-scale part from mostly ISRU-derived feedstock. The binder is launched mass, and no flight print system has a stated mass or power.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "polymer-printing-and-recycling", "path": "context/technologies/construction-and-manufacturing/polymer-printing-and-recycling.md", "area": "f", "areas": ["f", "g"], "pointer": false, "author": "shaun", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7bcf19e9aac84e88", "title": "Polymer printing", "blurb": "Filament printers made 55 ABS parts and over 100 further parts on the ISS. TRL 9 rests on the printer's mission operations making parts for customers inside the ISS cabin; the recycler flew with no recycling result reported. No source reviewed reports a local source of polymer on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regolith-cover-radiation-shielding", "path": "context/technologies/construction-and-manufacturing/regolith-cover-radiation-shielding.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "model", "status": "fact-checked", "source_hash": "45f1723a00cfeb97", "title": "Regolith radiation cover", "blurb": "A regolith cover of 3 m to 7 m shelters crews; tens of g/cm2 stop solar particle events. TRL 3 rests on analysis and beam tests on soil samples; the only built article is a hand-filled fabric bag with no regolith fill. No source reports a machine placing regolith or simulant over a structure.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "regolith-grading-compaction-and-berms", "path": "context/technologies/construction-and-manufacturing/regolith-grading-compaction-and-berms.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "561f4b43a3280d76", "title": "Grading and compaction", "blurb": "Rover blades grade regolith and build berms; a 4.1 m blade graded 25 m x 25 m and built a 1.3 m berm in natural sand. TRL 6 rests on commercial dozer blades and compactors on Earth, with a plate compactor run in vacuum and grading in a lunar test bed. Grading and berms have no vacuum or low-gravity result.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "robotic-assembly-of-modular-truss-structures", "path": "context/technologies/construction-and-manufacturing/robotic-assembly-of-modular-truss-structures.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3c2fc165cb8ee7dc", "title": "Robotic truss assembly", "blurb": "Robots assemble truss structures: a 256-cell lattice shelter and a five-bay 4.5 m tower section. TRL 4 is stated by the authors of the tower demonstration. Both builds ran in air at 1 g with hand-placed parts, and no source reports a test in vacuum, dust or reduced gravity.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "sintered-pavers-and-bricks", "path": "context/technologies/construction-and-manufacturing/sintered-pavers-and-bricks.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ff2f5a7af746811a", "title": "Sintered pavers", "blurb": "Kiln-sintered basalt pavers were placed by a tele-operated rover and survived rocket exhaust on Earth with little to no erosion. TRL 6 rests on commercial kiln-fired clay brick, with highland simulant also sintered in a vacuum furnace. No full-size paver has been fired in vacuum, and lunar oven mass and energy come from a model.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solar-cell-fabrication-from-regolith", "path": "context/technologies/construction-and-manufacturing/solar-cell-fabrication-from-regolith.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 3, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "3543ebb5f7c8a81b", "title": "Regolith solar cells", "blurb": "Glass substrates melted from lunar simulant carry perovskite cells that reached 12.1% under AM0, with the absorber imported. TRL 3 rests on substrate melting, film evaporation and small cells shown separately in terrestrial laboratories. Silicon diodes on simulant glass gave no light response.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "solar-concentrator-sintering", "path": "context/technologies/construction-and-manufacturing/solar-concentrator-sintering.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "72a8e769fc0b949a", "title": "Solar sintering", "blurb": "Concentrated light sinters JSC-1 and JSC-2A simulant in air to a depth of about 6 mm. TRL 4 rests on laboratory and field hardware with simulant in air. The one element printed in vacuum disintegrated; the sole system mass on record is a concept estimate of 18 t for a 20 m mirror.", "locked": false, "split": false, "sp
