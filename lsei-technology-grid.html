lit_by": "", "split_at": ""}, {"slug": "sulfur-concrete", "path": "context/technologies/construction-and-manufacturing/sulfur-concrete.md", "area": "f", "areas": ["f"], "pointer": false, "author": "shaun", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "ae1b3db92484fcca", "title": "Sulfur concrete", "blurb": "Sulfur concrete cast with JSC-1 simulant reached about 35 MPa in compression. TRL 6 rests on sulfur concrete as a commercial construction material, with small simulant samples tested in air, vacuum and liquid nitrogen. Sulfur escaped continuously in vacuum at 20 C, and the sulfur supply is only a paper estimate.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "autonomous-maintenance-of-isru-hardware", "path": "context/technologies/recycling-and-waste-management/autonomous-maintenance-of-isru-hardware.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "draft", "source_hash": "247a59fd155b278c", "title": "Autonomous maintenance", "blurb": "Robots would inspect, swap and repair ISRU and excavation hardware. TRL 4 rests on orbital robotic heritage and a spares calculation with a quarter-scale printed model. No source reviewed reports a robot servicing regolith-handling equipment.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "bioregenerative-life-support", "path": "context/technologies/recycling-and-waste-management/bioregenerative-life-support.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "37086a7a7b56fda3", "title": "Biological life support", "blurb": "Bioregenerative life support recycles oxygen and water through plants and microbes for a crew. TRL 7 rests on flown crop chambers: Svet on Mir, Lada and the Biomass Production System on the ISS. Crew-scale closure is ground only (Bios-3, MELiSSA), and none of the 6 sources reviewed reports a lunar test.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "crew-solid-waste-and-trash-processing", "path": "context/technologies/recycling-and-waste-management/crew-solid-waste-and-trash-processing.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 7, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "54b7a6fffe2ef55f", "title": "Crew waste processing", "blurb": "Toilets and trash reactors process crew solid waste; the OSCAR reactor burned simulated crew waste in two suborbital flights. TRL 7 rests on the UWMS toilet's limited checkout on the ISS in October-November 2021. That demonstration is incomplete, the unit is in stand-down, and none of the 7 sources reviewed reports operation on the Moon.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "end-of-life-hardware-dismantling-and-reuse", "path": "context/technologies/recycling-and-waste-management/end-of-life-hardware-dismantling-and-reuse.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "fe712d66197fa046", "title": "Dismantling and reuse", "blurb": "A centrifugal mill size-reduces space-grade cable for recycling. TRL 4 rests on one laboratory mill test of 22 AWG cable with its product measured. No vacuum, dust or lunar-temperature test is reported, and dismantling has no hardware result.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "habitat-atmosphere-and-oxygen-loop-closure", "path": "context/technologies/recycling-and-waste-management/habitat-atmosphere-and-oxygen-loop-closure.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 9, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7e7b37b58d8518b2", "title": "Habitat oxygen loop", "blurb": "The ISS runs oxygen generation, CO2 removal and Sabatier reduction as a loop. TRL 9 rests on orbital use under the study rule; the Oxygen Generation Assembly made 14,598 kg of oxygen since 2007. Oxygen closure is limited to about 50% with methane vented, and no CO2 reduction system operates after the 2024 cancellation of Sabatier 2.0.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "habitat-water-recovery-systems", "path": "context/technologies/recycling-and-waste-management/habitat-water-recovery-systems.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 9, "evidence_level": "demonstrated hardware", "status": "draft", "source_hash": "1d03dca5af0fc8c9", "title": "Habitat water recovery", "blurb": "Habitat water recovery reclaims urine and wastewater. TRL 9 rests on orbital use under the study rule: the ISS Urine and Water Processor Assemblies have run since November 2008, with US urine recovery at 87%. The evidence is orbital plus a ground testbed, with no lunar-surface operation reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "industrial-ecology-closed-loop-feedstock-reuse", "path": "context/technologies/recycling-and-waste-management/industrial-ecology-closed-loop-feedstock-reuse.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "a84d858df87afc3c", "title": "Feedstock reuse loop", "blurb": "A closed loop would turn lunar plant waste back into feedstock. TRL 4 rests on modelled gas recirculation loops inside a plant design, with FFC runs on regolith simulant as one front-end processor. The waste-to-feedstock loop is reported unbuilt and untested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "spent-salt-slag-and-electrode-management", "path": "context/technologies/recycling-and-waste-management/spent-salt-slag-and-electrode-management.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "07802705c221d227", "title": "Spent salt and slag", "blurb": "Equipment would handle spent molten salt, slag and used electrodes after they leave the reactor. TRL 4 rests on mass-balance models of the slag, metal and emission streams. None of the nine sources reviewed reports tested storage, regeneration or stacking hardware; in-reactor slag removal is area (c).", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "tailings-and-spent-regolith-handling", "path": "context/technologies/recycling-and-waste-management/tailings-and-spent-regolith-handling.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 6, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "f16f0c8437a01e70", "title": "Tailings handling", "blurb": "Conveyors, hoppers and vehicles move spent regolith to a tailings pile. TRL 6 rests on terrestrial tailings containment, an industrial practice under a global standard since 2020, with IPEx actuators run through dig-and-dump tests in vacuum. No pile or containment test of spent regolith is reported, and tailings mass exceeds product mass by about 16.5 to 87 times.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "waste-gas-and-volatile-byproduct-capture", "path": "context/technologies/recycling-and-waste-management/waste-gas-and-volatile-byproduct-capture.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "6b4220cca257020e", "title": "Waste gas capture", "blurb": "Sorbent beds would capture sulfur, hydrogen, helium and carbon-bearing gases released by heating regolith. TRL 4 rests on analysis: sulfur yield estimates, vacuum heating of Apollo samples and an untested lunar-soil sorbent bed concept. No capture article has been tested on gas from heated lunar soil.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "waste-sorting-classification-and-tracking", "path": "context/technologies/recycling-and-waste-management/waste-sorting-classification-and-tracking.md", "area": "g", "areas": ["g"], "pointer": false, "author": "wintta", "trl": 3, "evidence_level": "concept", "status": "fact-checked", "source_hash": "64a49636a860364f", "title": "Waste sorting", "blurb": "A three-axis classification scheme would sort and track lunar waste. TRL 3 rests on a two-measurement soil classification tested against Apollo 17 samples, which got 48% right for both measures. No sorting or tracking article is reported built or tested.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "asteroid-and-beyond-lunar-resource-economics", "path": "context/technologies/strategic-downstream-products-architecture/asteroid-and-beyond-lunar-resource-economics.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "5f999c13d11f6d52", "title": "Asteroid economics", "blurb": "Profit models price asteroid water and platinum and estimate breakeven time from assumed spacecraft, cost and market inputs. TRL 6 rests on techno-economic feasibility studies, standard practice for financing terrestrial mines, applied by the Hein model to asteroid resources. No model is checked against an operating space-mining venture, and lunar-surface distribution is unmodeled.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "carbothermal-methane-propellant-architecture", "path": "context/technologies/strategic-downstream-products-architecture/carbothermal-methane-propellant-architecture.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "4f565f8ec8da59fc", "title": "Carbothermal propellant", "blurb": "The architecture would make LOX and methane from lunar resources and fix plant size and delivery. TRL 4 rests on a lunar spreadsheet sizing case, a Mars plant model and an unvalidated reactor kinetics model. No source names a lunar supply of the carbon that methane needs.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "cislunar-propellant-supply-architecture", "path": "context/technologies/strategic-downstream-products-architecture/cislunar-propellant-supply-architecture.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "d9572c1248c91d82", "title": "Cislunar propellant supply", "blurb": "The architecture would supply lunar LOX/LH2 to cislunar customers. TRL 4 is the study's starting level for work that exists only as models; the cost models and studies reviewed report no hardware result. Its economic case rests on assumed plant performance, plant lifetime and campaign size.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "fission-power-coupled-isru-plant", "path": "context/technologies/strategic-downstream-products-architecture/fission-power-coupled-isru-plant.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "9da164a3557935cb", "title": "Fission-powered ISRU plant", "blurb": "A fission reactor would power an ISRU plant, setting its power budget, siting and heat rejection. TRL 4 rests on a 40 kWe point design built from heritage components, which came in at 10 t against a 6 t goal. No coupled hardware or matched plant load is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "isru-commercial-demand-and-business-case-models", "path": "context/technologies/strategic-downstream-products-architecture/isru-commercial-demand-and-business-case-models.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "c9b5ca62c5f7abdc", "title": "ISRU business cases", "blurb": "Economic models estimate demand, price, required return and breakeven for lunar resource products. TRL 6 rests on discounted cash flow as the standard financial gate for terrestrial mining, applied to lunar products with a hurdle rate near 25 percent. None is checked against an operating plant, and customer agreements carry no contract value.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "isru-pilot-plant-system-architectures", "path": "context/technologies/strategic-downstream-products-architecture/isru-pilot-plant-system-architectures.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "1fa99ac3e096d93c", "title": "Pilot plant designs", "blurb": "Pilot-plant architectures size whole plants for lunar oxygen and water. TRL 4 is the study rule's starting level for model-only work; four sources reviewed size plants by analysis with no plant-level test. No integrated plant has been tested, and two studies leave power assumptions unresolved.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "isru-precursor-and-demonstration-mission-architecture", "path": "context/technologies/strategic-downstream-products-architecture/isru-precursor-and-demonstration-mission-architecture.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 3, "evidence_level": "concept", "status": "fact-checked", "source_hash": "2f3271b531e2fbe2", "title": "ISRU precursor missions", "blurb": "The architecture orders precursor and demonstration flights so each ISRU function is proven at kilogram scale before a pilot plant. TRL 3 rests on a concept, on hold at early design, that lists flown MSolo only as a potential payload. No ISRU process function has flown, and later steps are manifest entries or concepts on hold.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "launch-and-lander-propellant-interoperability", "path": "context/technologies/strategic-downstream-products-architecture/launch-and-lander-propellant-interoperability.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 2, "evidence_level": "concept", "status": "fact-checked", "source_hash": "e627782e51620c86", "title": "Lander interoperability", "blurb": "This layer would set the interfaces and fill conditions that let lunar propellant load landers from several providers. TRL 2 rests on a proposed surface docking standard and one feasibility study citing 200 t per year of lunar-orbit demand. No connector or fill specification exists, and no cryogenic transfer has flown.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "lunar-energy-export-and-space-solar-power", "path": "context/technologies/strategic-downstream-products-architecture/lunar-energy-export-and-space-solar-power.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "c5cc4013cf8b7ff7", "title": "Lunar energy export", "blurb": "Solar power satellites built at L5 from mass-driver-launched lunar material would beam power to Earth. TRL 4 rests on one financial model that shows faster payback than Earth-launched satellites, using 1970s NASA technology parameters. No hardware is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "mars-and-beyond-moon-isru-propellant-architecture", "path": "context/technologies/strategic-downstream-products-architecture/mars-and-beyond-moon-isru-propellant-architecture.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "4b50cae7d7efca1f", "title": "Mars-ascent propellant", "blurb": "A Mars plant would turn atmospheric CO2 and regolith water into oxygen and methane for an ascent vehicle. TRL 5: MOXIE made oxygen on Mars in 16 runs, but the plant adds methane synthesis, liquefaction and storage as an unqualified system. The full ascent plant is a 1.7 t, 52 kW spreadsheet model.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-air-batteries", "path": "context/technologies/strategic-downstream-products-architecture/metal-air-batteries.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 1, "evidence_level": "concept", "status": "fact-checked", "source_hash": "7b993591fabf1359", "title": "Metal-air batteries", "blurb": "A metal-air battery pairs a metal anode with oxygen reduction to store and release electricity. TRL 1 rests on documentation alone: a terrestrial assessment citing low power density and a zinc-air cell named in a lunar power review. No cell made from regolith-derived metal is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-fuel-combustion-energy-storage", "path": "context/technologies/strategic-downstream-products-architecture/metal-fuel-combustion-energy-storage.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "7c5b239755ec883f", "title": "Metal-fuel energy storage", "blurb": "Burning metal fuel stores heat for the lunar night. TRL 4 rests on the ACME vacuum breadboard igniting thermite on simulants, with propagation partial and heat output unmeasured. No measured energy density, efficiency or lunar-night heat output is reported for a regolith-derived fuel.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-fuel-heaters-and-burners", "path": "context/technologies/strategic-downstream-products-architecture/metal-fuel-heaters-and-burners.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "50ca8c668c7e737e", "title": "Metal-fuel heaters", "blurb": "Metal powder reacted as thermite or burned in oxygen would heat landers, rovers and habitats through the lunar night. TRL 4 rests on the ACME breadboard igniting simulant and aluminium mixtures in vacuum, with partial propagation. Delivered heat, heater mass and lunar burner tests are not reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-fuel-regeneration-loop", "path": "context/technologies/strategic-downstream-products-architecture/metal-fuel-regeneration-loop.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "19a43e347f885b3b", "title": "Metal-fuel regeneration", "blurb": "The loop reduces burned metal oxide back to powder with hydrogen so the same metal is burned again. TRL 4 rests on laboratory reduction of commercial iron oxide powders and a cycle model giving 27 percent power-to-power efficiency. No closed loop, regolith feed or lunar-condition test is reported.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-powder-preparation-storage-and-handling", "path": "context/technologies/strategic-downstream-products-architecture/metal-powder-preparation-storage-and-handling.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 5, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "26d9d09bea1cd191", "title": "Metal powder handling", "blurb": "This technology produces, conditions, stores and feeds metal-fuel powder to a combustor or engine. TRL 5 rests on an iron-powder feeder that ran on two sounding rockets in microgravity, with four iron powders explosion-tested on the ground. Regolith-derived alloy powder handling is still a concept.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metal-propellant-electric-propulsion", "path": "context/technologies/strategic-downstream-products-architecture/metal-propellant-electric-propulsion.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 1, "evidence_level": "concept", "status": "fact-checked", "source_hash": "496b876aef806637", "title": "Metal electric propulsion", "blurb": "Magnesium extracted from regolith would fuel a Hall-effect thruster in place of xenon or krypton. TRL 1 rests on two 2026 project descriptions of a running ESA-funded study. No extraction yield or thruster result is reported yet.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "metallic-propellant-from-regolith", "path": "context/technologies/strategic-downstream-products-architecture/metallic-propellant-from-regolith.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "demonstrated hardware", "status": "fact-checked", "source_hash": "890f2619b91662d9", "title": "Regolith metal propellant", "blurb": "Metal fuels made from regolith would burn as rocket propellant. TRL 4 rests on a bench hybrid motor that burned aluminium foil with gaseous oxygen and gave a measured thrust. No source reports an engine test or a measured specific impulse for a regolith-derived metal fuel.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "modular-scalable-isru-plant-design", "path": "context/technologies/strategic-downstream-products-architecture/modular-scalable-isru-plant-design.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 4, "evidence_level": "model", "status": "fact-checked", "source_hash": "e2b4859f5afd362c", "title": "Modular ISRU plants", "blurb": "Modular design would grow an ISRU plant from pilot to full production through add-on units and reconfiguration. TRL 4 rests on parametric plant sizing, a two-element pilot design point and a sandbox-tested modular excavation robot. No source sizes add-on units or a modularity penalty.", "locked": false, "split": false, "split_by": "", "split_at": ""}, {"slug": "multi-commodity-resource-logistics", "path": "context/technologies/strategic-downstream-products-architecture/multi-commodity-resource-logistics.md", "area": "h", "areas": ["h"], "pointer": false, "author": "wintta", "trl": 6, "evidence_level": "model", "status": "fact-checked", "source_hash": "220260e430740016", "title": "Resource logistics models", "blurb": "Network-flow models route oxygen, water, hydrogen and byproducts between lunar plants, depots and users to minimise launch mass or cost. TRL 6 rests on commercial optimisation-solver planning of mining supply chains, in use since 2015. No lunar model is checked against measured plant output.", "locked": false, "split": false, "split_by": "", "split_at": ""}]};
</script>

, "header": "Canada out of 12"}, {"cell": "M", "header": "Evidence and sources: the numbers behind each score"}, {"cell": "N", "header": "Second reader check"}], "format": 1, "notes": [{"source": "Team_Kickoff_2026-11.pptx slide 9 notes", "text": "Scale: compare every option at pilot scale, the Pilot column of the integrated scenario (50 kW of ISRU power, at least 10 t O2 and 15 t H2O a year), as totals for all units."}, {"source": "Team_Kickoff_2026-11.pptx slide 9 notes", "text": "Needing fission scores Power 1, and needing crew working on it on site, Gateway or a buyer before 2045 scores Risk C5 1."}], "pass_mark": {"cell": "Read me!B23", "side_max": 12, "side_min": 6, "text": "Each side needs 6 of 12. Below 6 on engineering or on Canada takes the technology out.", "total_max": 24}, "scale": [{"cell": "Read me!B20", "text": "Substantially better than the alternatives in the area", "v": 3}, {"cell": "Read me!B21", "text": "Adequate; the alternatives are not clearly better", "v": 2}, {"cell": "Read me!B22", "text": "Poor against the alternatives", "v": 1}], "source": "context/study/ranking_matrix/Ranking_Matrix_2026-11-17.xlsx", "source_sha256": "e0afd9881d08b6e38fc27ce4f301424d3220aab0c5bf5fcc48d85f4f049e58f0"}, "evidence": {"active-cooling-zero-boil-off": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 7 (RRM3 held liquid methane with no vent on the ISS for about 4 months; hydrogen zero boil-off ran only on the ground). Built: RRM3 cryocooler, 42 L methane, 165 days no venting to the burst-disk vent on 11 April 2019. 125 m3 ground LH2 tank at zero boil-off over 13 months. Vacuum-chamber LH2 boil-off cut 48% and 45% (not zero). Creare 20 K cooler 24.4 W at 21 K in a ground bell jar. Mass: 106.3 kg flight-like Creare 20 K cooler estimate, 336.9 kg as tested; no held mass for RRM3 or the 125 m3 refrigerator. Power: 145 W compressor input at zero boil-off for the 1.37 m3 LN2 tank; about 1.76 kW calculated for the Creare 20 K cooler; 125 m3 refrigerator ity of Guelph hypobaric chambers from the late 1990s (Wheeler 2017); CSA grant $291,001 to Guelph 2026 to 2029 (A); Canadensys lunar agriculture module (A); Growcer and Naurvik Nunavut unit up to $745,000 (A). Limit: terrestrial tests only; animal products from outside, microbial community never stable. Card: G11 (fact-check pass 4)."}, "bucket-drum-excavator": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is the counter-rotating bucket-drum excavator of the lunar water pilot plant design, 66 kg and 174 W average, 215 W while digging (COMPASS 2020) [linne-2020-lunar-water-pilot-plant]. IPEx actuators passed vacuum life tests at TRL 5; the wheel actuator ran 6,547,036 revolutions against 5.7 million, then its motor rotor bearing failed (2025) [clark-2025-ipex-trl5-actuators]. NASA states IPEx moved 10 t in 5 days in a simulated mission (2025) [sanders-2025-nasa-isru-progress-review]. Bucket-wheel excavators are terrestrial mining machines (2023) [lohsandt-2023-bucket-wheel-icy-regolith]. A Canadian workshop participant knew of no Canadian lunar excavation developer beyond concept stage (2026) [lsei-2026-workshop-2-breakout-2-excavators]."}, "carbothermal-methane-propellant-architecture": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rule 6 model-only). Built: no lunar methane hardware; the 2010 Dust to Thrust field chain at Mauna Kea has no methane or propellant output in the summary. Mass: Mars ascent CH4 and O2 plant 1,700 kg at 1.3 wt% water regolith, about 1,560 kg at 8 wt% (Kleinhenz); methane liquefaction for 10 t of oxygen needs 8 cryocoolers and 0.065 t, hydrogen needs 22 and 2.34 t (Paz, sizing case); all model. Power: 52 kW (1.3 wt%) and 38 kW (8 wt%) for the Mars plant (model); no carbothermal reactor mass or power held. Canada: Canadian Space Agency supplied the excavator and NORCAT (Sudbury, ON) the solar concentrator and sintered pad with Physical Sciences Inc. in the 2010 chain (Paz); NORCAT's mine test facility has no TRL or funding stated (S); no Canadian carbothermal or methane-production firm found. Limit: the lunar carbon source is not established in any cited summary (Paz lists 2.08 t carbon with no source; Balasubramaniam has carbon arriving from Earth as methane); reactor rate constants are unvalidated; carbothermal reduction itself is a (c) card. Card: H20 (fact-check pass 1)."}, "carbothermal-reduction": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is a solar-heated carbothermal oxygen system of the Compass 2019 class, 927 kg ISRU-only hardware including a 498 kg solar array (429 kg without it, derived) and 11.8 kW electrical plus 33.3 kW solar-thermal heat for 10 t O2 in 225 days [kleinhenz-2020-polar-water-case-studies]. Sierra Space's COPR ran four laser-heated tests on GreenSpar 250 in the NASA JSC B351 thermal-vacuum chamber in 2024, and its authors state TRL 6; no per-test oxygen yield is reported [haggerty-2025-environmental-testing-carbothermal-reactor]. The CaRD solar prototype extracted 0.51 g of oxygen as CO per kWh of solar energy at the primary mirror, at ambient in 2025 [paz-2026-solar-carbothermal-oxygen-regolith]. Rio Tinto Iron and Titanium reduces ilmenite with coal in its Sorel-Tracy furnaces and sells titanium slags, pig iron and steel (company page) [riotinto-nd-fer-et-titane-quebec-operations]. ESA financed a PoliMi carbothermal demo plant, up to 12 % yield in feedstock mass [lavagna-2023-solid-gas-carbothermal-reduction-water]."}, "cast-and-extruded-molten-regolith": {"at": "2026-11-23T09:22:41.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, cast basalt is in commercial production on Earth). Built: melted JSC-1A samples 215 to 391 MPa compressive (air, four samples); cast Apollo 14 composition glass-ceramic 315 MPa flexure; molten extrusion did not complete the NASA down-select. Mass: concept furnace 3 t for 6 t of cast basalt per day (1991 design estimate, no hardware). Power: same concept 100 kW; 0.633 kWh/kg to reach 1600 C (calculated). Canada: none found. Limit: no melt or cast in vacuum; extruded-article properties not published. Card: F08 (fact-checked)."}, "cislunar-propellant-supply-architecture": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rule 6; rule 1 TRL 2 reading also supportable). Built: no supply hardware; ISS Robotic Refueling Mission 3 held methane at zero boil-off for four months, then venting expelled it before any transfer. Mass: plant specific mass 109 kg per t/yr baseline, needs under 50 for competitiveness (Jones 2019, model); 24,916 t/yr of water for weekly shuttle flights (Borowski). Power: ISRU specific power 48 kW per tonne, needs under 20; 2.8 MW for the Kornuta architecture; 10.4 MWe electrolysis (Borowski). Cost: $78,000/kg lunar against $40,000/kg Earth delivery, lunar 97% dearer. Canada: none on the card; Launch Canada Rocketry turbopump grant $325,623, \"lunar transport\" as a stated use (A); no Canadian cryogenic or depot firm with a space link found. Limit: all cost models; no NASA-ESA depot interface standard in any source, so the planning wording is unsupported. Card: H2 (fact-check pass 4)."}, "cold-tolerant-actuators": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is the IPEx-class wheel drive actuator, 0.85 kg and 25 W at 30 cm/s, which ran -35 to 45 C in vacuum; the excavation actuator stalled at -50 C (2025) [clark-2025-ipex-trl5-actuators]. VIPER mobility actuators, built from COTS motors and gear sets, met TRL 8 criteria in September 2024 after dynamometer-loaded thermal-vacuum qualification (2025) [francis-2025-viper-mobility-actuators]. An ESA-contract doped MoS2 bearing film showed no torque effect from -60 to +80 C (2025) [buttery-2025-next-generation-solid-lubricants]. COM DEV of Ottawa built the NIRISS gearmotors for the CSA Fine Guidance Sensor, accepted after eight cycles to 35 K (2015) [aldridge-2015-niriss-cryogenic-motor]."}, "conveyors-belt-screw-trough": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "Pilot configuration is an enclosed inclined auger of the ROxygen I class, which lifted 8 kg of Mauna Kea tephra about 2 m in 408 s (70.6 kg/h) at 1 g in November 2008; no auger mass is held [townsend-2010-regolith-feed-systems-mauna-kea], TRL 6 (Quinn ruling, 2026-11-23: rule 9, belt and screw conveyors are routine terrestrial mining hardware). A DEM simulation of a 19 mm screw gave about 2.7-5.5 W per metre of lift at 20-52 kg/h at 1 g, with lunar power about six times lower (2014) [walton-2014-flexible-conveying-regolith-microgravity]. Stapled joints caused 46.48% of 256 faults on nine coal-mine conveyors [tomus-2016-belt-conveyor-reliability]. Nordstrong of Cannington, Ontario, makes belt and screw conveyors for mining (profile retrieved 2026-11-18) [nordstrong-2026-bulk-handling-conveyors]."}, "deployable-and-spray-on-landing-surfaces": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 3 for the textile mat (stated), 2 for spray-on (assigned). Built: carbon and silica fibre blanket over simulant took six 444 N engine tests in air; later prototypes did not burn through. Spray-on (Masten FAST): analysis only, 186 kg alumina released in 10 s for a 6 m pad; no deposition test. Mass: mat areal mass not stated. Power: none. Canada: none found. Limit: no deployment or vacuum test. Card: F13 (fact-checked)."}, "downhole-instrumented-drill-strings": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a 1 m rotary-percussive drill of the TRIDENT class, 26.5 kg and 50 W nominal rotary power, flown on PRIME-1 in March 2025 with no penetration because the lander lay on its side (2025 paper) [zacny-2025-trident-ice-mining-drill]; its actuators are rated 200 W each (2024 abstract) [glass-2024-trident-analog-field-validation]. It carries a 0.517 kg, 2.25 W CRUX borehole neutron probe prototype [elphic-2006-crux-borehole-neutron-probe]. At Haughton n on a vacuum dynamometer from -35 to 45 C with a dust cup (2025) [clark-2025-ipex-trl5-actuators]. No IPEx wheel mass is held; a Concordia lunar rover wheel weighed 2.85 kg in metal, with a composite target below 0.5 kg (2024) [burg-2024-peekbot-composite-wheels]. Yutu-2 wheels ran on the Moon [luna-2024-emrs-breadboard-field-test], TRL 9. A 1 g test over-predicted 1/6 g drawbar pull by 44% (2022) [daca-2022-cone-index-reduced-gravity]. NORCAT built a CSA-funded load-haul-dump prototype tested in Canada and Hawaii [mueller-2023-extraterrestrial-excavation-review]."}, "fission-power-coupled-isru-plant": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rules 6 and 2). Built: no coupled plant and no ISRU load tested on a fission system. NASA has spent over $200M since 2000 on FSP from 1 to 200 kWe with \"no significant advancement towards flight system readiness\" (nasa-2025-fission-surface-power-directive). Oleson 2022 is a conceptual point design with no hardware. Mass: 10,046 kg for the three-element 40 kWe system against a 6,000 kg goal (model, oleson-2022). Power: 40 kWe from about 250 kWth, 18.1% thermal-to-electric (model, oleson-2022); directive floor 100 kWe, 15 t lander allocation, launch readiness Q1 FY30, closed Brayton cycle; weekly polar shuttle flights need about 10.4 MWe of surface electrolysis, electrolysis only, and 1.5 to 2 MWe per 1,000 t/yr LUNOX plant (slide values, borowski-2019). Siting and thermal: reactor 1 km from crew by cable; 133.4 m2 radiator at the pole, 216.2 m2 at the equator (model, oleson-2022). Canada: none found for fission-coupled ISRU; CSA awarded MDA C$500,000 in December 2023 for plant-management tools for a lunar nuclear power system (A). Limit: no source couples a plant load to a reactor; the 100 kWe floor is asserted, not derived; no reactor mass in Borowski. Card: H12 (fact-check pass 1)."}, "gamma-ray-spectrometry": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a rover pulsed-neutron gamma-ray instrument of the PNG-GRAND class, tested on assayed granite and basalt monuments at a Goddard field site; neither the 2011 nor the 2013 paper gives mass or power [parsons-2011-active-neutron-gamma-instrumentation, parsons-2013-ping-subsurface-composition]. Flight units would use scintillators because HPGe cryogenics are too bulky [parsons-2013-ping-subsurface-composition]. The NASA EmberCore Flashlight concept would replace the generator with a passive radioisotope X- and gamma-ray source read from kilometres away (NIAC Phase I, 2023) [morrison-2023-embercore-flashlight-niac]. Orbital heritage is the Kaguya GRS, 2,674 h in 2007-2008 [yamashita-2010-uranium-moon-global-distribution]. Radiation Solutions of Mississauga manufactures gamma spectrometer systems (2016 manual) [radiation-solutions-2016-rs-700-manual]."}, "geopolymer-and-cement-regolith-concrete": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, concrete and concrete printing are in industrial use on Earth). Built: DNA-1 geopolymer cubes 13 to 32 MPa, cured in air; Apollo 16 soil mortar 10,970 psi; concrete exposed to vacuum before 4 h of setting loses most of its strength. Mass: terrestrial cement printer delivery system 4,990 kg empty; no lunar plant mass. Power: none stated. Canada: Horizon Legacy robotic concrete printing with ABB Robotics, 26 townhouses (terrestrial; mix not described). Limit: needs water and binder chemicals; untested in vacuum. Card: F12 (fact-checked)."}, "gravel-and-rock-paved-surfaces": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 3 (stated). Built: caged anorthosite rock took two 444 N engine firings in air, spalling only; no rock raking, sorting or laying hardware test. Mass: 1.6 t from Earth for an outer pad, 12 to 27 m radius; rake rover 1,000 kg, laying rover 600 kg (model). Power: 0.81 MWh, 35.4 days; rake 982 W (model). Boulder blast wall analysis: 250 m3, 1,520 h of collection. Canada: terrestrial analogue only, Inuvik to Tuktoyaktuk Highway. Limit: all figures are model outputs. Card: F03 (fact-checked)."}, "gravity-fed-hopper-flow": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a vibrated hopper with rotary-pocket feeder, about 1.0 kg, delivering up to 0.8 g/s; eight assemblies fed in 330 of 330 vibration-on runs at 0.16 g and 27-60 Pa in May 2025, and flow stopped in 80 of 84 vibration-off runs (2026) [stepanova-2026-vibration-regolith-feed], TRL 6. No power is held for the tested vibrator or feeder. ESA supported the 2012 JEPPF-2 hopper flights [reiss-2014-hopper-flowability-reduced-gravity-vacuum]. Vibrotech of Plessisville, Quebec, makes vibratory feeders and hoppers for mines and quarries (company page, retrieved 2026-11-18) [vibrotech-2026-vibratory-bulk-handling]."}, "ground-penetrating-radar": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a rover FMCW radar of the RIMFAX class, flight model for Perseverance (2020 paper): 3.455 kg, under 5 W average and 10.2 W worst case [hamran-2020-rimfax-instrument]. The Chang'e-4 rover radar imaged layering to 40 m on the farside (2020 paper) [li-2020-change4-lpr-farside-subsurface]. A commercial GSSI radar mapped massive ice up to 4.4 m thick at Askja, but ice-rich and ice-free sites showed overlapping loss rates [shoemaker-2024-askja-gpr-buried-ice-isru-testbed]. Sensors & Software of Mississauga designs and manufactures GPR for mining, glaciology and utility markets (company page retrieved 2026-11-18) [sensors-software-nd-gpr-company-page]."}, "habitat-atmosphere-and-oxygen-loop-closure": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 9 (assigned, orbital limit, rules 5 and 8). Built: ISS oxygen generator, CO2 remover and Sabatier; the generator runs up to 46.9 A (9.25 kg/day O2) and has made 14,598 kg O2 since 2007; closure about 50%; Sabatier 2.0 cancelled in 2024, leaving no operating CO2 reduction; plasma pyrolysis of methane has ground and zero-g flight-fixture tests only. Mass: hydrogen unit about 136 kg; the 50 modelled units about 1,377 kg; end-of-mission waste 553 kg methane (Sabatier), 378 kg carbon (Bosch), 790 kg CO (RWGS), all model. Power: oxygen generator and CO2 remover power not in any cited summary. Canada: none found for oxygen generation, CO2 removal or reduction. Limit: ISS only; closure above 50% needs hydrogen recovery or Bosch, which has no flight heritage. Card: G10 (fact-check pass 4, final re-read)."}, "habitat-water-recovery-systems": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 9 (assigned, orbital limit, rule 5). Built: ISS urine and water processors since 14 November 2008; US urine recovery 87%, total 98+% with the brine processor; February 2024 to 2026 the processor made 17,900 L of product water and 8,907 L of distillate; ground bladder tests fell from 95.4% to 66% recovery as a bladder was reused. Mass: spares for 50 ISS life-support units over 1,200 days 14,335 kg on initial failure rates, 9,748 kg on current ones (model); crew load 3.77 kg wastewater per person-day on ISS. Power: not stated on the card. Canada: Aqualunar grand prize $400,000 to CSMC for LunaPure, ice purification, not habitat recycling (V); Canadensys disinfection $449,998 (A); Polytechnique Montréal and McGill atmospheric water capture (A); no Canadian urine, brine or humidity work found. Limit: ISS only, no lunar-surface operation; component failures and spares demand. Card: G9 (fact-check pass 4)."}, "haul-truck-and-conventional-excavation": {"at": "2026-11-20T21:56:01.464Z", "by": "quinn", "v": "Pilot configuration is an excavate-haul-dump vehicle of the Polaris class, 200 kg and 470 W, which delivered 1,040 kg of GRC-1 in 58 min at 1 g in the NASA Glenn SLOPE lab (2016) [skonieczny-2016-continuous-excavation, just-2020-regolith-excavation-review]. A Concordia test wheel ran at true 1/6 g in parabolic flight (2022) [daca-2022-cone-index-reduced-gravity] sion 1; Earth-supplied nitrogen, no oxygen or hydrogen product store tested). Built: LISTER's two 130 g nitrogen tanks at 30.3 MPa, no significant pressure drop in transit, regulated flow about 12 to 15 SLPM, landed 2 March 2025, mission ended 16 March 2025. NORS oxygen tank at 41.4 MPa, design only, no test results. Mass: 55.5 kg empty for the NORS tank; no kg figure held for the LISTER tanks; 0.26 kg of nitrogen in them. Power: 12 W steady for the vessel with valve, sensors and controller (bottom-up estimate, range 3 to 30 W; vessel and regulator passive, 0 W); NORS heater about 1.3 kW peak, not a lunar load. Canada: Luxfer (Calgary, AB; UK group) sells Type 3 and Type 4 cylinders and is developing a 700 bar Type 4 hydrogen cylinder. NordSpace, Reaction Dynamics and Stelia North America have space composite vessels in development. No flight-qualified oxygen or hydrogen vessel found from a Canadian supplier. Canadian supply moat: global suppliers are many (Hexagon, Luxfer, L3Harris/ARDE, Lincoln, HyPerComp, NPROXX). Canadian plants of foreign groups include Luxfer (Calgary) and Hexagon Purus (Kelowna, BC). Dual-use: gas cylinders for industrial gas and medical oxygen are a mature market (about USD 7.1 to 7.8 billion in 2024). Type 4 composite cylinders are sold for natural gas and hydrogen vehicles, and COPV technology moved from NASA Marshall to US highway use. International alignment: NASA overlap is direct (LISTER on a NASA commercial lunar mission, NORS for the ISS, NASA trade study favoring gaseous oxygen under 50 days). No ESA overlap found: PROSPECT extracts oxygen but no ESA gas storage work was found. Limit: the only lunar-surface store is 260 g of nitrogen in two tanks for one fill, and no oxygen or hydrogen store has a reported test of pressure cycles, permeation or thermal behavior. Card: E08 (fact-checked)."}, "hydrogen-reduction-of-ilmenite": {"at": "2026-11-25T21:30:00.000Z", "by": "nikki", "v": "Pilot configuration is the Eagle Engineering 1988 reactor train on the separated mare basalt stream, a 90 wt% ilmenite concentrate from 33 wt% ilmenite basalt: lock-hopper feed, fluidized-bed reactor and heater, electrolysis cell, recycle blower, cyclones and discharge hopper, 2,533 kg and 57.8 kW electrical (derived) for 2 t LOX a month [eagle-engineering-1988-lunar-oxygen-pilot-plant]. On 1 wt% ilmenite highland regolith the Guerrero-Gonzalez oxygen subsystem is 21,904 kg and 1,025.81 kW for 8.93 t/a O2 [guerrero-gonzalez-2023-isru-plant-mass-power]. NASA states TRL 5/6 [sanders-2025-nasa-isru-progress-review]; no reactor run in vacuum is on file, and ROxygen ran 8 kg tephra batches in open air at Mauna Kea in 2008 [mueller-2009-lunar-regolith-simulant-feed-system-hydrogen-reduction]. Chris Dreyer calls the method mature on ilmenite only and names Orbitec and ROxygen as reference hardware [dreyer-2026-lsei-review-call]. CSMC holds a CSA HYDRO+ gas reduction prototyping contract (December 2023) [csa-2023-canada-reaches-for-moon-lunar-exploration]."}, "icy-regolith-excavation": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a milling-bit icy-regolith excavator of the Terra Engineering class, 325.3 kg, which collected 311.6 kg in 60 min on 250.0 Wh in the 2025 Break the Ice Finals, on soft concrete with no vacuum [leucht-2025-break-the-ice-results]. The PRIMROSE chain trencher completed two trenches at 12 wt% ice before failing (2026) [guadagno-2026-chain-trencher-icy-regolith]; TRL 4. OffWorld lists icy regolith excavation in its Demo 1 under an ESA contract (company slides, 2025) [offworld-2025-prospector-1-lsic-briefing]. Deltion of Sudbury, Ontario, held a CSA contract to advance its DESTIN lunar ice drill (2016) [trifunov-2016-deltion-lunar-drill]; no Canadian excavator is held."}, "in-place-thermal-mining": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is the CSM passive capture tent heated by reflected sunlight, 29 m, 5,000 kg, sized at 350 kW thermal xs-elemental-abundance]; the Pragyan LIBS made 66 investigations, 13 usable [mourlin-2025-chandrayaan-3-libs-challenges]. LIBS is at early field deployment in down-the-hole drilling [kokkinis-2024-automated-drilling-mining-review]. The Curiosity APXS is Canadian-built, no firm named (2016 page) [csa-2016-apxs-mars-science-laboratory]; Canadensys delivered the Lunar Vertex multispectral microscope to APL (July 2023) [spaceq-2023-canadensys-lunar-vertex-microscope]."}, "in-space-cryogenic-transfer": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 7 (Starship Flight 3 moved LOX between two tanks of one vehicle in orbit; no vehicle-to-vehicle or on-orbit methane transfer). Built: Starship Flight 3, 14 March 2024, LOX moved from the nose header tank to the aft main tank in under 100 s under milli-g settling acceleration. Thermal model matched a ground LOX transfer test within 10%. RRM3 ran five no-vent methane transfers on the ground and none on orbit. Mass: 85 kg for intra-vehicle transfer hardware (bottom-up estimate, range 43 to 151 kg; excludes tanks and propellant); a vehicle-to-vehicle coupler pair would add about 25 kg (assumed). Power: 61 W steady during transfer (estimate, range 23 to 132 W), about 4.3 kJ over 70 s; a coupler pair would add about 30 W (assumed); transfer driven mainly by tank pressurization. Canada: no Canadian product for tank-to-tank cryogenic transfer is on sale. Spaceium (nationality disputed) is developing cryogenic transfer with a robotic arm; MDA Space has a non-cryogenic refuelling depot concept; Obruta Space Solutions has a $1 million docking kit award, with no fluid transfer hardware. Cryogenic couplers come from US firms. Canadian supply moat: flown transfer is Starship and NASA-built tools, with US couplers and valves (Altius, L3Harris, Creare, Big Horn Valve), so Canada is neither sole nor one of two. Dual-use: vacuum-insulated transfer lines and Johnston couplings for LH2, LNG and LOX are sold today (Nexans, BUTTING, 6-11-23T10:19:27.000Z", "by": "quinn", "v": "TRL 3 (Quinn ruling, 2026-11-23: rule 2 floor, a concept on hold that lists flown MSolo only as a potential payload inherits no architecture). Built: PRIME-1 MSolo flew on IM-2 Athena (landed 2025-03-06) and ran about 12 h of about 240 h planned: 43 scans, spectra dominated by Earth air and lander vent gas, no drilling result, no ice sampled. No ISRU process step has flown. Mass: MSolo 4.8 kg (7.2 kg with radiator). Power: 34 W nominal at 28 V, 40 W peak. OffWorld Prospector 1 with Lunar Processing Module: no mass, power or rate; progress on hold for funding; launches 2027 and 2029, pilot plants 2031 (OffWorld) and 2033 (NASA), industrial plant 2034. CLPS ceiling $2.6 billion through November 2028 (a project file says $4.2 billion). Canada: card names Canadensys as gravimeter provider on the OffWorld list; the summary does not state its nationality. Canadensys Aerospace is Toronto-based (V); it supplied imaging for the Blue Ghost 1 PlanetVac payload (S); Integrity Testing Laboratory (Markham) flew a CSA-funded dust payload on Blue Ghost 1 (S). No Canadian role in PROSPECT or NASA ISRU demonstrations found. Limit: one gas-instrument flight, no process result; the 2031 and 2033 plants also sit on H1. Card: H16 (fact-check pass 1)."}, "laser-sintering-and-melting-of-regolith": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, commercial laser deposition machines on Earth; Marshall states 5 for its vacuum system). Built: ESA PAVER ~220 mm interlocking pavers from EAC-1A, CO2 laser to 12 kW; Marshall laser system processed simulant in vacuum, 5 to 10% porosity; ICON specimens made in vacuum passed the NASA pad down-select; 500 W diode laser at 10 g/min (2014). Mass: none stated. Power: 3 to 10 kW optical at the bed; electrical kW not stated. Rate: ICON plans small 1 cm pads in under a year with one robot. Canada: none found. Limit: overlapping tracks crack; no pad-size build in vacuum. Card: F06 (fact-checked)."}, "launch-and-lander-propellant-interoperability": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 2 (assigned, rule 1). Built: no interoperable fill hardware. The in-space docking standard IDSS has an interface definition document, first edition 2010, Revision E October 2016 (lewis-2022-docking-system-standardization). ISS Robotic Refueling Mission 3 held methane at zero boil-off for 4 months, then venting expelled it before any transfer (measured; simonini-2024-cryogenic-propellant-management). Mass: none stated for interfaces; depot reference 50 t per tank, 6 to 8 tanks (rough order of magnitude, simonini-2024). Power: none stated; reference transfer rate 0.15 to 4.4 kg/s (rough order of magnitude, simonini-2024). Demand: a commercial lunar base supplying 200 t/yr of propellant in lunar orbit cuts SLS launches for Mars from as many as 12 to 3 (model, nexgen-2015-evolvable-lunar-architecture). Canada: none found on interfaces or fill standards; Spaceium (page lists USA and Canada, Canadian status weakest) tested a refueling actuator in orbit in Feb 2026, no fuel transferred (S). Limit: Lewis states no refuelling interface, fluid, pressure, flow rate or connector design, and no IDSS-S dimensions or adoption date; connectors have little standardisation. No source quantifies lander propellant demand or fill rate; nasa-2025-moon-to-mars-architecture-add-revc lists the Human Landing System element with no propellant figures. Overlap: the (e) cards in-space-cryogenic-transfer and surface-lander-propellant-fill cover transfer physics and surface fill hardware; H3 adds the interface standard and demand. Card: H3 (fact-check pass 1)."}, "lunar-energy-export-and-space-solar-power": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rule 6 model-only; rule 1 TRL 2 also supportable; if rule 6 does not cover economic models the row is TRL 2, Quinn ruling recommended by the TRL reviewer). Built: no hardware. O 26-11-23T09:04:57.000Z", "by": "quinn", "v": "TRL 5 (Quinn ruling, 2026-11-23: MOXIE oxygen generation is flight proven; the plant adds Sabatier methanation, liquefaction and storage, a system not yet qualified). Built: MOXIE ran 16 times on Mars to 7 August 2023, 122 g of oxygen, best rate 12 g/h at 98% purity or better; the KSC laboratory module made 32 g/h of methane at about 99.9% purity from simulated Mars gas. Mass: MOXIE 17.8 kg; Kleinhenz Mars ascent plant 0.9 t (O2 only), 1.7 t (CH4 and O2), 2.2 t (with life support water) (model). Power: MOXIE about 220 W (pre-landing planning value); plant 34 kW, 52 kW and 80 kW for those cases (model). A crew-of-four ascent vehicle needs 2.2 kg/h of oxygen, a stack area about 400 times MOXIE's. Canada: none on the card; none found for Mars ISRU or propellant (Can §3, §4). Limit: no flown liquefaction, storage, methane synthesis or regolith water extraction at ascent scale; Jezero atmospheric density is below any likely human site; no source covers a body beyond the Moon and Mars. Card: H13 (fact-check pass 1)."}, "metal-air-batteries": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 1 (assigned, rule 1). Built: none held; no summary reports a metal-air cell built or tested on regolith-derived metal, and no electrode, electrolyte or cycle data exist on file. The only held text is a sentence in Bergthorson 2015 (bergthorson-2015-direct-combustion-metal-fuels): metal-air batteries (Al, Zn, Fe, Li anodes) need catalysts, catalyst support and electrolyte at low temperature, and dead weight and slow kinetics give low power density (p. 2); the paper compares them with metal combustion and reports no cell. Mass: none stated. Power: none stated; ESA ACME gives no battery content. Canada: Université de Sherbrooke IRC-IPD, doctoral project on the aluminium-air battery (EvAlNR), TRL and funding not stated (S); INRS-UQTR Allard lab lists aluminium-air among battery topics (S); Alcoa Canada and Phinergy Al-air EV battery for a regolith-derived fuel; classified (h) under ruling X13 though the workshop tables list it as cross-cutting. Card: H5 (fact-check pass 4)."}, "metal-fuel-heaters-and-burners": {"at": "2026-11-23T10:19:27.000Z", "by": "quinn", "v": "TRL 4 (Quinn ruling, 2026-11-23: rule 7, ACME thermite vacuum breadboard, partial propagation, heat not measured; Budel is a demonstration plant). Built: ESA ACME vacuum breadboard (Maana Electric, 2021 to 2023) ignited LMS-1/Al, LHS-1/Al and ilmenite/Al mixtures in vacuum; ignition always, propagation not always; heat loss made the energy measurement inaccurate; iron-fuelled steam unit at Budel, Netherlands, 1 MW (terrestrial); the Bergthorson burner with cyclone oxide separator is a concept drawing. Mass: no heater mass in any held summary. Power: the night load to meet is 30 W thermal (10.5 kWh per cycle) for a lander or rover and 625 W thermal (219 kWh per cycle) for a habitat over a 354 h night; no delivered heater power held. Canada: McGill Mechanical Engineering (Bergthorson 2015 burner paper; zero-gravity iron burning) (card); CSA grants $299,937 and $449,948 to McGill (V); Waterloo LEER regolith thermite as lunar-night heat source, laboratory stage (A); Altiro Energy TRL 4, 10 kW prototype (A); NRCan CanmetENERGY 0.3 MWth combustor (A); Canadensys $499,997 tritium lunar-night heater, a different heat source (A). Limit: no vacuum level, reactant mass or lunar-condition heater test; overlaps H5 (same ACME breadboard). Card: H11 (fact-check pass 1)."}, "metal-fuel-regeneration-loop": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rules 7 and 6). Built: no closed loop. Kuhn ran thermogravimetry on purchased terrestrial Fe2O3, Fe3O4 and FeO powders in 5 to 30% H2 at 2 to 15 K/min; Fe2O3 reduction finished at 540 C at 2 K/min and 715 C at 15 K/min with 10% H2 (measured). ESA ACME ignited aluminium with LMS-1, LHS-1 and ilmenite simulants in vacuum; regenerating the oxide is a concept with no test (esa-2023-acme-lunar-night-survival). Bergthorson reports no built combustor or engine. Mass: oxidation adds 43% to the iron mass; the modelled plant burns 263 kg/s of iron (model, kuhn-2022). Power: reduction efficiency 0.91, oxidation 0.43, power-to-power 27% including 70% electrolysis (model, kuhn-2022); Valero Table 4.1 gives 0.72 kW electrical and 0.18 kW thermal per tonne of fuel per year for hydrogen reduction of ilmenite, values flagged misaligned. Canada: McGill AFL, CSA grants $299,937 (21FAMCGA17) and $449,948 (23FAMCGA55) (V); FeX Energy regenerates iron with hydrogen, C$1M IDEaS prize (A); Altiro Energy states TRL 4 (A); no Canadian iron powder from oxide reduction found. Limit: no regolith-derived oxide reduced back to fuel; Kuhn leaves kinetics, sintering, milling and storage losses out of the 27%; Liu 2025 has no regeneration or lunar content. Card: H9 (fact-check pass 1)."}, "metal-powder-preparation-storage-and-handling": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 5 (assigned, rule 3). Built: Spitzer tested four hydrogen-reduced terrestrial iron powders (fluidized bed, smelting plus water atomization, belt furnace fine and coarse) in a 20 L sphere (measured): pmax 2.0 to 3.1 bar g, KSt 4 to 7 bar*m/s, class St1; the coarsest, d50 200 um, did not ignite (St0); the Table 4 row layout is garbled in the summary. PERWAVES fed 20-30 um iron powder (99.8%) with a piston and rotating-wheel feeder on MAXUS-9 (41 runs) and TEXUS-56 (11 runs); in microgravity not all fed powder reached the tube. Hampl built no powder or feeder; regolith-derived particles are cited as below 75 um, over 50% below 300 um, with grinding expected, and dispersion of regolith mixtures is unstudied. Mass: none stated for storage or feeders. Power: none; Spitzer gives theoretical energy density 5.77 to 7.31 MJ/kg (calculated, table garbled). Canada: McGill AFL and the CSA grants above (V); Altiro names Hoeganaes and Tata Steel as iron powder suppliers (A); AP&C, Tekna and P
