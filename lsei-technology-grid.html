ding rockets. Mass: grain 96.8 g; 1979 aluminium alloying furnace 1,215 kg per machine (concept). Power: 60 W laser; furnace 1,150 kW. Performance (calculated at perfect expansion, 20 atm): regolith fuel peak Isp 256 s, 240 to 250 s at O/F 2 to 4; aluminium alone 279 s. Canada: McGill Bergthorson group; CSA grants $299,937 (21FAMCGA17) and $449,948 (23FAMCGA55) (V); FAST 2025 $436,456 (A); CSA Falcon-20 for parabolic flights; Waterloo LEER regolith thermite. Limit: no engine test or measured Isp on a metal fuel made from regolith; ESA lunar-fuel activity (TU Eindhoven) has no public report. Card: H4 (fact-check pass 4, final re-read)."}, "microwave-sintering-of-regolith": {"at": "2026-11-23T10:19:27.000Z", "by": "quinn", "v": "TRL 5 (Quinn ruling, 2026-11-23: rule 8, stationary applicator sintered a 1.4 kg highland simulant paver in vacuum). Built: highland simulant sintered in vacuum under a stationary applicator, 0.5 to 1.4 kg pieces, 6 in tile cracked; lab rigs of 200 W to 3 kW. No moving-applicator test. Mass: lander davit concept ~100 kg (45 kg microwave unit); pad model 4.7 t with four rovers; 2 t paver vehicle (goal). Power: concept 6 kW to the magnetron over 1.5 m2; 2.2 to 2.9 kWh/kg measured; pad model 200 kW, 19.7 MWh inner and 67.8 MWh outer. Canada: Microwave Properties North, Deep River ON (property measurement only); McGill microwave rock weakening (terrestrial, not sintering). Limit: thermal runaway and cracking. Card: F04 (fact-checked)."}, "mobile-cryogenic-transport-tank": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, liquid hydrogen road tankers are in commercial use). Built: nothing built. The Shishko model entry sets a 10-year design life, a 1,000 m plant-to-lander distance, 180 m/hour speed and 2 haulers in the permanently shadowed region. OffWorld roadmap lists fluids storage and transport, on hold at early preliminary design. Mass: 1,000 kg unit dry mass for the Integrated Cryo-Propellant Hauler (model entry, not hardware). Power: 25 W continuous for the passive tank hardware (bottom-up estimate, range 11 to 55 W; excludes platform drive). Active cooling would add about 110 to 210 W and is not needed for transit. Canada: no Canadian developer of a lunar hauler tank found. Cryopeak runs cryogenic trailers assembled in Turkey on a Canadian chassis (an operator, not a tank builder). Cryogenic Vessel Alternatives Canada (Red Deer County, AB) is listed under cryogenic road tankers, products not stated. Canadian supply moat: no Canadian maker found of lunar hauler tanks or of terrestrial cryogenic tank trailers or ISO containers. Global suppliers are many (Chart, Enric, Linde, Air Liquide, Cryolor). Dual-use: cryogenic road, rail and sea tanks are a long-established commercial product (Chart sells ISO containers and LNG and LH2 trailers; 800+ LH2 tanks in service). No lunar hauler tank has been built. International alignment: NASA overlap is at concept level (2008 and 2018 NASA briefings on surface cryogenic transfer, Cryogenic Fluid Management portfolio), with no current NASA mobile tank programme found. No ESA overlap found (Argonaut uses storable propellant). Limit: the tank exists only as one model database entry with a stated mass and no capacity, boil-off or thermal analysis, plus roadmap steps in one company briefing marked on hold. Card: E18 (fact-checked)."}, "modular-habitat-construction": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 3 (assigned). Built: inflatable shell ground articles to 36 ft, burst and vacuum-deploy tests; BEAM on the ISS since 2016. Mass: NASA reference Surface Habitat 12,517 kg predicted, ~127 m3; module structure models 805 to 933 kg; no measured inflatable surface habitat mass. Power: 10 to 15 kW array, 3 kW in eclipse, 155 to 540 kWh for a 100 h eclipse. Canada: Arctic Modular Homes with UNB (terrestrial analogue). Limit: nothing deployed, joined or covered on the lunar surface. Card: F15 (fact-checked)."}, "modular-scalable-isru-plant-design": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rule 6 model-only). Built: no modular plant; NASA JSC tested a full-scale auger-dryer and a NASA-built rover carried the umbilical (Linne 2020); the Giel bucket-drum tool (4.8 kg, 95 kg rover) ran in Tohoku Silica Sand, not lunar simulant. Mass: PSR plant 325 kg against a 350 kg lander payload and Ridge plant 839 kg (Linne, concept); 25 t/a metal plants 6,776 kg (molten regolith electrolysis), 76,145 kg (molten salt plus distillation) and 157,718 kg (hydrogen reduction plus carbonylation) (Guerrero, model). Power: 2,353 W and 4,306 W for the two Linne plants; 311,340 W, 435,310 W and 1,675,160 W for the three Guerrero plants (model). Canada: none on the card; SpaceDIRT (Langley, BC) LSEI study, C$572,862.94, autonomous drilling and material-moving systems (A); no Canadian modular-plant work found. Limit: none of the three summaries gives an add-on unit, reconfiguration case or modularity penalty; overlaps H1 (Guerrero and Linne sizings appear on both); the +51% modularity factor sits in eagle-engineering-1988-lunar-oxygen-pilot-plant, which the card does not cite. Card: H19 (fact-check pass 1)."}, "molten-regolith-electrolysis": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is a Joule-heated cold-wall MRE reactor of the LAMPP class, 1,146 kg and 15 kW sustained for 8,775 kg O2 a year on 100 kg highland batches, the reactor alone, with no mass printed for its transport and collection subsystems [jehn-2024-lunar-alloy-metal-production-plant]; with reactor and handling together, the Guerrero-Gonzalez MRE plant books 2,635 kg plus 684 kg, 3,319 kg (derived) [guerrero-gonzalez-2023-isru-plant-mass-power]. Lunar Resources' LR-1 electrolyzed 25 kg of highland simulant at 45 V and 210 A for 9 h in the KSC ASSIST vacuum chamber, 2.3 wt% O2 at 0.07 kg/h and 0.3 mol O2/kWh against a 0.6 threshold [toro-medina-2026-large-scale-mre-oxygen-relevant-environment]. NASA states TRL 5/6 [sanders-2025-nasa-isru-progress-review]. Blue Origin's Blue Alchemist completed critical design review (company statement) [williams-2025-blue-origin-mre-reactor]. No Canadian actor is on the card [molten-regolith-electrolysis]."}, "molten-salt-electrolysis-ffc": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is the FFC oxygen extraction subsystem of the Guerrero-Gonzalez plant model, 69,868 kg including 65,047 kg of CaCl2 and 310.96 kW for 85.03 t/a O2, plus a separate 430 kg Handling subsystem [guerrero-gonzalez-2023-isru-plant-mass-power]. Laboratory cells removed 85 to 99 % of the oxygen from 24-25 g simulant charges under argon at 1 g [meurisse-2022-lower-temperature-electrochemical-reduction-lunar-regolith-molten-salts, schild-2025-metal-products-molten-salt-highland-simulants]; the oxygen-evolving SnO2 anode broke at 44 h, with off-gas O2 at about 34 % of the starting oxygen [lomax-2020-electrochemical-oxygen-metal-alloys-lunar-regolith]. Carleton/NRC produced aluminium from alumina in a bench FFC-type reactor [context/study/Workshop_1_Report.md, walls-2024-lunar-simulant-to-aluminium]."}, "multi-commodity-resource-logistics": {"at": "2026-11-23T09:22:41.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, optimisation-solver supply-chain planning is in commercial mining use). Built: none; the sources report linear-programme and network models only. Ishimatsu solves a 16-node, 598-arc Earth-Moon-Mars network with 20 commodities in about 12 s preprocessing plus 1.2 s optimisation per run (ishimatsu-2016). Mass: optimised total launch mass to LEO 271.8 t, 68.0% below the DRA 5.0 nuclear-thermal reference and 78.3% below the chemical-aerocapture reference (model, ishimatsu-2016). Power: 2.8 MW (2 MWe plus 0.8 MWt) for 450 t/yr of lunar propellant from 2,450 t/yr of water, $2.4 billion/yr revenue (model, kornuta-2019). Cost: $753M with ISRU against $2,481M Earth-supplied for 10,000 kg O2 and 5,000 kg H2O per year, with 10,905.82 kg slag byproduct (model, gkaravela-2025). The NexGen cost study gives about $40 billion for a base supplying 200 t/yr (model, nexgen-2015). Canada: none found; CSA LSEI ISRU architecture studies, C$2M across four contracts to CSMC, SpaceDIRT and Volta (A), have no stated flow-model content. Limit: Ishimatsu is static, deterministic and linear, one round trip, with ISRU productivity scaling assumed linear; Gkaravela covers only three processes, reports no disposal cost or uncertainty range; no source validates a model against measured plant output. Card: H8 (fact-check pass 1)."}, "neutron-spectrometry": {"at": "2026-11-18T09:56:15.437Z", "by": "quinn", "v": "Pilot configuration is an active pulsed-neutron instrument of the DAN class, flown on Curiosity since 2012. Neutron generator 2.6 kg, 13 W while pulsing; detector 2.1 kg, 3.7-4.5 W; about 4.7 kg and under 18 W per unit [mitrofanov-2012-dan-instrument]. Pulsing gives hydrogen layering to about 1 m. The passive alternative is the CRUX surface probe prototype, 0.48 kg and 1.84 W [elphic-2006-crux-borehole-neutron-probe]. The orbital heritage, LEND on LRO, is 26.3 kg [mitrofanov-2010-lend-instrument]."}, "oxygen-cryocooler-liquefaction": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, commercial cryocoolers liquefy oxygen and nitrogen on Earth). Built: peak constant liquefaction 1.56 kg/h over 48 h against a 1.1 kg/h design rate. 0.42 kg/h at 1.0 lbm/hr ullage injection. liquefaction efficiency 0.74. Mass: 68 kg for the tube-on-tank liquefier. Power: tube-on-tank liquefier 2.87 kW electric. Canada: Quantum Technology Corporation (Squamish, BC) builds helium and hydrogen purifiers and liquefiers, including a 1,500 kg/day hydrogen liquefier and a helium compressor. Advanced Gas Technologies Inc (Markham, ON) manufactures liquefiers and cryocoolers for industrial gases including oxygen and methane. Limit: No cryocooler input power per kilogram liquefied is reported. Card: D18 (fact-checked)."}, "passive-insulation-vapor-cooling": {"at": "2026-11-23T10:19:27.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 3, foam, dome multilayer insulation and vapor-cooled skirt on a 4 m LH2 tank in ground thermal vacuum). Built: SHIIVER tank with foam, dome multilayer insulation (26 reflector layers) and a vapor-cooled aluminum skirt, three LH2 thermal vacuum runs of about 145 h, over 200 h and about 148 h. Dome insulation cut heat load 42 to 58%, with vapor cooling 51 to 62%, and 50 to 61% after a launch-level acoustic test. Mass: 18.5 kg for the dome multilayer insulation only; vapor-cooling system mass not stated. Power: 0 W electrical (passive); heat load into the tank 7,117 W foam-only baseline at 90% fill and 2,537 W postacoustic at 25% fill. Canada: FELLFAB (Hamilton, ON) sells multilayer insulation blankets for space hardware and supplied the Canadarm projects, with a cryogenic tank application unconfirmed. No Canadian maker of cryogenic tank foam, aerogel or vapor-cooled skirt found. Canadian supply moat: one Canadian space blanket maker, no confirmed cryogenic tank insulation maker. Global suppliers are many (Quest Thermal, Aerospace Fabrication & Materials, Aviotec, Air Liquide, Aspen Aerogels). Dual-use: multilayer insulation and foam are sold today for LNG and LH2 tanks, trailers and lines (Frakoterm, Air Liquide). Vapor-cooled shields in vehicle LH2 tanks are patents and research only. International alignment: NASA overlap is direct (SHIIVER is NASA work, Lewis paper on multilayer insulation limits, boil-off reduction concepts). No ESA or Ariane 6 insulation work found. Limit: one tank was tested under upper-stage boundary conditions in runs of days on the ground, leaving passive storage untested at a lunar-surface or permanently shadowed-region thermal sink and over a long hold. Card: E02 (fact-checked)."}, "pem-water-electrolysis": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 7 (demonstrated flight in orbit in the ISS cabin under microgravity conditions). Built: 9.25 kg/day of oxygen is produced in the ISS. Between 2007 and 2025, 14,598 kg of oxygen and 1,825 kg of hydrogen have been produced in the ISS. Mass: 1,487 lb (about 675 kg). Power: The total maximum steady-state power of the OGA is 3955 W in process mode and 497 W in Standby. Canada: ATCO EnPower (1 MW PEM installations for CPKC locomotives). AVL Fuel Cell Canada (Vancouver, BC; electrolyzer stack technologies for aerospace among other uses). Tensor Technologies (PEM electrolyzer bipolar plates and coating service; Mississauga, ON). Limit: No PEM stack has run on lunar-derived water. ISS stack life is limited by membrane thinning and Cell degradation. Card: D06 (fact-checked)."}, "polymer-bound-regolith": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, pellet-fed extrusion on industrial robots is commercial on Earth). Built: KSC gantry printed simulant with 15 to 30 wt% PLA in dirty thermal vacuum, incl. a subscale shelter; 80:20 mix 24 MPa flexural, 50 MPa compression (ambient). Mass: 175 kg lab gantry; shelter polymer budget under 5 t; silicone pad binder 3 t (15 m pad) to 282 t (200 m pad); polymer outer pad 7.6 t (model). Power: ~3 MWh per m3 printed (measured); 0.6 kg/h deposition. Canada: Concordia PEEK with regolith simulant; Concordia, UTIAS, ETS and CSA review. Limit: binder is launched mass. Card: F09 (fact-checked)."}, "product-gas-composition-analysis": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 6 (demonstrated on the surface of Mars, but the trace-CO2 sensor needed extensive calibration, and there was no sustained multi-instrument operation). Built: CO2 and CO NDIR sensors, a trace-CO2 NDIR sensor, and a luminescence O2 sensor were mounted on MOXIE. Mass: Less than 17.8 kg. Power: 1.6 W for two of the four sensors. Canada: One manufacturer of a similar sensor as one of the 4 sensors that formed part of MOXIE's gas composition analyzer is in Canada. Pro-Oceanus Systems manufactures an infrared detector of dissolved CO2 partial pressure. No Canadian provider was found for NDIR CO modules, luminescence O2 sensors, or smartGAS or PyroScience products. Limit: No analyzer has run on the lunar surface or on lunar-derived oxygen. Card: D21 (fact-checked)."}, "psr-optical-imaging": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a rover engineering camera of the Mars 2020 Navcam class, 411 g and 3 W imaging (2020 paper) [maki-2020-mars-2020-engineering-cameras], under VIPER LED-array lights qualified for lunar polar conditions, with no held light mass or power (2024 slides) [bluethmann-2024-viper-rover-overview-mobility, nasa-2020-viper-driving-headlights]. Orbital heritage is ShadowCam on KPLO, 205 times as sensitive as the LROC NAC [humm-2023-calibration-of-shadowcam]; it found no widespread surface ice above a 20 to 30 wt% detection limit [li-2026-shadowcam-psr-water-ice]. Canadensys built a 0.6 kg dual-camera payload and a 360-degree imaging system for Intuitive Machines' IM-1 lander (2024 article) [boucher-2024-canadensys-imagers-im1]."}, "reactor-regolith-feed-and-discharge": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is a lock-hopper feed and discharge hopper set on a 10 atm fluidized-bed reactor, 191 kg with no power load listed, carried with the 2,097 kg reactor and heater and the 29 kg recycle-gas blower it serves, 2,317 kg and 24.29 kW electrical (derived), at 71.3 kg/h feed for 2 t LOX a month [eagle-engineering-1988-lunar-oxygen-pilot-plant]. Sierra Space's COPR ran automated storage, weighing, dosing and slag removal in thermal vacuum below 1e-4 torr in 2024, and its authors state TRL 6 [haggerty-2025-environmental-testing-carbothermal-reactor]. ROxygen fed 8 kg tephra batches through Gemco metal-seal valves at Mauna Kea in 2008; no seal wear life is reported [mueller-2009-lunar-regolith-simulant-feed-system-hydrogen-reduction]. No Canadian actor is on the card [reactor-regolith-feed-and-discharge]."}, "regolith-cover-radiation-shielding": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 3 (assigned). Built: hand-filled Kevlar bag arch and blanket, vermiculite fill, in air; no machine has placed regolith over a structure. Analysis: 50 cm gives ~12 rem/yr (1991); NASA Lunar Safe Haven designs 3 to 7 m of cover, ~50 mSv/yr at 3 m and ~5 mSv/yr at 7 m. Mass: placement by RASSOR 66 kg, blade 160 kg and a 650 kg crane (study estimates); structure mass not set. Power: none stated. Canada: indirect only, a Concordia workshop comment on regolith as filler. Limit: the 15 cm to 7 m design points are not reconciled. Card: F02 (fact-checked)."}, "regolith-crushing-grinding-and-size-sorting": {"at": "2026-11-25T21:30:00.000Z", "by": "nikki", "v": "Pilot configuration is the crushing, grinding and screening train of the Eagle Engineering 1988 lunar oxygen pilot plant on mare basalt: a 4:1 jaw crusher (724 kg, 0.38 kW), a 10:1 cone/gyratory crusher (239 kg, 1.50 kW), a ball mill to a 0.1 mm target (1,914 kg, 16.4 kW) and three screens, the fine vibratory screen at 500 kg and 15 kW, taking 12,892 kg/day of sized basalt for 2 mt LOX a month and passing 7,342 kg/day above 0.03 mm to the magnetic separator [eagle-engineering-1988-lunar-oxygen-pilot-plant]. The same study finds basalt and soil pilot masses nearly identical, 24.7 mt and 24.4 mt, because the basalt case's crushers and grinder offset its lower solids handling, chooses basalt with the caveat that crushing adds complexity, maintenance and wear, and states that screens and ball mills lose capacity in lunar gravity [eagle-engineering-1988-lunar-oxygen-pilot-plant]. A 2023 plant model sizes its particle size separator per Linne et al. at 15,604 kg and 99.70 kW for the hydrogen reduction plant on 1 wt% ilmenite highland regolith [guerrero-gonzalez-2023-isru-plant-mass-power]. NASA STMD states size sorting and mineral separation at TRL 4/5 [sanders-2025-nasa-isru-progress-review]; the KSC Swamp Works hopper and size sorter breadboard (2019) is stated at TRL 4 [collins-2023-lunar-auger-dryer-ladi]; the LES3 sieve mechanism, 1985 g and 6.5 W peak, took up to 100 g per charge in Earth gravity laboratory tests [just-2022-les3-luvmi-x-excavation-sieving]. On Earth, Metso sells primary crushers for hard rock operations [metso-2026-primary-crushing-uptime]; Rio Tinto crushes ilmenite at Lac Tio, Quebec [riotinto-nd-fer-et-titane-quebec-operations]; SGS Canada offers comminution and size classification testing (2019 brochure) [sgs-2019-metallurgical-capabilities-canada]."}, "regolith-grading-compaction-and-berms": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, dozer blades and plate and roller compactors are commercial on Earth). Built: 4.1 m LANCE blade on Chariot cleared 25 x 25 m in ~2.5 h and built a 1.3 m berm in ~4 h (sand, air, 1 g); roller reached 85% relative density in 5 passes; 1.2 kg plate compactor reached 1.77 g/cm3 in vacuum. Mass: blade 160 kg on a 1,000 kg chassis, compactor 400 kg (NASA concept table, estimates); pad model 0.6 t grading, 0.5 t compacting (Metzger and Autry 2023, Table 1). Power: none measured; model 4 kW grading, 4.3 kW compacting, under 0.1 MWh per pad. Canada: terrestrial analogue only, Inuvik to Tuktoyaktuk Highway (GNWT, Tetra Tech). Limit: no grading or berm test in vacuum or low gravity. Card: F01 (fact-checked)."}, "robotic-arm-manipulator": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a four-joint arm of the InSight instrument deployment system class, 9.41 kg requirement ceiling (2018) [trebi-ollennu-2018-insight-instrument-deployment-system], carrying 9 kg at 1.65 m on Mars over 1,442 sols (2023) [golombek-2023-insight-robotic-arm-results]. Its predecessor, the Mars Surveyor '98 arm, was allocated 3.5 kg and 10 W average, 20 W peak (1997) [bonitz-1997-mvacs-robotic-arm-control]. Surveyor III trenched to 15-17.5 cm on the Moon in 1967 [scott-1967-surveyor-iii-soil-mechanics-surface-sampler], TRL 9. Kinova of Boisbriand, Quebec, with arms in nuclear, energy and medical settings, leads the utility rover manipulator (20 March 2026) [kinova-2026-luv-manipulator-consortium]. Redwire delivered the MANUS arm breadboard for ESA's Argonaut lander (21 May 2026) [parsonson-2026-redwire-manus-argonaut-arm]."}, "robotic-assembly-of-modular-truss-structures": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 4 (stated for the Tall Lunar Tower demo; assigned for ARMADAS). Built: three ARMADAS robots assembled a 256-cell lattice shelter autonomously in lab air, 162 hands-on recoveries; Tall Lunar Tower demo built 5 bays (4.5 m) with automated placement and teleoperated alignment. Mass: 50 m power tower system 4,845 kg incl. 2,171 kg batteries and ~383 kg of assembly robots and jig (model); truss 37 to 193 kg by assumption set. Power: robot power not stated; ~30 min per bay expected. Canada: MDA end-of-arm mechanism, CSA $1,000,000 (to be tested, TRL 6 target); Canadarm3 (orbit, no truss assembly). Limit: no vacuum, dust or 1/6 g test. Card: F14 (fact-checked)."}, "sabatier-methanation": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 6 (demonstrated in ISS orbit). Was put out of service in October 2017 after a reactor failure). Built: The reactor used ruthenium on alumina as a catalyst, contained in a stainless steel tube with a heat exchanger. Three 7.0 h runs averaged 32 g/h CH4 at about 99.9% purity on pure CO2, and 95.4% CO2 simulated Mars gas. Mass: 450 lb (about 204 kg) one-time launch weight of the ISS Sabatier CO2 Reduction Assembly (CRA). Power: no source held states electrical power. Canada:  the University of Waterloo (Simakov group) built lab-scale terrestrial Sabatier prototypes. Limit: No Sabatier run in vacuum is reported, there is no reported achieved rate or feed composition for the ISS unit, and no source names a lunar CO2 or CO feed. Canadian capability is academic only. No Canadian commercial Sabatier reactor supplier was found. Card: D10 (fact-checked)."}, "seismic-sensing": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is active seismic profiling of the Apollo 17 LSP class: four geophones, eight explosive packages, central electronics and antenna, 59.31 lb total, 5.3 W basic and 6.8 W peak (1972 handout) [bendix-1972-apollo-17-alsep-familiarization]. The LSP met its objective with all eight packages, and Apollo stations were supported 1969 to 1977; the Apollo 14 thumper misfired 5 of 18 times [bates-1979-alsep-termination-report]. The Farside Seismic Suite is about 45 kg and 5 W at night (2024 paper) [aboobaker-2024-farside-seismic-suite]. Nanometrics of Kanata sells microseismic monitoring to oil and gas operators in the Duvernay and Montney plays (2021 release) [nanometrics-2021-microseismic-oil-gas]."}, "sintered-pavers-and-bricks": {"at": "2026-11-23T09:22:41.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, kiln-fired clay brick is in commercial production on Earth; sources state 2 to 3 for pad construction overall and 3/4). Built: kiln-fired basalt pavers placed by a teleoperated rover (Hawaii); sintered tiles took engine firings with little erosion; 100 g simulant sintered in a vacuum furnace at 1125 C; 74 bricks exposed on Tiangong. Mass: 1.8 t from Earth (model); kiln mass not stated. Power: 41.3 MWh inner pad, 55.9 MWh outer (model). Canada: Kilncore, CSA $500,000 (regolith not named); NORCAT rover and simulant in the 2010 field test (source does not state its role). Limit: no measured paver strength or erosion mass loss. Card: F07 (fact-checked)."}, "solar-cell-fabrication-from-regolith": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 3 (assigned). Built: Si and CdTe diodes on simulant glass (0 to 3% light response); perovskite cells on simulant glass at 8.5 to 12.1%, absorber imported; simulant glass mirrors at 50 to 85% reflectivity. Blue Alchemist passed critical design review, demo scheduled 2026, no data. Mass: two packages of 200 kg or less for 1 m2/h (design goal); 250 kg machine at 1 MW of cells per year (cost model). Power: 0.9 kWh/m2 to fuse the substrate (estimate); silicon supply plant models 15 to 311 kW. Canada: Carleton review, which argues against this route. Limit: no working cell from regolith silicon. Card: F21 (fact-checked)."}, "solar-concentrator-sintering": {"at": "2026-11-23T07:54:50.000Z", "by": "shaun", "v": "TRL 4 (assigned; source says \"nearly 5\", not reached). Built: JSC-2A printed under lamps and a Fresnel lens in air, cm-scale parts; the one vacuum-printed element disintegrated; 1 m2 lens melted 6 mm in 2 to 3 min. Mass: concept only, 20 m wheeled concentrator 18 t. Power: no electrical sintering power; concept collects ~400 kW, 30 m pad in 502 h at 20 m aperture. Strength 130 to 310 psi (second hand). Canada: Carleton melted metal chips with a 1 m2 lens (no regolith sintered). Limit: weak product, no built system. Card: F05 (fact-checked)."}, "solid-oxide-electrolysis": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 6 (Electrolyzer embedded within MOXIE made oxygen from atmospheric CO2 on the Mars surface, a non-lunar feedstock and environment. Runs were intermittent and the steam mode has no flight result). Built: MOXIE 10-cell stack ran at 800 C on Mars atmospheric CO2, with a peak production of 12 g O/h at a purity of 98% or better. Mass: Less than 17.8 kg. Power: 30 to 60 W (10 cells, 2 to 4 A, 1.46 V thermal-neutral). Canada: Versa Power Systems Ltd., Calgary, Alberta, a FuelCell Energy subsidiary makes solid oxide cells and SOEC stacks. Canadian Nuclear Laboratories works on a project on high-temperature steam/CO2 electrolysis with FuelCell Energy. Rio Tinto Fer et Titane, Sorel-Tracy, Quebec, produces scandium oxide at 3 t/yr nameplate, described as used in solid oxide fuel cells. Limit: No stack has run on lunar feed or on the Moon. Steam electrolysis was not performed in the MOXIE system. Card: D08 (fact-checked)."}, "spent-salt-slag-and-electrode-management": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 4 (assigned, rule 6 model-only plus a built component). Built: the MIT Slag and Iron Slicer reported fully operational; feedstock, temperature and cycles not stated; a lab cell consumed about 0.216 g of platinum cathode in a 1.5 h run. Mass: 10,906 kg slag, 27,283 kg metals and 5,029 kg emissions a year for 10 t O2 and 5 t H2O demand (Gkaravela, model); LAMPP slag 4,797 kg/yr; electrolyte at 1:33 regolith-to-salt in one test; electrode life about 300 h (LAMPP). Power: none stated for any handling step. Canada: Carleton (Ellery, a concept, unbuilt); Toronto Azimi Lab slag-derived electrolyte (A); Exterra closed-loop acid recycling on asbestos tailings, no space link (A). Limit: no tested storage, regeneration or stacking of salt, slag or electrodes; slag hazard not characterised. Card: G2 (fact-check pass 4, final re-read)."}, "sulfur-concrete": {"at": "2026-11-23T09:11:45.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, sulfur concrete is a commercial construction material). Built: cast JSC-1 samples with 25 to 35 wt% sulfur, 17 to 47 MPa; cryogenic cycling cut strength to 3 to 8 MPa (7 against 35 MPa in a second study). Mass: none stated; sulfur is 0.06 to 0.13 wt% of high-Ti mare soil, ~1,000 kg from 100 x 100 m x 10 cm. Power: ~0.1 MW-yr thermal per tonne of sulfur (review estimate). Canada: CANMET sulphur concrete (terrestrial). Limit: sulfur sublimes in vacuum, cold cycling cuts strength to about one-fifth, and polar sulfur content is unknown. Card: F11 (fact-checked)."}, "tailings-and-spent-regolith-handling": {"at": "2026-11-23T09:22:41.000Z", "by": "quinn", "v": "TRL 6 (Quinn ruling, 2026-11-23: rule 9, tailings containment is industrial practice under a global standard). Built: Cratos tracked vehicle (0.75 x 0.75 x 0.3 m) picked up, carried and dumped sand in the NASA Glenn SLOPE facility; its conclusions state it can dig trenches and berm, no results given; no vacuum, no spent regolith. Mass: tailings are 87.23 t per t of oxygen (Eagle 1988, model); tailings mass exceeds product mass 16.5 to 87 times in three plant cases; conveyor 23 kg and discharge hopper 102 kg (conceptual). Power: conveyor 0.01 kW (conceptual); nothing measured. Canada: none on the card; no Canadian tailings-stacking work with a space link found. Limit: no stacking, containment, pile geometry or dust-control test with spent regolith; haul of tailings to the pile has no boundary ruling. Card: G1 (fact-check pass 4)."}, "thermal-infrared-radiometry": {"at": "2026-11-18T20:30:00.000Z", "by": "quinn", "v": "Pilot configuration is a mast-mounted uncooled microbolometer radiometer of the CIRiS class, under 1.8 kg and 9.5 W average including heater, 13.7 W peak; CIRiS imaged Earth from low Earth orbit from February 2020 to March 2023 [osterman-2024-ciris-radiometric-calibration-leo]. Orbital heritage is Diviner on LRO, measuring from 5 July 2009 [williams-2017-diviner-global-surface-temperatures]. The lunar-surface variant L-CIRiS is TRL 3, anticipated on CP-22 (2024 page) [lasp-2025-l-ciris-instrument-page]. INO of Canada supplied the 384 x 288 microbolometer for the Lunar Thermal Mapper, lost with Lunar Trailblazer in July 2025 [bowles-2026-lunar-trailblazer-lunar-thermal-mapper]."}, "thermal-water-extraction-excavated": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is a continuous auger-dryer heating excavated icy regolith to about 100 C, sized in the NASA polar water case study at about 300 kg and about 20 kW thermal for 15 mT of water a year [kleinhenz-2020-polar-water-case-studies]. The card TRL 6 rests on the EU LUWEX batch crucible: 474 g of water from 13 kg of icy simulant in thermal vacuum at 2.06 g/h, with LN2 cold fingers and dust-fouled seals [kiewiet-2026-luwex-water-extraction]. NASA's LADI breadboard reached TRL 4 and was cancelled before TRL 5 [sanders-2025-nasa-isru-progress-review, collins-2023-lunar-auger-dryer-ladi]. OffWorld and the Luxembourg Space Agency announced a lunar ice processing programme under ESA oversight (2023 press release) [offworld-2023-luxembourg-lunar-isru-programme]. No Canadian actor held [thermal-water-extraction-excavated]."}, "vacuum-vapour-phase-pyrolysis": {"at": "2026-11-19T08:22:42.000Z", "by": "nikki", "v": "Pilot configuration is a solar-concentrator-heated batch vacuum reactor; no held source gives a reactor or plant mass, and the derived pilot power is 11.4 kW electrical [robinot-2026-solar-pyrolysis-lunar-regolith-oxygen, steurer-1992-vapor-phase-pyrolysis]. The PROMES-CNRS breadboard measured 35 mg O2 from a 3.38 g EAC-1 pellet under argon at about 13 mbar, 1.05 % of sample mass and 31 mg O2/kWh [robinot-2026-solar-pyrolysis-lunar-regolith-oxygen]. Windows cracked in nearly every 2005 GSFC test [matchett-2006-lunar-oxygen-vacuum-pyrolysis]. A 2025 review places the process at TRL 2 [robinot-2025-review-oxygen-extraction-vacuum-pyrolysis]. No Canadian actor is on the card [vacuum-vapour-phase-pyrolysis]."}, "waste-gas-and-volatile-byproduct-capture": {"at": "2026-11-23T10:19:27.000Z", "by": "quinn", "v": "TRL 4 (Quinn ruling, 2026-11-23: rule 6, model floor; sulfur yield estimates and an untested sorbent bed concept, no capture article tested). Built: no capture article tested. Apollo 15 and 16 samples heated in vacuum released 12 to 30% of sulfur at 750 C, 50 to 70% at 950 C, 85 to 95% at 1100 C (Vaniman, literature synthesis). The 2013 NASA brief claims a 250 to 400 C lunar-soil sorbent bed traps over 98% of sulfur gases and about two-thirds of halides, with no test basis. Mass: about 1,000 kg of sulfur from a 100 x 100 x 0.1 m patch at 1100 C (estimate); sulfur is about 1% of O2 mass in an oxygen plant. Power: about 0.1 MW-yr of thermal energy per tonne of sulfur (estimate, basis not shown). Canada: none on the card; Alberta Sulphur Research, University of Calgary, is named at the workshop, snippet only, no TRL or space link (S). Limit: no sorbent capacity, lifetime, apparatus or feedstock stated. Card: G3 (fact-check pass 4)."}, "waste-sorting-classification-and-tracking": {"at": "2026-11-23T07:54:50.000Z", "by": "wintta", "v": "TRL 2 (assigned, rule 1 feasibility study). Built: nothing; Pino's three-axis scheme (perishability, hazards, usefulness) is a proposal with no data. Mass: waste 257 kg per habitat for 30 days, 6,420 kg for 365 days (Ewert, model); regolith hopper/sorter 32 kg (Ewert Table 4). Power: regolith hopper/sorter 0.11 kW; Aqua Factorem grain sorting about 100 W (both regolith, not waste). Canada: Waste Parrot, Edmonton, only Canadian LunaRecycle Phase 1 winner (A); Metaspectral, Merlin Plastics and UBC AI sorting, $8.3M (A). Limit: no sorter, classifier or tracker built, modelled or tested; no accuracy or throughput. Card: G6 (fact-check pass 4)."}, "water-cleanup-adsorption-filtration": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": "TRL 7 (on-orbit operation of the ISS Water Processor Assembly on crew-loop wastewater. No cleanup test used lunar-derived water). Built: Started operations on the ISS on 14 November 2008. About 7,548 L of water produced in a year. Mass: 476 kg. Power: 320 W-hr/hr while processing wastewater and 133 W-hr/hr in standby. Canada: CSMC was awarded the CSA's Aqualunar Challenge grand prize for the LunaPure water purification system.  Other Aqualunar teams: 778 Labs, Vancouver; Lotic Technologies, Leduc, Alberta; WaterPuris, Waterloo, Ontario; Sixpenny Architectural Fabrication, Toronto (Lunarwell); University of Calgary team. Terrestrial suppliers of subcomponents: Waterite Technologies; Excalibur Water Systems; Aldex Chemical, Granby, Quebec; Watts Canada; Novagreen, Killam, Alberta; Trojan Technologies, London, Ontario, and Axine Water Technologies, Vancouver; Xebec Adsorption. Limit: Only simulations were run when attempting to remove contaminants from lunar water. The technology was rated TRL 4 by the authors of the published work. Card: D01 (fact-checked)."}}, "format": 2, "order": {"a": {"at": "2026-11-18T09:58:22.759Z", "by": "quinn", "list": ["neutron-spectrometry", "in-situ-mass-spectrometry", "ground-penetrating-radar", "thermal-infrared-radiometry", "psr-optical-imaging", "downhole-instrumented-drill-strings", "in-situ-optical-composition", "gamma-ray-spectrometry", "heat-flow-probes", "seismic-sensing"]}, "b": {"at": "2026-11-18T10:10:18.256Z", "by": "quinn", "list": ["icy-regolith-excavation", "haul-truck-and-conventional-excavation", "excavation-mobile-platform", "robotic-arm-manipulator", "dust-tolerant-mechanisms", "cold-tolerant-actuators", "gravity-fed-hopper-flow", "conveyors-belt-screw-trough"]}, "c": {"at": "2026-11-26T00:10:00.000Z", "by": "nikki", "list": ["magnetic-separation-of-lunar-soils", "electrostatic-separation-of-regolith", "regolith-crushing-grinding-and-size-sorting", "hydrogen-reduction-of-ilmenite", "carbothermal-reduction", "in-place-thermal-mining", "molten-regolith-electrolysis", "molten-salt-electrolysis-ffc", "thermal-water-extraction-excavated", "helium-3-extraction", "vacuum-vapour-phase-pyrolysis"]}}, "scores": {"active-cooling-zero-boil-off": {"1": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 1}, "2": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 1}, "3": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 1}, "4": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 2}, "5": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 2}, "6": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 2}, "7": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 3}, "8": {"at": "2026-11-23T07:54:50.000Z", "by": "federico", "v": 1}}, "asteroid-and-beyond-lunar-resource-economics": {"1": {"at": "2026-11-23T07:5     }

    } else if (parseInt(trls[0], 10) !== parseInt(trl, 10)) {
      out.push({ rule: "V5", detail: "blurb TRL " + trls[0] + " differs from card TRL " + trl });
    }
    return out;
  }

  function bannedProblems(text) {
    var low = String(text == null ? "" : text).toLowerCase().replace(/’/g, "'");
    var out = [];
    BANNED_RE.forEach(function (pr) {
      if (pr[1].test(low)) out.push({ rule: "V7", detail: "banned phrase '" + pr[0] + "'" });
    });
    return out;
  }

  function textProblems(title, blurb, trl, otherTitles) {

    var key = titleKey(title);
    if (key && (otherTitles || []).some(function (o) { return titleKey(o) === key; })) {

    var bl = blurb == null ? "" : String(blurb);

  }

  function canEdit(data, slug, who) {
    var e = entryOf(data, slug);

    return String(who).toLowerCase() === String(e.author).toLowerCase();
  }

  function edit(data, state, slug, who, title, blurb, at) {
    var e = mustEntry(data, slug);
    if (!canEdit(data, slug, who)) {
      var reason = "only the card's owner (" + (e.author || "none") + ") edits its title and blurb";
      return { ok: false, rule: "owner", reason: reason, problems: [{ rule: "owner", detail: reason }] };
    }

    }
    var others = data.technologies.filter(function (t) { return t.slug !== slug; })
      .map(function (t) { return effectiveTitle(data, state, t.slug); });

    if (probs.length) {
      return { ok: false, rule: probs[0].rule, reason: probs[0].rule + " " + probs[0].detail, problems: probs };
    }

  }

  function pendingCount(state) {

  // ------------------------------------------------------------------ export, import (A7, A8, A16)

  // D6: format 2; X-M: all eight sections (empty sections as {}).
  function exportChanges(state, who, cardsCommit, at, syncedAt) {
    var s = cloneState(state);
    return {
      format: 2, by: String(who || "").toLowerCase(), cards_commit: cardsCommit, exported: at,
      synced_at: syncedAt == null ? "" : String(syncedAt),
      moves: s.moves, splits: s.splits, edits: s.edits, order: s.order, tiers: s.tiers, scores: s.scores,
      evidence: s.evidence, checks: s.checks
    };
  }

  // D4 N2: the data version the local changes were made against, and whether the data has moved
  // since (a card push changes cards_commit; any sync changes synced_at).
  function baseOf(data) {
    return { cards_commit: data.cards_commit, synced_at: data.synced_at || "" };
  }

  function isStale(data, base) {
    if (base == null) return false;
    return base.cards_commit !== data.cards_commit || (base.synced_at || "") !== (data.synced_at || "");
  }

  function sortKeys(v) {
    if (Array.isArray(v)) return v.map(sortKeys);
    if (v && typeof v === "object") {
      var out = {};
      Object.keys(v).sort().forEach(function (k) { out[k] = sortKeys(v[k]); });
      return out;
    }
    return v;
  }

  function serializeChanges(obj) {

  function isMap(v) {

  }

  var SECTIONS = ["moves", "splits", "edits", "order", "tiers", "scores", "evidence", "checks"];

  function stateFrom(o) {
    var s = emptyState();
    ["moves", "splits", "edits"].forEach(function (k) {
      if (isMap(o[k])) s[k] = copyMap(o[k]);
    });
    ["order", "tiers", "scores", "evidence", "checks"].forEach(function (k) {
      if (isMap(o[k])) s[k] = deepCopy(o[k]);
    });

  }

  function importChanges(text, who) {
    var o;

    } catch (err) {

    }
    if (!isMap(o)) return { ok: false, reason: "the file is not a JSON changes object" };
    if (o.format !== 1 && o.format !== 2) {
      return { ok: false, reason: "unsupported format " + JSON.stringify(o.format) + " (want 1 or 2)" };
    }
    var me = String(who || "").toLowerCase();
    var by = String(o.by == null ? "" : o.by).toLowerCase();
    if (!me) return { ok: false, reason: "pick your name before importing (the file is by " + by + ")" };
    if (by !== me) {
      return { ok: false, reason: "the file is by " + by + ", but you are " + me + "; import your own file" };
    }
    var secs = o.format === 1 ? SECTIONS.slice(0, 3) : SECTIONS;

  // ------------------------------------------------------------------ D6 ranking, tiers; X-M matrix scores
  // ranking = window.RANKING_DATA (display/ranking.json, format 2); null or undefined reads as empty. One
  // value per field; position rank is set by people; the score rank is computed from the matrix totals.
  // Neither moves the other.

  var D6_KEY = /^C[1-8]$/;

  // X-M: a C1-C8 score key (a D6 export) refuses the file; any other key outside 1-8 too.
  function scoreKeyProblem(scores) {
    var slugs = Object.keys(scores).sort();
    for (var i = 0; i < slugs.length; i++) {
      var f = scores[slugs[i]];
      if (!isMap(f)) return "scores." + slugs[i] + " is not an object";
      var keys = Object.keys(f).sort();
      for (var j = 0; j < keys.length; j++) {
        var k = keys[j];

        if (CAT_IDS.indexOf(k) < 0) return "scores." + slugs[i] + "." + k + ": category must be one of 1-8";
      }

  function rankingSection(ranking, key) {

  function dataScore(ranking, slug, crit) {

  function effectiveOrder(data, ranking, state, area) {

    if (effectiveTier(data, ranking, state, slug) !== "primary") {
      return { ok: false, reason: "a reserve card has no rank; move it to primary first" };
    }
    var area = effectiveArea(data, state, slug);
    var list = flatOrder(data, ranking, state, area);

      return { ok: false, reason: "rank must be a whole number from 1 to " + list.length };
    }

    var s = cloneState(state);

    else s.tiers[slug] = { from: cur, to: tier, at: at };

  function setScore(data, ranking, state, slug, crit, value, at) {
    if (!entryOf(data, slug)) return { ok: false, reason: "unknown technology '" + slug + "'" };
    if (CAT_IDS.indexOf(crit) < 0) return { ok: false, reason: "category must be one of 1-8" };
    if (value !== null && !isScore(value)) return { ok: false, reason: "a score is 1, 2 or 3 (or Clear)" };

    var cur = dataScore(ranking, slug, crit);

  // ------------------------------------------------------------------ X-M evidence and second reader check
  // ranking.evidence / ranking.checks = {slug: {v, by, at}}; local records {from, from_at, to, at}. Text: CRLF

  function dataText(ranking, sec, slug) {

  }

  function normText(t) {

  }

    var cur = rec ? rec.v : null;
    var s = cloneState(state);

  function setCheck(data, ranking, state, slug, text, at) {
    return setText("checks", data, ranking, state, slug, text, at);
  }

  function effectiveText(sec, ranking, state, slug) {

  function effectiveCheck(data, ranking, state, slug) {
    return effectiveText("checks", ranking, state, slug);
  }

  // Section 1.6: the export rows A-N (G and L blank) in position order, unranked appended.
  function exportRows(rows) {
    return rows.map(function (r, i) {
      var sc = CAT_IDS.map(function (c) { return r.scores[c] == null ? null : r.scores[c]; });
      return [i + 1, r.title].concat(sc.slice(0, 4), [null], sc.slice(4), [null, r.evidence, r.check]);
    });
  }

  // CSV, JSON or Markdown of an area's matrix: the ranking.py matrix bytes when no exported row carries a
  // local record. With local records the file name ends _draft, the JSON lists them in `unsynced` and the
  // Markdown carries a draft line; the CSV stays 14 columns.
  function matrixExport(data, ranking, state, area, fmt, who) {
    if (["csv", "json", "md"].indexOf(fmt) < 0) throw new Error("format must be csv, json or md, got '" + fmt + "'");
    var rows = matrixRows(data, ranking, state, area);
    var crit = (ranking && ranking.criteria) || {};
    var unsynced = rows.filter(function (r) { return hasLocal(state, r.slug); }).map(function (r) { return r.slug; });
    var moved = rows.some(function (r) { var m = state && state.moves && state.moves[r.slug]; return !!m; });
    var draft = unsynced.length > 0 || moved || !!(state && state.order && state.order[area]);
    var name = "matrix_" + area + (draft ? "_draft" : "") + "." + fmt;
    var cells = exportRows(rows);
    var text;
    if (fmt === "csv") {
      var head = (crit.columns || []).map(function (c) { return c.header; });
      text = [head].concat(cells).map(function (row) { return row.map(csvCell).join(",") + "\n"; }).join("");
    } else if (fmt === "json") {
      var area0 = (crit.areas || {})[area] || {};
      text = JSON.stringify(sortKeys({
        area: area, sheet: area0.sheet == null ? null : area0.sheet,
        columns: (crit.columns || []).map(function (c) { return c.header; }), cells: CELLS.slice(),
        rows: cells, slugs: rows.map(function (r) { return r.slug; }), unsynced: unsynced
      }), null, 2) + "\n";
    } else {
      var lines = ["| " + MD_HEAD.map(mdCell).join(" | ") + " |", "|" + MD_HEAD.map(function () { return "---|"; }).join("")];
      rows.forEach(function (r, i) {
        var sc = CAT_IDS.map(function (c) { return r.scores[c]; });
        var row = [i + 1, r.title].concat(sc.slice(0, 4), [r.eng], sc.slice(4),
          [r.can, r.total, r.scoreRank, r.pick, r.check]);
        lines.push("| " + row.map(mdCell).join(" | ") + " |");
      });
      var pre = draft ? "Draft by " + (who ? String(who) : "you") +
        " with unsynced local changes; the team list is ranking.py matrix after a sync.\n\n" : "";
      text = pre + lines.join("\n") + "\n";
    }
    return { name: name, text: text };
  }

  // ------------------------------------------------------------------ reconcile (A9)

  // Stale moves (F1): a pending move whose `from` is not the card's current data area (a sync moved
  // the card since). The record stays unchanged so the D4 sync can detect it.
  function moveConflicts(data, state) {
    var out = [];
    Object.keys((state && state.moves) || {}).sort().forEach(function (slug) {
      var e = entryOf(data, slug);
      var m = state.moves[slug];
      if (e && m.from !== e.area && m.to !== e.area) {
        out.push({ slug: slug, from: m.from, to: m.to, home: e.area, at: m.at });
      }
    });
    return out;
  }

  // Re-apply a stale move from the card's current area.
  function reapplyMove(data, state, slug, at) {
    var m = state && state.moves && state.moves[slug];
    if (!m) return cloneState(state);
    return move(data, state, slug, m.to, at);
  }

  // Pending edits rechecked against the current data (F2): TRL and other cards' effective titles.
  function editProblems(data, state) {
    var out = [];
    Object.keys((state && state.edits) || {}).sort().forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) return;
      var ed = state.edits[slug];
      var others = data.technologies.filter(function (t) { return t.slug !== slug; })
        .map(function (t) { return effectiveTitle(data, state, t.slug); });
      var probs = textProblems(ed.title, ed.blurb, e.trl, others);
      if (probs.length) {
        out.push({ slug: slug, rule: probs[0].rule, detail: probs[0].detail, problems: probs });
      }
    });
    return out;
  }

  function reconcile(data, state, ranking) {
    var s = cloneState(state);
    var orphaned = 0;
    var applied = 0;
    var superseded = 0;
    var stale = [];
    var dropped = [];  // se_recheck F4: tier and score records on a slug the data no longer holds
    // D6 ranking records: applied when `to` equals the data value, stale (kept) when `from` differs.
    Object.keys(s.tiers).sort().forEach(function (slug) {
      var r = s.tiers[slug];
      if (!entryOf(data, slug)) {
        dropped.push({ slug: slug, kind: "tier", to: r.to });
        delete s.tiers[slug]; orphaned++; return;
      }
      var cur = dataTier(ranking, slug);
      if (r.to === cur) { delete s.tiers[slug]; applied++; return; }
      if (r.from !== cur) {
        var rec = rankingSection(ranking, "tiers")[slug] || null;
        stale.push({ ref: { kind: "tier", slug: slug }, from: r.from, to: r.to, current: cur,
          by: rec ? rec.by : null, at: rec ? rec.at : null });
      }
    });
    Object.keys(s.scores).sort().forEach(function (slug) {
      var fields = s.scores[slug];
      var known = !!entryOf(data, slug);
      Object.keys(fields).sort().forEach(function (crit) {
        var r = fields[crit];
        if (known && CAT_IDS.indexOf(crit) < 0) {  // X-M: a D6 C1-C8 record (old localStorage) is dropped, listed
          dropped.push({ slug: slug, kind: "score", crit: crit, to: r.to });
          delete fields[crit]; return;
        }
        if (!known) {
          dropped.push({ slug: slug, kind: "score", crit: crit, to: r.to });
          delete fields[crit]; orphaned++; return;
        }
        var cur = dataScore(ranking, slug, crit);
        if (r.to === cur) { delete fields[crit]; applied++; return; }
        if (r.from !== cur) {
          var rec = (rankingSection(ranking, "scores")[slug] || {})[crit] || null;
          stale.push({ ref: { kind: "score", slug: slug, crit: crit }, from: r.from, to: r.to, current: cur,
            by: rec ? rec.by : null, at: rec ? rec.at : null });
        }
      });
      if (!Object.keys(fields).length) delete s.scores[slug];
    });
    // X-M evidence and check records: applied when `to` equals the data text; stale when from_at (or, without
    // it, from) differs from the data record.
    ["evidence", "checks"].forEach(function (sec) {
      var kind = sec === "evidence" ? "evidence" : "check";
      Object.keys(s[sec]).sort().forEach(function (slug) {
        var r = s[sec][slug];
        if (!entryOf(data, slug)) {
          dropped.push({ slug: slug, kind: kind, to: r.to });
          delete s[sec][slug]; orphaned++; return;
        }
        var rec = dataText(ranking, sec, slug);
        var cur = rec ? rec.v : null;
        if (r.to === cur) { delete s[sec][slug]; applied++; return; }
        var isStale = has(r, "from_at") ? r.from_at !== (rec ? rec.at : null) : r.from !== cur;
        if (isStale) {
          stale.push({ ref: { kind: kind, slug: slug }, from: r.from, to: r.to, current: cur,
            by: rec ? rec.by : null, at: rec ? rec.at : null });
        }
      });
    });
    Object.keys(s.order).sort().forEach(function (area) {
      var r = s.order[area];
      var cur = dataOrder(data, ranking, area);
      var stored = storedRanked(data, ranking, area);
      // applied: to equals the data order, or (F2) to filtered to the data's primary cards is the stored list
      if (sameList(r.to, cur) || (stored.length && sameList(dataPrimaryFilter(data, ranking, area, r.to), stored))) {
        delete s.order[area]; applied++; return;
      }
      // se_recheck F4: a slug the data no longer holds (renamed or removed) makes the record stale
      var missing = r.from.concat(r.to).filter(function (x, i, a) { return !entryOf(data, x) && a.indexOf(x) === i; });
      // F1: with from_at, stale only when the stored order's at changed
      var isStale = missing.length > 0 ||
        (has(r, "from_at") ? r.from_at !== storedOrderAt(ranking, area) : !sameList(r.from, cur));
      if (isStale) {
        var rec = rankingSection(ranking, "order")[area] || null;
        var entry = { ref: { kind: "order", area: area }, from: r.from, to: r.to, current: cur,
          by: rec ? rec.by : null, at: rec ? rec.at : null };
        if (missing.length) entry.missing = missing;
        stale.push(entry);
      }
    });
    Object.keys(s.moves).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.moves[slug]; orphaned++; }
      else if (s.moves[slug].to === e.area) { delete s.moves[slug]; applied++; }
    });
    Object.keys(s.splits).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.splits[slug]; orphaned++; }
      else if (!!s.splits[slug].on === !!e.split) { delete s.splits[slug]; applied++; }
      else if (e.split_at && !(Date.parse(s.splits[slug].at) > Date.parse(e.split_at))) {
        // a sync applied a record at least as late (N1/N7): this one would be refused as a conflict
        delete s.splits[slug]; superseded++;
      }
    });
    Object.keys(s.edits).forEach(function (slug) {
      var e = entryOf(data, slug);
      if (!e) { delete s.edits[slug]; orphaned++; }
      else if (s.edits[slug].title === e.title && s.edits[slug].blurb === e.blurb) {
        delete s.edits[slug]; applied++;
      }
    });
    stale = stale.concat(conflictRecords(s, ranking, stale));
    return {
      state: s, orphaned: orphaned, applied: applied, superseded: superseded,
      conflicts: moveConflicts(data, s), invalid: editProblems(data, s), stale: stale, dropped: dropped
    };
  }

  // Stale ranking records of a state (reconcile's `stale` without dropping anything).
  function staleRecords(data, state, ranking) {
    return reconcile(data, state, ranking).stale;
  }

  // Re-apply: from := the current data value; order `to` re-normalized to the area's current primary
  // cards (missing ones appended by title). A record equal to its new `from` is deleted.
  function reapplyRecord(data, ranking, state, ref, at) {
    var s = cloneState(state);
    if (ref.kind === "order") {
      var r = s.order[ref.area];
      if (!r) return s;
      delete s.order[ref.area];
      var cur = dataOrder(data, ranking, ref.area);
      var here = flatOrder(data, ranking, s, ref.area);
      var to = r.to.filter(function (x, i) { return here.indexOf(x) >= 0 && r.to.indexOf(x) === i; });
      to = to.concat(here.filter(function (x) { return to.indexOf(x) < 0; }));
      if (!sameList(to, cur)) s.order[ref.area] = { from: cur, from_at: storedOrderAt(ranking, ref.area), to: to, at: at };
      return s;
    }
    if (ref.kind === "move") {
      var mv = s.moves[ref.slug];
      if (!mv || !entryOf(data, ref.slug)) return s;
      return move(data, s, ref.slug, mv.to, at);
    }
    if (ref.kind === "split") {
      if (s.splits[ref.slug]) s.splits[ref.slug].at = at;
      return s;
    }
    if (ref.kind === "tier") {
      var t = s.tiers[ref.slug];
      if (!t) return s;
      var ct = dataTier(ranking, ref.slug);
      if (t.to === ct) delete s.tiers[ref.slug];
      else s.tiers[ref.slug] = { from: ct, to: t.to, at: at };
      return s;
    }
    if (ref.kind === "evidence" || ref.kind === "check") {
      var sec = ref.kind === "evidence" ? "evidence" : "checks";
      var x = s[sec][ref.slug];
      if (!x) return s;
      var dr = dataText(ranking, sec, ref.slug);
      var dv = dr ? dr.v : null;
      if (x.to === dv) delete s[sec][ref.slug];
      else s[sec][ref.slug] = { from: dv, from_at: dr ? dr.at : null, to: x.to, at: at };
      return s;
    }
    if (ref.kind === "score") {
      var f = s.scores[ref.slug] && s.scores[ref.slug][ref.crit];
      if (!f) return s;
      var cv = dataScore(ranking, ref.slug, ref.crit);
      if (f.to === cv) {
        delete s.scores[ref.slug][ref.crit];
        if (!Object.keys(s.scores[ref.slug]).length) delete s.scores[ref.slug];
      } else s.scores[ref.slug][ref.crit] = { from: cv, to: f.to, at: at };
      return s;
    }
    return s;
  }

  // B1: kept local records on a field the last sync left in conflict (ranking.conflicts), made no later
  // than that conflict: listed with the other people's values. Re-apply re-stamps `at`; Drop deletes.
  function conflictRecords(s, ranking, already) {
    var list = ranking && Array.isArray(ranking.conflicts) ? ranking.conflicts : [];
    var out = [];
    var seen = {};
    already.forEach(function (x) { seen[JSON.stringify(x.ref)] = 1; });
    list.forEach(function (c) {
      var i = String(c.field || "").indexOf(":");
      if (i < 0) return;
      var kind = c.field.slice(0, i), key = c.field.slice(i + 1);
      var rec = null, ref = null, val;
      if (kind === "order") { rec = s.order[key]; ref = { kind: "order", area: key }; }
      else if (kind === "tier") { rec = s.tiers[key]; ref = { kind: "tier", slug: key }; }
      else if (kind === "move") { rec = s.moves[key]; ref = { kind: "move", slug: key }; }
      else if (kind === "split") { rec = s.splits[key]; ref = { kind: "split", slug: key }; }
      else if (kind === "evidence") { rec = s.evidence[key]; ref = { kind: "evidence", slug: key }; }
      else if (kind === "check") { rec = s.checks[key]; ref = { kind: "check", slug: key }; }
      else if (kind === "score") {
        var j = key.lastIndexOf(".");
        var sl = key.slice(0, j), cr = key.slice(j + 1);
        rec = s.scores[sl] && s.scores[sl][cr];
        ref = { kind: "score", slug: sl, crit: cr };
      }
      if (!rec || seen[JSON.stringify(ref)]) return;
      val = kind === "split" ? rec.on : rec.to;
      var people = Array.isArray(c.people) ? c.people : [];
      var last = null;
      people.forEach(function (p) { var t = Date.parse(p.at); if (!isNaN(t) && (last === null || t > last)) last = t; });
      if (last !== null && Date.parse(rec.at) > last) return;
      var others = people.filter(function (p) { return JSON.stringify(p.to) !== JSON.stringify(val); })
        .map(function (p) { return { by: p.by, to: p.to, at: p.at }; });
      out.push({ ref: ref, from: kind === "split" ? null : rec.from, to: val, current: null, conflict: true,
        others: others, by: others.length ? others[0].by : null, at: others.length ? others[0].at : null });
    });
    return out;
  }

  function dropRecord(state, ref) {
    var s = cloneState(state);
    if (ref.kind === "move") delete s.moves[ref.slug];
    else if (ref.kind === "split") delete s.splits[ref.slug];
    if (ref.kind === "order") delete s.order[ref.area];
    else if (ref.kind === "tier") delete s.tiers[ref.slug];
    else if (ref.kind === "evidence") delete s.evidence[ref.slug];
    else if (ref.kind === "check") delete s.checks[ref.slug];
    else if (ref.kind === "score" && s.scores[ref.slug]) {
      delete s.scores[ref.slug][ref.crit];
      if (!Object.keys(s.scores[ref.slug]).length) delete s.scores[ref.slug];
    }
    return s;
  }

  // ------------------------------------------------------------------ storage (A10)

  function loadState(storage) {
    if (!storage) return { state: emptyState(), ok: false };
    var text;
    try {
      text = storage.getItem(STORAGE_KEY);
    } catch (err) {
      return { state: emptyState(), ok: false };
    }
    if (text == null) return { state: emptyState(), ok: true };
    try {
      var o = JSON.parse(text);
      return { state: isMap(o) ? stateFrom(o) : emptyState(), ok: true };
    } catch (err) {
      return { state: emptyState(), ok: true };
    }
  }

  function saveState(storage, state) {
    if (!storage) return false;
    try {
      storage.setItem(STORAGE_KEY, JSON.stringify(cloneState(state)));
      return true;
    } catch (err) {
      return false;
    }
  }

  function storageMessage(ok) {
    return ok ? "" : "This browser blocks local storage: your changes are not saved between reloads. Export them before you close the page.";
  }

  return {
    LETTERS: LETTERS, COLUMNS: COLUMNS, STORAGE_KEY: STORAGE_KEY, BANNED: BANNED.slice(),
    slotsFor: slotsFor, emptyState: emptyState, effectiveArea: effectiveArea,
    effectiveTitle: effectiveTitle, effectiveBlurb: effectiveBlurb, effectiveCounts: effectiveCounts,
    textPending: textPending,
    layout: layout, move: move, undoMove: undoMove, effectiveSplit: effectiveSplit,
    toggleSplit: toggleSplit, textProblems: textProblems, canEdit: canEdit, edit: edit,
    pendingCount: pendingCount, exportChanges: exportChanges, serializeChanges: serializeChanges,
    baseOf: baseOf, isStale: isStale,
    importChanges: importChanges, reconcile: reconcile, moveConflicts: moveConflicts,
    reapplyMove: reapplyMove, editProblems: editProblems, loadState: loadState, saveState: saveState,
    storageMessage: storageMessage, titleKey: titleKey,
    // D6
    CAT_IDS: CAT_IDS.slice(), effectiveTier: effectiveTier, effectiveOrder: effectiveOrder,
    dataOrder: dataOrder, moveRank: moveRank, setRank: setRank, setOrder: setOrder, setTier: setTier,
    effectiveScore: effectiveScore, setScore: setScore, tierCounts: tierCounts,
    capWarnings: capWarnings, rankingPending: rankingPending, staleRecords: staleRecords,
    reapplyRecord: reapplyRecord, dropRecord: dropRecord, matrixRows: matrixRows, lastBy: lastBy,
    // X-M
    setEvidence: setEvidence, setCheck: setCheck, effectiveEvidence: effectiveEvidence,
    effectiveCheck: effectiveCheck, matrixResult: matrixResult, matrixExport: matrixExport,
    signText: signText, checkIsStale: checkIsStale, TEXT_MAX: { evidence: 5000, checks: 80 }
  };
});
</script>
<script>
(function () {
  "use strict";
  var GL = window.GridLogic;
  var data = window.GRID_DATA;
  var ranking = window.RANKING_DATA || null;
  // X-M: the matrix criteria (context/study/ranking_matrix/criteria.json, embedded in ranking.json)
  var CRITERIA = (ranking && ranking.criteria && typeof ranking.criteria === "object" && !Array.isArray(ranking.criteria)) ? ranking.criteria : {};
  var CATS = Array.isArray(CRITERIA.categories) ? CRITERIA.categories : [];
  function catLabel(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return CATS[i].label;
    return "category " + id;
  }
  var ROSTER = ["quinn", "eytan", "federico", "shaun", "wintta", "nikki", "carlos"];
  var WHO_KEY = GL.STORAGE_KEY + "-who";
  var BASE_KEY = GL.STORAGE_KEY + "-base";
  var LETTERS = GL.LETTERS.split("");
  var finePointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  var selftest = /[?&]selftest=1(&|$)/.test(location.search);
  function urlParam(k) {
    var m = new RegExp("[?&]" + k + "=([^&]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  var $ = function (id) { return document.getElementById(id); };
  var bySlug = {};
  data.technologies.forEach(function (t) { bySlug[t.slug] = t; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function nowIso() { return new Date().toISOString(); }
  function collapse(s) { return String(s == null ? "" : s).trim().split(/\s+/).filter(Boolean).join(" "); }

  // se_recheck F4: name each dropped tier or score record (old slug and value), not a count only.
  function droppedText(list) {
    if (!list || !list.length) return "";
    return " Dropped: " + list.map(function (x) {
      if (x.kind === "tier") return x.slug + " tier " + x.to;
      if (x.kind === "evidence" || x.kind === "check") return x.slug + " " + x.kind;
      return x.slug + " " + x.crit + " " + (x.to == null ? "cleared" : x.to);
    }).join("; ") + " (the card was renamed or removed; set the value again on the card under its new name).";
  }

  // Soft hyphens in long words so a narrow tile can wrap them (CSS hyphens: manual shows a hyphen
  // only where a break is taken). Break points: vowel-consonant-vowel and vowel-pair-vowel (before
  // the consonant or the kept pair) and
  // between two consonants that are not a digraph or common onset, at least 2 letters from the
  // start, 3 from the end and 2 from the previous break. Words of 8 to 20 letters only: a longer
  // run is not a word and stays unbroken, so it shows as an overflow. A title that still needs a
  // 4th line gets tighter letter and word spacing (fitTitles); the font stays at 12 px.
  var SHY = "­";
  // Pairs kept together: digraphs and common syllable onsets (tr, pl, st ...).
  var KEEP = {};
  ("ch sh th ph ck ng gh wh qu bl br cl cr dr fl fr gl gr pl pr sc sk sl sm sn sp st sw tr tw wr")
    .split(" ").forEach(function (p) { KEEP[p] = 1; });
  // Dictionary breaks for the long words in the current titles; the vowel/consonant rule below is
  // the fallback for words added by owner edits.
  var DICT = {};
  // Compounds break at the stem (spectro-metry, terra-mechanics) so the word reads at a glance.
  ("au-to-mat-ed au-ton-o-mous bi-o-log-i-cal carbo-thermal cis-lu-nar de-ploy-able dis-man-tling " +
   "down-hole electro-stat-ic ex-ca-va-tion ex-ca-va-tor feed-stock geo-spa-tial hy-dro-gen hy-dro-lox " +
   "mag-net-ic mi-cro-wave reg-o-lith re-source sa-ba-tier shad-owed sin-tered tail-ings " +
   "terra-mechan-ics ac-tu-a-tors ad-he-sion al-tim-e-try anal-y-sis as-sem-bly as-sess-ment " +
   "au-ton-o-my com-pac-tion con-crete con-struc-tion con-vey-ors cryo-gen-ic dis-charge " +
   "elec-trol-y-sis ex-trac-tion hab-i-tats han-dling in-fra-red in-su-la-tion learn-ing " +
   "lique-fac-tion main-te-nance man-u-fac-tur-ing mech-a-nisms meth-a-na-tion mod-el-ling " +
   "or-bit-ers pen-e-trat-ing pipe-lines plat-form pres-sure print-ing pro-cess-ing pro-pel-lant " +
   "py-rol-y-sis ra-di-a-tion re-cov-ery re-duc-tion sep-a-ra-tion sin-ter-ing spectro-meters " +
   "spectro-metry sup-pres-sion sur-fac-es tol-er-ant trac-tion trans-fer um-bil-i-cal " +
   "spectro-meter")
    .split(" ").forEach(function (h) { DICT[h.replace(/-/g, "")] = h; });
  function isVowel(c) { return "aeiouy".indexOf(c) >= 0; }
  function isLetter(c) { return /[a-z]/.test(c); }
  function hyphenateWord(w) {
    if (w.length < 8 || w.length > 20) return w;
    var d = DICT[w.toLowerCase()];
    if (d) {
      var res = "", k = 0;
      for (var j = 0; j < d.length; j++) {
        if (d[j] === "-") { if (k >= 2 && w.length - k >= 3) res += SHY; }
        else res += w[k++];
      }
      return res;
    }
    var lw = w.toLowerCase();
    var out = "";
    var last = 0;
    for (var i = 2; i <= w.length - 3; i++) {
      var a = lw[i - 1], b = lw[i], c = lw[i + 1];
      if (!isLetter(a) || !isLetter(b) || !isLetter(c)) continue;
      var ok = (isVowel(a) && !isVowel(b) && isVowel(c)) ||
        (isVowel(a) && KEEP[b + c] && i + 2 < w.length && isVowel(lw[i + 2])) ||
        (i >= 3 && !isVowel(a) && !isVowel(b) && !KEEP[a + b] && isVowel(lw[i - 2]));
      if (ok && i - last >= 2) { out += w.slice(last, i) + SHY; last = i; }
    }
    return out + w.slice(last);
  }
  function hyphenate(title) {
    return String(title || "").split(/(\s+|-)/).map(function (part) {
      return /^[A-Za-z]+$/.test(part) ? hyphenateWord(part) : part;
    }).join("");
  }

  // ------------------------------------------------------------ storage
  var storage = null;
  try { storage = window.localStorage; } catch (err) { storage = null; }
  function readKey(k) { try { return storage ? storage.getItem(k) : null; } catch (err) { return null; } }
  function writeKey(k, v) {
    try {
      if (!storage) return false;
      if (v == null) storage.removeItem(k); else storage.setItem(k, v);
      return true;
    } catch (err) { return false; }
  }

  var loaded = GL.loadState(storage);
  var storageOk = loaded.ok;
  var rec = GL.reconcile(data, loaded.state, ranking);
  var state = rec.state;
  var who = (readKey(WHO_KEY) || "").toLowerCase();
  // Stored base: JSON {cards_commit, synced_at} (D4); a bare string is a D3 cards_commit.
  function readBase() {
    var raw = readKey(BASE_KEY);
    if (!raw) return null;
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === "object" && !Array.isArray(o)) return o;
    } catch (err) { /* D3 form */ }
    return { cards_commit: raw, synced_at: "" };
  }
  var base = readBase();
  var notes = [];
  if (rec.applied) notes.push(rec.applied + " local change" + (rec.applied === 1 ? " was" : "s were") + " already synced and dropped.");
  if (rec.orphaned) notes.push(rec.orphaned + " local change" + (rec.orphaned === 1 ? "" : "s") + " for technologies no longer in the data dropped." + droppedText(rec.dropped.filter(function (x) { return !/^C[1-8]$/.test(x.crit || ""); })));
  var d6Drop = rec.dropped.filter(function (x) { return /^C[1-8]$/.test(x.crit || ""); });
  if (d6Drop.length) notes.push(d6Drop.length + " old C1-C8 score" + (d6Drop.length === 1 ? "" : "s") + " from before the ranking matrix dropped (" +
    d6Drop.map(function (x) { return x.slug + " " + x.crit + " " + (x.to == null ? "cleared" : x.to); }).join("; ") + "); score the card again on categories 1-8.");
  if (rec.conflicts.length) notes.push(rec.conflicts.length + " local move" + (rec.conflicts.length === 1 ? " was" : "s were") + " made from an area a sync has since changed; open the tile to re-apply or drop.");
  if (rec.invalid.length) notes.push(rec.invalid.length + " local edit" + (rec.invalid.length === 1 ? " no longer passes" : "s no longer pass") + " the text rules against the current cards; open the tile to fix or drop.");
  if (rec.superseded) notes.push(rec.superseded + " local needs-split change" + (rec.superseded === 1 ? " was" : "s were") + " overtaken by a later synced change and dropped; toggle again if you still disagree.");
  if (rec.stale.length) notes.push(rec.stale.length + " local ranking change" + (rec.stale.length === 1 ? " was" : "s were") + " made against a value someone has since changed: Re-apply or Drop below.");
  if (rec.applied || rec.orphaned || rec.superseded || d6Drop.length) persist();

  function persist() {
    storageOk = GL.saveState(storage, state) && loaded.ok;
    if (GL.pendingCount(state) === 0) { base = null; writeKey(BASE_KEY, null); }
    else if (!base) { base = GL.baseOf(data); writeKey(BASE_KEY, JSON.stringify(base)); }
  }

  function setState(next) {
    state = next;
    persist();
    renderAll();
  }

  // ------------------------------------------------------------ header
  function fillWho() {
    var names = {};
    ROSTER.forEach(function (n) { names[n] = 1; });
    data.technologies.forEach(function (t) { if (t.author) names[String(t.author).toLowerCase()] = 1; });
    if (who) names[who] = 1;
    var sel = $("who");
    Object.keys(names).sort().forEach(function (n) {
      var o = document.createElement("option");
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    sel.value = who;
    sel.addEventListener("change", function () {
      who = sel.value;
      writeKey(WHO_KEY, who || null);
      if (popSlug) renderPop();
    });
  }

  function renderStatus() {
    var parts = [];
    var sm = GL.storageMessage(storageOk);
    if (sm) parts.push(sm);
    parts = parts.concat(notes);
    $("status").textContent = parts.join(" ");
    $("pending").textContent = String(GL.pendingCount(state));
    var nc = GL.moveConflicts(data, state).length, ni = GL.editProblems(data, state).length;
    var stale = staleList();
    var iss = [];
    if (nc) iss.push(nc + " stale move" + (nc === 1 ? "" : "s"));
    if (stale.length) iss.push(stale.length + " stale ranking change" + (stale.length === 1 ? "" : "s"));
    if (ni) iss.push(ni + " edit" + (ni === 1 ? "" : "s") + " failing rules");

    $("rkStale").innerHTML = stale.map(function (x) { return '<p class="stale-rec">' + staleHtml(x) + "</p>"; }).join("");
    var line = "Cards at commit " + data.cards_commit + " (" + data.cards_date + "), " +
      data.technologies.length + " technologies, " + data.capacity + " slots per area minimum.";

    $("cardsLine").textContent = line;
    var stale = "";
    if (GL.pendingCount(state) > 0 && GL.isStale(data, base)) {
      var was = "cards commit " + base.cards_commit + (base.synced_at ? ", synced " + base.synced_at : "");
      var now = "cards commit " + data.cards_commit + (data.synced_at ? ", synced " + data.synced_at : "");

  // ------------------------------------------------------------ ranking helpers (D6)
  function staleList() { return GL.staleRecords(data, state, ranking); }

  function titleOf(slug) { return shownTitle(slug); }

  function showVal(v) {
    if (v == null) return "unset";
    if (Array.isArray(v)) return "the older order";

      return '"' + (s.length > 40 ? s.slice(0, 40) + '..." (' + v.length + " characters)" : s + '"');
    }
    return String(v);
  }

  // One stale record: who changed the field since, and Re-apply / Drop.
  function fieldName(ref) {
    if (ref.kind === "order") return "(" + ref.area + ") order";
    if (ref.kind === "tier") return titleOf(ref.slug) + " tier";
    if (ref.kind === "move") return titleOf(ref.slug) + " area";
    if (ref.kind === "split") return titleOf(ref.slug) + " needs split";
    if (ref.kind === "evidence") return titleOf(ref.slug) + " evidence";
    if (ref.kind === "check") return titleOf(ref.slug) + " second reader check";
    return titleOf(ref.slug) + " " + catLabel(ref.crit);
  }

  function otherVal(ref, v) {
    if (ref.kind === "order") return "a different order";
    if (ref.kind === "move") return "(" + v + ")";
    if (ref.kind === "split") return v ? "on" : "off";
    return showVal(v);
  }

  function staleHtml(x) {
    var field = fieldName(x.ref), text;
    if (x.missing) {

      text = "A card in your " + esc(field) + " (" + esc(x.missing.join(", ")) + ") was renamed or removed. " +
        "Re-apply to keep your order on the current cards (a renamed card comes back unranked; rank it again), or Drop.";
    } else if (x.conflict) {
      // B1: two people, one sync, nothing applied
      var names = (x.others || []).map(function (o) { return esc(o.by) + " set it to " + esc(otherVal(x.ref, o.to)); });
      text = esc(field) + ": " + (names.length ? names.join("; ") : "someone set it differently") +
        " in the same sync as you; nothing applied. Re-apply to send yours again, or Drop.";
    } else {
      var mine = x.ref.kind === "order" ? "you ranked" : "you set it to " + showVal(x.to);
      var who = x.by ? esc(x.by) + " set " + esc(field) + (x.at ? " " + esc(String(x.at).slice(0, 10)) : "") +
        " after " + esc(mine) : esc(field) + " changed after " + esc(mine);

  function capFor(tier) { return (ranking && ranking.caps && ranking.caps[tier]) || 25; }

  // ------------------------------------------------------------ grid
  // A stem splitting into two arrowheads (designer gate item 2).
  var SPLIT_SVG = '<svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 9.5V6M5 6L1.5 1.5M1.5 1.5h3M1.5 1.5v3M5 6L8.5 1.5M8.5 1.5h-3M8.5 1.5v3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function conflictOf(slug) {

  }

  function editProblemOf(slug) {
    var list = GL.editProblems(data, state);

    return null;
  }

  function pendingBits(slug) {
    var bits = [];

  // Title shown on the tile and in labels: the slug when extract emptied the text (F3).

  }

  // Tile: no button and no hit area besides the tile itself (D6). Needs split shows as a glyph and in the

  function tileHtml(slug, rank) {

    var pendText = GL.textPending(data, state, slug);
    var split = GL.effectiveSplit(data, state, slug);
    var reserve = GL.effectiveTier(data, ranking, state, slug) === "reserve";

      '" data-slug="' + esc(slug) + '" tabindex="0" aria-label="' + esc(label) + '"' +
      (pendText ? ' title="' + esc(slug) + ': text pending regeneration"' : "") +

      (reserve ? '<span class="rtag" aria-hidden="true" title="Reserve">R</span>' : "") +

  // "P 13/25 · R 3/25"; an over-cap tier shows "<n> / <cap> <tier>" in the warning style (never a block).

  function renderGrid() {

  // Staged fit: plain words first; soft hyphens only in titles that overflow without them; tighter
  // spacing only where the hyphenated title still overflows.
  function overflows(el) { return el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth; }
  function fitTitles() {
    // F3 tiles: "text pending" line, then slug words, dropped from the end (with an ellipsis) until they fit.
    Array.prototype.forEach.call(document.querySelectorAll("#grid .title.tpend"), function (el) {
      var words = el.getAttribute("data-slug-words").split(" ");

      };
      put(n);
      while (n > 0 && overflows(el)) put(--n);

  }

  // The "Matrix criteria" disclosure: rating scale, pass mark, the slide 9 notes and the property table.

    h += '<div class="ctab"><table><thead><tr><th scope="col">Category</th><th scope="col">What it measures</th>' +

  function renderMatrix() {

    }).map(function (t) { return t.slug; }).sort(function (x, y) {

    });

    var th = function (txt, cls) { return '<th scope="col"' + (cls ? ' class="' + cls + '"' : "") + ">" + esc(txt) + "</th>"; };
    h += '<div class="mwrap"><table class="mx primary"><thead><tr><th class="r" scope="col">Position</th>' +

  function mxSlug(el) {
    var row = el.closest("[data-slug]");

  }

  function mxApply(r) {
    if (r.ok) { mxNote = ""; setState(r.state); }
    else { mxNote = "Not changed: " + r.reason + "."; renderMatrix(); }
  }

  $("matrix").addEventListener("click", function (e) {

    var slug = mxSlug(b);
    if (act === "area") { matrixArea = b.getAttribute("data-area"); mxNote = ""; closePop(false); renderMatrix(); }
    else if (act === "up" || act === "down") { mxNote = ""; setState(GL.moveRank(data, ranking, state, slug, act === "up" ? -1 : 1, nowIso())); }
    else if (act === "primary") setState(GL.setTier(data, ranking, state, slug, "primary", nowIso()));
    else if (act === "open") openPop(slug, false, true);
    else if (act === "csv" || act === "json" || act === "md") exportMatrix(act);
  });
  $("matrix").addEventListener("change", function (e) {
    var inp = e.target.closest("[data-mact='set']");

  });
  if (finePointer) {
    var dragSlug = null;
    $("matrix").addEventListener("dragstart", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr) return;
      dragSlug = tr.getAttribute("data-slug");
      tr.classList.add("dragging");
      e.dataTransfer.setData("text/plain", dragSlug);
      e.dataTransfer.effectAllowed = "move";
    });
    $("matrix").addEventListener("dragover", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr || !dragSlug) return;
      e.preventDefault();
      document.querySelectorAll("#matrix tr.dropto, #matrix tr.dropbelow").forEach(function (x) {
        if (x !== tr) x.classList.remove("dropto", "dropbelow");
      });
      // a row dragged downward lands below the drop row, upward above it
      var list = GL.matrixRows(data, ranking, state, matrixArea).map(function (r) { return r.slug; });
      var below = list.indexOf(dragSlug) < list.indexOf(tr.getAttribute("data-slug"));
      tr.classList.toggle("dropbelow", below);
      tr.classList.toggle("dropto", !below);
    });
    $("matrix").addEventListener("drop", function (e) {
      var tr = e.target.closest && e.target.closest("tr[data-slug]");
      if (!tr || !dragSlug) return;
      e.preventDefault();
      var list = GL.matrixRows(data, ranking, state, matrixArea).map(function (r) { return r.slug; });
      var moved = dragSlug;
      var from = list.indexOf(moved), to = list.indexOf(tr.getAttribute("data-slug"));
      dragSlug = null;
      if (from < 0 || to < 0 || from === to) { renderMatrix(); return; }
      // the dragged row takes the drop row's rank
      list.splice(from, 1);
      list.splice(to, 0, moved);
      mxApply(GL.setOrder(data, ranking, state, matrixArea, list, nowIso()));
    });
    $("matrix").addEventListener("dragend", function () {
      dragSlug = null;
      document.querySelectorAll("#matrix tr.dragging, #matrix tr.dropto, #matrix tr.dropbelow").forEach(function (x) { x.classList.remove("dragging", "dropto", "dropbelow"); });
